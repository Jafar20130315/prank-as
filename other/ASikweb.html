<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 font-sans">

<h1 class="text-3xl font-bold mb-6 text-center text-blue-700">👨‍👩‍👧‍👦 Family Hub</h1>

<div class="w-full max-w-lg bg-white p-6 rounded-2xl shadow-xl space-y-6">

  <!-- Xarajat qo'shish -->
  <div class="border p-4 rounded-xl shadow-sm hover:shadow-md transition">
    <h2 class="font-semibold mb-2 text-lg text-blue-600">💸 Xarajat qo'shish</h2>
    <input id="costName" type="text" placeholder="Nomi (non, sut...)" class="border w-full p-2 rounded mb-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    <input id="costAmount" type="number" placeholder="Narxi" class="border w-full p-2 rounded mb-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    <button onclick="addCost()" class="bg-blue-500 text-white px-4 py-2 rounded w-full hover:bg-blue-600 transition">Qo'shish</button>
  </div>

  <!-- Oila ulash -->
  <div class="border p-4 rounded-xl shadow-sm hover:shadow-md transition">
    <h2 class="font-semibold mb-2 text-lg text-green-600">🔗 Oilaga ulash</h2>
    <input id="connectId" type="text" placeholder="Oilaning egasi ID" class="border w-full p-2 rounded mb-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
    <button onclick="connectFamily()" class="bg-green-500 text-white px-4 py-2 rounded w-full hover:bg-green-600 transition">So‘rov yuborish</button>
  </div>

  <!-- Oiladan chiqish -->
  <div class="border p-4 rounded-xl shadow-sm hover:shadow-md transition">
    <h2 class="font-semibold mb-2 text-lg text-red-600">❌ Oiladan chiqish</h2>
    <button onclick="leaveFamily()" class="bg-red-500 text-white px-4 py-2 rounded w-full hover:bg-red-600 transition">Chiqish</button>
  </div>

  <!-- Xabar yuborish -->
  <div class="border p-4 rounded-xl shadow-sm hover:shadow-md transition">
    <h2 class="font-semibold mb-2 text-lg text-purple-600">✉️ Oilaga xabar</h2>
    <input id="messageText" type="text" placeholder="Xabar matni" class="border w-full p-2 rounded mb-2 focus:outline-none focus:ring-2 focus:ring-purple-400"/>
    <button onclick="sendMessage()" class="bg-purple-500 text-white px-4 py-2 rounded w-full hover:bg-purple-600 transition">Yuborish</button>
  </div>

  <!-- Shaxsiy xarajatlar -->
  <div class="border p-4 rounded-xl shadow-sm hover:shadow-md transition">
    <h2 class="font-semibold mb-2 text-lg text-indigo-600">📊 Shaxsiy xarajatlar</h2>
    <pre id="myCosts" class="bg-gray-50 p-2 rounded text-sm overflow-auto h-32"></pre>
    <button onclick="loadCosts()" class="bg-indigo-500 text-white px-4 py-2 rounded w-full mt-2 hover:bg-indigo-600 transition">Yangilash</button>
  </div>

  <!-- Oila xarajatlari -->
  <div class="border p-4 rounded-xl shadow-sm hover:shadow-md transition">
    <h2 class="font-semibold mb-2 text-lg text-teal-600">👨‍👩‍👧‍👦 Umumiy oylik xarajatlar</h2>
    <pre id="familyCosts" class="bg-gray-50 p-2 rounded text-sm overflow-auto h-32"></pre>
    <button onclick="loadFamilyCosts()" class="bg-teal-500 text-white px-4 py-2 rounded w-full mt-2 hover:bg-teal-600 transition">Yangilash</button>
  </div>

  <div id="result" class="text-center text-red-500 font-semibold mt-2"></div>
</div>

<script>
  const API = "https://asikweb.windowsnoutbook.workers.dev"; // Worker URL
  let chatId = "test-user";

  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    chatId = Telegram.WebApp.initDataUnsafe?.user?.id || "tg-test";
  }

  async function addCost() {
    const name = document.getElementById("costName").value.trim();
    const price = document.getElementById("costAmount").value.trim();
    if(!name || !price){ document.getElementById("result").textContent = "Iltimos, nom va narx kiriting"; return; }

    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatId, action: "cost", text: `${price} ${name}` })
      });
      const data = await res.json();
      document.getElementById("result").textContent = data.message || JSON.stringify(data);
      loadCosts();
      loadFamilyCosts();
    } catch(e){ document.getElementById("result").textContent = e.message; }
  }

  async function connectFamily() {
    const ownerId = document.getElementById("connectId").value.trim();
    if(!ownerId){ document.getElementById("result").textContent = "ID kiriting"; return; }

    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatId, action: "connect", ownerId })
      });
      const data = await res.json();
      document.getElementById("result").textContent = data.message || JSON.stringify(data);
    } catch(e){ document.getElementById("result").textContent = e.message; }
  }

  async function leaveFamily() {
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatId, action: "unc" })
      });
      const data = await res.json();
      document.getElementById("result").textContent = data.message || JSON.stringify(data);
      loadFamilyCosts();
    } catch(e){ document.getElementById("result").textContent = e.message; }
  }

  async function sendMessage() {
    const text = document.getElementById("messageText").value.trim();
    if(!text){ document.getElementById("result").textContent = "Xabar yozing"; return; }

    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatId, action: "send", text })
      });
      const data = await res.json();
      document.getElementById("result").textContent = data.message || JSON.stringify(data);
    } catch(e){ document.getElementById("result").textContent = e.message; }
  }

  async function loadCosts() {
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatId, action: "list" })
      });
      const data = await res.json();
      document.getElementById("myCosts").textContent = JSON.stringify(data.data || [], null, 2);
    } catch(e){ document.getElementById("myCosts").textContent = e.message; }
  }

  async function loadFamilyCosts() {
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatId, action: "fam" })
      });
      const data = await res.json();
      document.getElementById("familyCosts").textContent = JSON.stringify(data.report || [], null, 2);
    } catch(e){ document.getElementById("familyCosts").textContent = e.message; }
  }

  // Sahifa yuklanishi bilan jadvalni yuklash
  loadCosts();
  loadFamilyCosts();
</script>

</body>
</html>
