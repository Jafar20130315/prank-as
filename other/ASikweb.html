<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
</style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-white min-h-screen flex flex-col items-center p-6">

<h1 class="text-4xl font-bold text-center text-blue-700 mb-8 drop-shadow-md">👨‍👩‍👧‍👦 Family Hub</h1>

<div class="w-full max-w-2xl space-y-6">

  <!-- Xarajat qo'shish -->
  <div class="card bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-xl font-semibold mb-4 text-blue-600">💸 Xarajat qo'shish</h2>
    <input id="costName" type="text" placeholder="Nomi (non, sut...)" class="border p-3 w-full rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-300"/>
    <input id="costAmount" type="number" placeholder="Narxi" class="border p-3 w-full rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-300"/>
    <button onclick="addCost()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg transition">Qo'shish</button>
  </div>

  <!-- Oila ulash -->
  <div class="card bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-xl font-semibold mb-4 text-green-600">🔗 Oilaga ulash</h2>
    <input id="connectId" type="text" placeholder="Oilaning egasi ID" class="border p-3 w-full rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-green-300"/>
    <button onclick="connectFamily()" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-lg transition">So‘rov yuborish</button>
  </div>

  <!-- Oiladan chiqish -->
  <div class="card bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-xl font-semibold mb-4 text-red-600">❌ Oiladan chiqish</h2>
    <button onclick="leaveFamily()" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-lg transition">Chiqish</button>
  </div>

  <!-- Xabar yuborish -->
  <div class="card bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-xl font-semibold mb-4 text-purple-600">✉️ Oilaga xabar</h2>
    <input id="messageText" type="text" placeholder="Xabar matni" class="border p-3 w-full rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-purple-300"/>
    <button onclick="sendMessage()" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-semibold py-3 rounded-lg transition">Yuborish</button>
  </div>

  <!-- Shaxsiy xarajatlar -->
  <div class="card bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-xl font-semibold mb-4 text-indigo-600">📊 Shaxsiy xarajatlar</h2>
    <pre id="myCosts" class="bg-gray-50 p-3 rounded-lg h-36 overflow-auto text-sm"></pre>
    <button onclick="loadCosts()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-3 rounded-lg mt-3 transition">Yangilash</button>
  </div>

  <!-- Umumiy oila xarajatlari -->
  <div class="card bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-xl font-semibold mb-4 text-teal-600">👨‍👩‍👧‍👦 Umumiy oylik xarajatlar</h2>
    <pre id="familyCosts" class="bg-gray-50 p-3 rounded-lg h-36 overflow-auto text-sm"></pre>
    <button onclick="loadFamilyCosts()" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-semibold py-3 rounded-lg mt-3 transition">Yangilash</button>
  </div>

  <div id="result" class="text-center text-red-500 font-semibold mt-2"></div>

</div>

<script>
const API = "https://asikweb.windowsnoutbook.workers.dev/"; // Worker URL
let chatId = "test-user";

if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  chatId = Telegram.WebApp.initDataUnsafe?.user?.id || "tg-test";
}

// -------------------- FUNKSIYALAR --------------------
async function addCost() {
  const name = document.getElementById("costName").value;
  const price = document.getElementById("costAmount").value;
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ chatId, action: "cost", text: `${price} ${name}` })
    });
    const data = await res.json();
    document.getElementById("result").textContent = data.message || JSON.stringify(data);
    loadCosts();
    loadFamilyCosts();
  } catch(e) { document.getElementById("result").textContent = e.message; }
}

async function connectFamily() {
  const ownerId = document.getElementById("connectId").value;
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ chatId, action: "connect", ownerId })
    });
    const data = await res.json();
    document.getElementById("result").textContent = data.message || JSON.stringify(data);
  } catch(e) { document.getElementById("result").textContent = e.message; }
}

async function leaveFamily() {
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ chatId, action: "unc" })
    });
    const data = await res.json();
    document.getElementById("result").textContent = data.message || JSON.stringify(data);
  } catch(e) { document.getElementById("result").textContent = e.message; }
}

async function sendMessage() {
  const text = document.getElementById("messageText").value;
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ chatId, action: "send", text })
    });
    const data = await res.json();
    document.getElementById("result").textContent = data.message || JSON.stringify(data);
  } catch(e) { document.getElementById("result").textContent = e.message; }
}

async function loadCosts() {
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ chatId, action: "list" })
    });
    const data = await res.json();
    document.getElementById("myCosts").textContent = JSON.stringify(data, null, 2);
  } catch(e) { document.getElementById("myCosts").textContent = e.message; }
}

async function loadFamilyCosts() {
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ chatId, action: "fam" }) // <-- to'g'ri action
    });
    const data = await res.json();
    document.getElementById("familyCosts").textContent = JSON.stringify(data, null, 2);
  } catch(e) { document.getElementById("familyCosts").textContent = e.message; }
}

// Sahifa yuklanishi bilan
loadCosts();
loadFamilyCosts();
</script>

</body>
</html>
