<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>Family Hub — Prank-as</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "#020617",
            card: "#020617",
            accent: "#22c55e"
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-900 text-white min-h-screen p-4">

  <h1 class="text-2xl font-bold mb-4">👨‍👩‍👧‍👦 Family Hub</h1>

  <!-- USER -->
  <div class="bg-slate-800 rounded-xl p-4 mb-4">
    <div class="text-sm text-slate-400">Foydalanuvchi</div>
    <div id="user" class="font-semibold"></div>
  </div>

  <!-- CONNECT -->
  <div class="bg-slate-800 rounded-xl p-4 mb-4">
    <h2 class="font-semibold mb-2">🔗 Oilaga ulanish</h2>
    <input id="ownerId"
      class="w-full p-2 rounded bg-slate-700 mb-2"
      placeholder="Oila egasi ID" />
    <button onclick="connect()"
      class="w-full bg-accent text-black py-2 rounded font-semibold">
      Ulanish
    </button>
  </div>

  <!-- ADD COST -->
  <div class="bg-slate-800 rounded-xl p-4 mb-4">
    <h2 class="font-semibold mb-2">💸 Xarajat qo‘shish</h2>
    <input id="cost"
      class="w-full p-2 rounded bg-slate-700 mb-2"
      placeholder="Masalan: 5000 non" />
    <button onclick="addCost()"
      class="w-full bg-accent text-black py-2 rounded font-semibold">
      Qo‘shish
    </button>
  </div>

  <!-- MONTH TABLE -->
  <div class="bg-slate-800 rounded-xl p-4">
    <h2 class="font-semibold mb-2">📊 Oylik xarajatlar</h2>
    <table class="w-full text-sm">
      <thead class="text-slate-400">
        <tr>
          <th class="text-left">Nomi</th>
          <th class="text-right">So‘m</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>
    <div id="total" class="text-right font-bold mt-2"></div>
  </div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user;
const chatId = user?.id;
document.getElementById("user").innerText =
  user ? `${user.first_name} (ID: ${chatId})` : "Telegram orqali kiring";

const API = "https://asik.windowsnoutbook.workers.dev";

async function connect() {
  const ownerId = ownerIdInput.value;
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ webapp: true, action: "connect", chatId, ownerId })
  });
  alert(await res.text());
}

async function addCost() {
  const text = cost.value;
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ webapp: true, action: "cost", chatId, text })
  });
  alert(await res.text());
  loadMonth();
}

async function loadMonth() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ webapp: true, action: "month", chatId })
  });
  const data = await res.json();

  table.innerHTML = "";
  let sum = 0;
  data.forEach(i => {
    sum += i.amount;
    table.innerHTML += `
      <tr>
        <td>${i.cat}</td>
        <td class="text-right">${i.amount}</td>
      </tr>`;
  });
  total.innerText = "Jami: " + sum;
}

loadMonth();
</script>
</body>
</html>
