<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rangli gradient</title>
  <link rel="icon" type="image/x-icon" href="favicon.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap">
  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Montserrat", serif;
    }

    body {
      touch-action: none;
      background: #111;
      overflow: hidden;
    }

    #canvas {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: hidden;
      z-index: 0;
    }

    /* Modal oynasi */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: linear-gradient(135deg, #ff4d6d, #6d5bff);
      padding: 40px 60px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      color: #fff;
      animation: fadeIn 0.5s ease-out;
      max-width: 600px;
    }

    .modal-content h1 {
      font-size: 50px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(0,0,0,0.7);
    }

    .modal-content p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .modal-content button {
      background: #fff;
      color: #333;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .modal-content button:hover {
      background: #333;
      color: #fff;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Modal ogohlantirish -->
  <div class="modal" id="warningModal">
    <div class="modal-content">
      <h1>Diqqat!</h1>
      <p>Qurilmangiz qotishi yoki sekinlashishi mumkin. Davom etmoqchimisiz?</p>
      <button id="closeModal">Davom etish</button>
    </div>
  </div>

  <script type="module">
    import TubesCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js"

    const app = TubesCursor(document.getElementById('canvas'), {
      tubes: {
        colors: ["#f967fb", "#53bc28", "#6958d5"],
        lights: {
          intensity: 200,
          colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"]
        }
      }
    })

    document.body.addEventListener('click', () => {
      const colors = randomColors(3)
      const lightsColors = randomColors(4)
      app.tubes.setColors(colors)
      app.tubes.setLightsColors(lightsColors)
    })

    function randomColors(count) {
      return new Array(count)
        .fill(0)
        .map(() => "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'))
    }

    // Modalni yopish
    const modal = document.getElementById('warningModal');
    const closeModal = document.getElementById('closeModal');

    closeModal.addEventListener('click', () => {
      modal.style.display = 'none';
    });
  </script>
<script src="/auto-menu.js"></script><script src="auto-menu.js"></script><script src="/new-domain-banner.js"></script>
</body>
</html>
