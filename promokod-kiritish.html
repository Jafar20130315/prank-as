<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promokod kiritish - Prank-as</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#111;padding:20px;}
.ring{position:relative;width:90vw;max-width:500px;aspect-ratio:1;display:flex;justify-content:center;align-items:center;}
.ring i{position:absolute;inset:0;border:2px solid #fff;transition:0.5s;}
.ring i:nth-child(1){border-radius:38% 62% 63% 37%/41% 44% 56% 59%;animation:animate 6s linear infinite;}
.ring i:nth-child(2){border-radius:41% 44% 56% 59%/38% 62% 63% 37%;animation:animate 4s linear infinite;}
.ring i:nth-child(3){border-radius:41% 44% 56% 59%/38% 62% 63% 37%;animation:animate2 10s linear infinite;}
.ring:hover i{border:6px solid var(--clr);filter:drop-shadow(0 0 20px var(--clr));}
@keyframes animate{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes animate2{0%{transform:rotate(360deg);}100%{transform:rotate(0deg);}}
.promoForm{position:absolute;display:flex;flex-direction:column;align-items:center;gap:15px;color:#fff;width:80%;max-width:300px;}
.promoForm h2{text-align:center;font-size:1.5em;margin-bottom:10px;}
.promoForm input[type="text"]{padding:12px 20px;border-radius:40px;border:2px solid #fff;background:transparent;color:#fff;outline:none;width:100%;font-size:1em;}
.promoForm input[type="submit"]{padding:10px 20px;border:none;border-radius:40px;cursor:pointer;font-size:1em;background:linear-gradient(45deg,#00ff0a,#ff0057);transition:0.3s;width:100%;}
.promoForm input[type="submit"]:hover{opacity:0.9;transform:scale(1.05);}
#promoMessage{margin-top:10px;font-size:1em;color:#fff;text-align:center;word-wrap:break-word;}
@media(max-width:480px){.ring{width:90vw;height:90vw;}.promoForm h2{font-size:1.2em;}.promoForm input[type="text"],.promoForm input[type="submit"]{font-size:0.9em;padding:10px 16px;}}
.top-left-menu-toggle{position:fixed;top:15px;left:15px;background:rgba(255,255,255,0.15);border:none;border-radius:12px;padding:10px 12px;cursor:pointer;z-index:2000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);width:48px;height:48px;}
.top-left-menu-toggle:hover{background:rgba(255,255,255,0.35);transform:scale(1.1);}
.top-left-menu-toggle svg{fill:#fff;width:26px;height:26px;}
.dropdown-menu-small{position:fixed;top:70px;left:15px;width:220px;background:rgba(20,20,20,0.95);backdrop-filter:blur(12px);border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.7);padding:15px 10px;display:flex;flex-direction:column;gap:12px;opacity:0;pointer-events:none;transform:translateY(-10px);transition:all 0.35s ease;z-index:1999;}
.dropdown-menu-small.show{opacity:1;pointer-events:auto;transform:translateY(0);}
.dropdown-menu-small a{color:#fff;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:8px;transition:background 0.3s;}
.dropdown-menu-small a:hover{background:rgba(255,255,255,0.12);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:opacity 0.3s ease;z-index:1500;backdrop-filter:blur(3px);}
.overlay.show{opacity:1;pointer-events:auto;}
.top-message{position: fixed;top: 10px;left: 50%;transform: translateX(-50%);background: #222;color: #fff;padding: 10px 20px;border-radius: 10px;box-shadow: 0 4px 8px rgba(0,0,0,0.3);z-index: 99999;opacity: 0;transition: opacity 0.4s ease;font-size: 14px;}
.top-message.show { opacity: 1; }
</style>
</head>
<body>

<div class="ring">
  <i style="--clr:#00ff0a;"></i>
  <i style="--clr:#ff0057;"></i>
  <i style="--clr:#fffd44;"></i>

  <div class="promoForm">
    <h2>Promokodni kiriting</h2>
    <input type="text" id="promoCode" placeholder="Promo kodni kiriting">
    <input type="submit" id="applyPromo" value="Yuborish">
    <div id="promoMessage"></div>
  </div>
</div>

<!-- Menyu tugmasi -->
<button class="top-left-menu-toggle"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></button>
<div class="overlay"></div>
<nav id="dropdown-menu" class="dropdown-menu-small">
  <a href="/index">🏠 Bosh sahifa</a>
  <a href="/disclaimer">Disclaimer</a>
  <a href="#" id="installAppBtn">📱 Ilovani o‘rnatish</a>
  <a href="#" id="resetChoice">♻️ Tanlovni tiklash</a>
  <a href="/promokod-kiritish.html">🎁 Promokod kiritish</a>
  <a href="https://old.prank-as.site">Oldingi saytga qaytish</a>
</nav>

<div class="top-message" id="topMsg"></div>

<script>
function showMessage(text,time=2500){
  const msg=document.getElementById('topMsg');
  msg.textContent=text;
  msg.classList.add('show');
  setTimeout(()=>msg.classList.remove('show'),time);
}

// Menu toggle
const menuBtn=document.querySelector('.top-left-menu-toggle');
const menu=document.getElementById('dropdown-menu');
const overlay=document.querySelector('.overlay');
menuBtn.addEventListener('click',()=>{menu.classList.toggle('show');overlay.classList.toggle('show');});
overlay.addEventListener('click',()=>{menu.classList.remove('show');overlay.classList.remove('show');});

// PWA
let installPrompt;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();installPrompt=e;});
document.getElementById('installAppBtn').addEventListener('click', async()=>{
  if(installPrompt){installPrompt.prompt(); const {outcome}=await installPrompt.userChoice;
    showMessage(outcome==='accepted'?"✅ Ilova o‘rnatilmoqda...":"❌ O‘rnatish bekor qilindi");
    installPrompt=null;}else showMessage("Bu brauzer o‘rnatishni qo‘llamaydi 😕");
});

// Tanlovni tiklash
document.getElementById('resetChoice').addEventListener('click',()=>{
  localStorage.removeItem('promo');
  showMessage("Tanlov tiklandi! Endi sahifani yangilang 🔄");
});

// Promo kod
const validPromos=["ZZ478","WOW4444","PRANK-AS1212"];
document.getElementById("applyPromo").onclick=()=>{
  const code=document.getElementById("promoCode").value.trim();
  const message=document.getElementById("promoMessage");
  if(validPromos.includes(code)){
    localStorage.setItem('promo','true');
    message.innerText="✅ Promo kod tasdiqlandi! Siz premium pranklarni ishlata olasiz!";
    message.style.color="#00ff0a";
  }else{
    localStorage.setItem('promo','false');
    message.innerText="❌ Promokod xato yozilgan yoki muddati o'tgan";
    message.style.color="#ff0000";
  }
};

// Sahifa yuklanganda promo holatini ko‘rsatish
window.addEventListener('DOMContentLoaded', ()=>{
  const message=document.getElementById("promoMessage");
  if(localStorage.getItem('promo')==='true'){
    message.innerText="Siz premium pranklarni ishlata olasiz!";
    message.style.color="#00ff0a";
  }
});
</script>

</body>
      </html>
