<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #debugInfo::-webkit-scrollbar { width: 4px; }
        #debugInfo::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .table-fixed-layout { table-layout: fixed; }
    </style>
</head>

<body class="bg-slate-900 text-white p-4 md:p-6 min-h-screen">
    <div class="max-w-7xl mx-auto">
        <!-- Password Entry -->
        <div id="passwordContainer" class="mb-6 bg-gray-800/50 rounded-2xl border border-white/10 p-8 text-center shadow-2xl">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-2">Baza</h2>
            <div class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto mt-6">
                <input type="password" id="adminPassword" placeholder="Parol..." 
                    class="flex-grow px-4 py-3 rounded-xl bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="checkPassword()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-xl transition font-bold">Davom etish</button>
            </div>
        </div>

        <!-- Main Content -->
        <div id="adminContent" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black tracking-tight">JONLI <span class="text-blue-500">STATISTIKA</span></h1>
                <div class="flex gap-2">
                    <button onclick="loadActivity()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2">
                        <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        Ma'lumotlarni yangilash
                    </button>
                    <button onclick="handleLogout()" class="bg-gray-800 px-4 py-2 rounded-lg text-sm">Chiqish</button>
                </div>
            </div>

            <!-- Debug Log -->
            <div id="debugInfo" class="mb-4 p-3 bg-black/30 rounded-lg font-mono text-[10px] h-20 overflow-y-auto text-blue-300 border border-white/5"></div>

            <!-- Table -->
            <div class="bg-gray-800/40 rounded-xl border border-white/10 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm table-fixed-layout min-w-[900px]">
                        <thead class="bg-white/5 text-gray-400 text-[10px] uppercase tracking-tighter">
                            <tr>
                                <th class="p-4 w-64">Foydalanuvchining ismi</th>
                                <th class="p-4 w-48">Sahifa</th>
                                <th class="p-4 w-40">Vaqt</th>
                                <th class="p-4 w-24 text-center">Davomiylik</th>
                                <th class="p-4 w-40 text-right">IP</th>
                            </tr>
                        </thead>
                        <tbody id="activityTable" class="divide-y divide-white/5">
                            <!-- Data goes here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
  const SUPABASE_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg';
  const ADMIN_PASS = 'admin21100';

  function updateLog(m) {
    const d = document.getElementById('debugInfo');
    d.innerHTML += `<div>> ${m}</div>`;
    d.scrollTop = d.scrollHeight;
    console.log(m);
  }

  // 1) Supabase init - aniqroq va xato bo'lsa logga chiqaradi
  let sb = null;
  (function initSupabase() {
    try {
      if (!window.supabase) {
        updateLog("Supabase kutubxonasi yuklanmadi. CDN ishlamayapti yoki bloklangan.");
        return;
      }
      if (typeof window.supabase.createClient !== "function") {
        // ba'zan createClient supabase ichida bo'ladi
        if (window.supabase?.supabase?.createClient) {
          sb = window.supabase.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          updateLog("Supabase client (supabase.supabase.createClient) yaratildi.");
          return;
        }
        updateLog("createClient topilmadi. console'da window.supabase ni tekshir.");
        return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      updateLog("Supabase client yaratildi.");
    } catch (e) {
      updateLog("Supabase init xato: " + (e?.message || e));
    }
  })();

  function checkPassword() {
    if (document.getElementById('adminPassword').value === ADMIN_PASS) {
      document.getElementById('passwordContainer').classList.add('hidden');
      document.getElementById('adminContent').classList.remove('hidden');
      loadActivity();
    } else {
      updateLog("Parol noto'g'ri.");
    }
  }

  function handleLogout() {
    location.reload();
  }

  function safeDate(val) {
    if (!val) return "—";
    const dt = new Date(val);
    if (isNaN(dt.getTime())) return String(val);
    return dt.toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
  }

  async function loadActivity() {
    const icon = document.getElementById('refreshIcon');
    icon.classList.add('animate-spin');

    try {
      if (!sb) {
        updateLog("Supabase client yo'q. CDN yoki init muammo.");
        return;
      }

      updateLog("Загрузка последних данных из user_activity...");

      const { data, error } = await sb
        .from('user_activity')
        .select('*')
        .order('opened_at', { ascending: false })
        .limit(50);

      if (error) {
        // 2) RLS / permission muammosini ko'rsatib beradi
        updateLog("Supabase error: " + error.message);
        updateLog("Agar 'permission denied' bo'lsa — RLS policy kerak.");
        return;
      }

      if (!data) {
        updateLog("Data null qaytdi.");
        return;
      }

      // 3) Ustun nomlarini tekshirish uchun birinchi row ni chiqarib qo'yamiz
      if (data.length > 0) {
        updateLog("First row keys: " + Object.keys(data[0]).join(", "));
      }

      const tbody = document.getElementById('activityTable');
      tbody.innerHTML = '';

      data.forEach(row => {
        const email = row.user_email || row.email || 'Аноним';
        if (email === 'admin@example.com') return;

        const date = safeDate(row.opened_at || row.created_at || row.time);

        const tr = document.createElement('tr');
        tr.className = "hover:bg-white/5 transition";
        tr.innerHTML = `
          <td class="p-4">
            <div class="font-bold text-blue-300 truncate">${email}</div>
            <div class="text-[10px] text-gray-500">${row.user_name || row.name || 'Guest'}</div>
          </td>
          <td class="p-4">
            <span class="bg-blue-500/10 text-blue-400 px-2 py-1 rounded text-xs border border-blue-500/20">
              /${row.prank_name || row.page || 'index'}
            </span>
          </td>
          <td class="p-4 text-gray-400 text-xs">${date}</td>
          <td class="p-4 text-center font-mono text-xs text-green-400">${(row.duration ?? 0)}s</td>
          <td class="p-4 text-right">
            <div class="text-xs text-gray-300">${row.ip_address || row.ip || '0.0.0.0'}</div>
            <div class="text-[10px] text-gray-500">${row.city || ''} ${row.country || ''}</div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      updateLog(data.length + " ta ma'lumot yangilandi.");
    } catch (e) {
      updateLog("Xato: " + (e?.message || e));
    } finally {
      icon.classList.remove('animate-spin');
    }
  }
</script>

<script src="/auto-menu.js"></script>
<script src="auto-menu.js"></script></body>
</html>
