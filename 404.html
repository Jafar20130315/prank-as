<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bu sahifa mavjud emas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Сброс */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(270deg, #1f1f1f, #111, #222, #333);
      background-size: 800% 800%;
      animation: gradientBG 20s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
      text-align: center;
      flex-direction: column;
    }

    .error-code {
      font-weight: 700;
      font-size: 8rem;
      line-height: 1;
      text-shadow: 0 0 15px rgba(255,255,255,0.3);
      margin-bottom: 0.3em;
      user-select: none;
    }

    h1 {
      font-weight: 600;
      font-size: 2.5rem;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
      margin-bottom: 24px;
    }

    .watermark {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.2);
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      z-index: 1000;
    }

    @media (max-width: 500px) {
      .error-code {
        font-size: 5rem;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <h1>Bu sahifa mavjud emas</h1>
  <div class="watermark">www.prank-as.site</div>
<script src="/auto-menu.js"></script><script src="auto-menu.js"></script><script src="/new-domain-banner.js"></script>
</body>
</html>
