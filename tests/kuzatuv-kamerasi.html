<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Camera System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="app" class="container mx-auto p-4">
        <!-- Role Selection Screen -->
        <div id="roleSelection" class="flex flex-col items-center justify-center min-h-screen space-y-6">
            <h1 class="text-4xl font-bold mb-8">Remote Camera System</h1>
            <button onclick="selectRole('controller')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-lg text-xl transition">
                📱 Controller (Device A)
            </button>
            <button onclick="selectRole('camera')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-8 rounded-lg text-xl transition">
                📷 Camera (Device B)
            </button>
        </div>

        <!-- Controller Screen -->
        <div id="controllerScreen" class="hidden">
            <h2 class="text-3xl font-bold mb-4">Controller Mode</h2>
            <div id="waitingConnection" class="flex flex-col items-center space-y-4">
                <p class="text-xl mb-4">Scan this QR code or enter the code on the Camera device:</p>
                <div id="qrcode" class="bg-white p-4 rounded-lg"></div>
                <p class="text-2xl font-mono bg-gray-800 px-6 py-3 rounded-lg" id="peerIdDisplay"></p>
            </div>
            <div id="activeConnection" class="hidden">
                <div class="mb-4 flex flex-wrap gap-4">
                    <button id="aiToggle" onclick="toggleAI()" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-lg font-semibold transition">
                        AI Detection: OFF
                    </button>
                    <button id="nightModeToggle" onclick="toggleNightMode()" class="bg-yellow-600 hover:bg-yellow-700 px-6 py-2 rounded-lg font-semibold transition">
                        Night Mode: OFF
                    </button>
                    <button id="pttButton" onmousedown="startPTT()" onmouseup="stopPTT()" ontouchstart="startPTT()" ontouchend="stopPTT()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-semibold transition">
                        🎤 Push to Talk
                    </button>
                </div>
                <div class="relative">
                    <video id="remoteVideo" autoplay playsinline class="w-full rounded-lg shadow-lg"></video>
                    <canvas id="detectionCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
                </div>
            </div>
        </div>

        <!-- Camera Screen -->
        <div id="cameraScreen" class="hidden">
            <h2 class="text-3xl font-bold mb-4">Camera Mode</h2>
            <div id="cameraInput" class="space-y-4">
                <p class="text-xl">Enter the Controller's code:</p>
                <input type="text" id="peerIdInput" placeholder="Enter Peer ID" class="w-full px-4 py-2 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:border-blue-500">
                <button onclick="connectToController()" class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-lg font-semibold transition w-full">
                    Connect
                </button>
            </div>
            <div id="cameraActive" class="hidden mt-4">
                <p class="text-xl mb-4 text-green-500">✓ Connected to Controller</p>
                <video id="localVideo" autoplay playsinline muted class="w-full rounded-lg shadow-lg"></video>
                <audio id="remoteAudio" autoplay></audio>
            </div>
        </div>
    </div>

    <script>
        let peer;
        let localStream;
        let remoteStream;
        let currentCall;
        let aiEnabled = false;
        let nightModeEnabled = false;
        let cocoModel;
        let detectionInterval;

        function selectRole(role) {
            document.getElementById('roleSelection').classList.add('hidden');
            if (role === 'controller') {
                document.getElementById('controllerScreen').classList.remove('hidden');
                initController();
            } else {
                document.getElementById('cameraScreen').classList.remove('hidden');
                initCamera();
            }
        }

        function initController() {
            peer = new Peer();
            
            peer.on('open', (id) => {
                document.getElementById('peerIdDisplay').textContent = id;
                new QRCode(document.getElementById('qrcode'), {
                    text: id,
                    width: 256,
                    height: 256
                });
            });

            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                    localStream = stream;
                    localStream.getAudioTracks()[0].enabled = false; // Mute by default
                    call.answer(stream);
                    
                    call.on('stream', (remoteStreamData) => {
                        remoteStream = remoteStreamData;
                        const video = document.getElementById('remoteVideo');
                        video.srcObject = remoteStream;
                        document.getElementById('waitingConnection').classList.add('hidden');
                        document.getElementById('activeConnection').classList.remove('hidden');
                        currentCall = call;
                    });
                });
            });
        }

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: true 
                });
                const video = document.getElementById('localVideo');
                video.srcObject = localStream;
            } catch (err) {
                alert('Camera/Microphone access denied: ' + err.message);
            }
        }

        function connectToController() {
            const peerId = document.getElementById('peerIdInput').value.trim();
            if (!peerId) {
                alert('Please enter a valid Peer ID');
                return;
            }

            peer = new Peer();
            
            peer.on('open', () => {
                const call = peer.call(peerId, localStream);
                
                call.on('stream', (remoteStreamData) => {
                    const audio = document.getElementById('remoteAudio');
                    audio.srcObject = remoteStreamData;
                    document.getElementById('cameraInput').classList.add('hidden');
                    document.getElementById('cameraActive').classList.remove('hidden');
                });

                call.on('error', (err) => {
                    alert('Connection error: ' + err);
                });
            });
        }

        function startPTT() {
            if (localStream) {
                localStream.getAudioTracks()[0].enabled = true;
                document.getElementById('pttButton').classList.add('bg-red-800');
            }
        }

        function stopPTT() {
            if (localStream) {
                localStream.getAudioTracks()[0].enabled = false;
                document.getElementById('pttButton').classList.remove('bg-red-800');
            }
        }

        async function toggleAI() {
            aiEnabled = !aiEnabled;
            const btn = document.getElementById('aiToggle');
            
            if (aiEnabled) {
                btn.textContent = 'AI Detection: ON';
                btn.classList.remove('bg-purple-600', 'hover:bg-purple-700');
                btn.classList.add('bg-purple-800', 'hover:bg-purple-900');
                
                if (!cocoModel) {
                    btn.textContent = 'AI Detection: Loading...';
                    try {
                        cocoModel = await cocoSsd.load();
                    } catch (err) {
                        alert('Failed to load AI model: ' + err.message);
                        aiEnabled = false;
                        btn.textContent = 'AI Detection: OFF';
                        btn.classList.add('bg-purple-600', 'hover:bg-purple-700');
                        btn.classList.remove('bg-purple-800', 'hover:bg-purple-900');
                        return;
                    }
                    btn.textContent = 'AI Detection: ON';
                }
                
                startDetection();
            } else {
                btn.textContent = 'AI Detection: OFF';
                btn.classList.add('bg-purple-600', 'hover:bg-purple-700');
                btn.classList.remove('bg-purple-800', 'hover:bg-purple-900');
                stopDetection();
            }
        }

        async function startDetection() {
            const video = document.getElementById('remoteVideo');
            const canvas = document.getElementById('detectionCanvas');
            const ctx = canvas.getContext('2d');

            async function detect() {
                if (!aiEnabled || !video.videoWidth) return;

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const predictions = await cocoModel.detect(video);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                predictions.forEach(prediction => {
                    if (prediction.class === 'person') {
                        const [x, y, width, height] = prediction.bbox;
                        ctx.strokeStyle = '#FF0000';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(x, y, width, height);
                        
                        ctx.fillStyle = '#FF0000';
                        ctx.font = '18px Arial';
                        ctx.fillText(
                            `Person ${Math.round(prediction.score * 100)}%`,
                            x,
                            y > 20 ? y - 5 : y + 20
                        );
                    }
                });
            }

            detectionInterval = setInterval(detect, 200);
        }

        function stopDetection() {
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
            const canvas = document.getElementById('detectionCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function toggleNightMode() {
            nightModeEnabled = !nightModeEnabled;
            const video = document.getElementById('remoteVideo');
            const btn = document.getElementById('nightModeToggle');
            
            if (nightModeEnabled) {
                video.style.filter = 'brightness(1.5) contrast(1.2) sepia(0.5)';
                btn.textContent = 'Night Mode: ON';
                btn.classList.remove('bg-yellow-600', 'hover:bg-yellow-700');
                btn.classList.add('bg-yellow-800', 'hover:bg-yellow-900');
            } else {
                video.style.filter = 'none';
                btn.textContent = 'Night Mode: OFF';
                btn.classList.add('bg-yellow-600', 'hover:bg-yellow-700');
                btn.classList.remove('bg-yellow-800', 'hover:bg-yellow-900');
            }
        }
    </script>
</body>
</html>
