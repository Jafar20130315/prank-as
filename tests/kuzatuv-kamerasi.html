<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuzatuv kamerasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .tg-card {
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
        }

        .qr-wrapper {
            background: white;
            padding: 16px;
            border-radius: 20px;
            display: inline-block;
            margin: 20px 0;
        }

        .btn-tg {
            background: #3b82f6;
            color: white;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            cursor: pointer;
        }

        .btn-tg:hover {
            background: #2563eb;
            transform: scale(1.02);
        }

        .video-container {
            border-radius: 24px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        #reader video {
            border-radius: 20px;
        }
    </style>
</head>
<body class="p-4">

    <div id="app" class="w-full flex justify-center">
        
        <!-- ГЛАВНОЕ ОКНО (СТИЛЬ TELEGRAM) -->
        <div id="mainAuthScreen" class="tg-card space-y-6 animate-in fade-in zoom-in duration-500">
            <h1 class="text-2xl font-bold tracking-tight">Telefonni kamera sifatida ishlatish</h1>
            <p class="text-slate-400 text-sm">Ushbu QR-kodni telefondan skan qiling</p>

            <!-- 1. QR-КОД и ID -->
            <div class="qr-wrapper shadow-xl">
                <div id="qrcode"></div>
            </div>
            
            <div class="space-y-1">
                <p class="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-bold">Sining ulanish uchun kodingiz</p>
                <p id="peerIdDisplay" class="text-xl font-mono font-bold text-blue-400">...</p>
            </div>

            <div class="space-y-3 pt-4">
                <!-- 2. КНОПКА СКАНЕРА (ДЛЯ ТЕЛЕФОНА) -->
                <button onclick="startScanningMode()" class="btn-tg">
                    <i class="fa-solid fa-qrcode"></i> QR-kodni skan qilish
                </button>

                <!-- 3. ВВОД ВРУЧНУЮ -->
                <button onclick="showManualInput()" class="text-blue-400 text-sm font-medium hover:underline">
                    Kodni o'zim kiritaman
                </button>
            </div>

            <!-- Скрытое поле ввода -->
            <div id="manualInputBlock" class="hidden space-y-3 animate-in slide-in-from-top-2">
                <div class="flex gap-2">
                    <input type="text" id="manualPeerId" placeholder="Kodni kiriting..." 
                        class="flex-1 bg-slate-900 border border-slate-700 p-3 rounded-xl outline-none focus:border-blue-500 text-sm font-mono">
                    <button onclick="connectViaManualId()" class="bg-slate-700 px-4 rounded-xl hover:bg-slate-600 transition">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ОКНО СКАНЕРА (КАМЕРА) -->
        <div id="scannerScreen" class="hidden tg-card space-y-6">
            <h2 class="text-xl font-bold">QR-kodga qarating</h2>
            <div id="reader" class="w-full aspect-square bg-black rounded-2xl overflow-hidden"></div>
            <button onclick="location.reload()" class="text-slate-400 text-sm hover:text-white">Bekor qilish</button>
        </div>

        <!-- ОКНО МОНИТОРА (КОНТРОЛЛЕР) -->
        <div id="monitorScreen" class="hidden w-full max-w-4xl space-y-4">
            <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl">
                <div class="flex items-center gap-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></div>
                    <span class="text-xs font-bold uppercase tracking-widest text-slate-300">Ulangan</span>
                </div>
                <button onclick="location.reload()" class="text-xs font-bold text-red-400">Uzish</button>
            </div>

            <div class="video-container shadow-2xl">
                <video id="remoteVideo" autoplay playsinline muted class="w-full h-auto min-h-[400px] object-cover"></video>
                <canvas id="detectionCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
                
                <!-- PTT Button -->
                <div class="absolute inset-x-4 bottom-6">
                    <button id="pttButton" 
                        onmousedown="startPTT()" onmouseup="stopPTT()" 
                        ontouchstart="startPTT()" ontouchend="stopPTT()"
                        class="w-full bg-blue-600 py-5 rounded-2xl font-bold shadow-2xl flex items-center justify-center gap-3 active:scale-95 transition-transform">
                        <i class="fa-solid fa-microphone"></i> Mikrofon
                    </button>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="toggleAI()" id="aiBtn" class="bg-slate-800 px-6 py-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-robot mr-2"></i>Sun'iy intellekt</button>
                <button onclick="rotateVideo()" class="bg-slate-800 px-6 py-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-rotate mr-2"></i>Burish</button>
                <button onclick="toggleNight()" id="nightBtn" class="bg-slate-800 px-6 py-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-moon mr-2"></i>Qoron'g'i rejim</button>
            </div>
        </div>

        <!-- ОКНО ТРАНСЛЯЦИИ (ТЕЛЕФОН) -->
        <div id="streamingScreen" class="hidden tg-card space-y-6">
            <div class="video-container aspect-[3/4]">
                <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <div class="absolute top-4 left-4 bg-red-600 px-3 py-1 rounded-full text-[10px] font-black">LIVE</div>
            </div>
            <div class="text-center">
                <p class="font-bold">Ulangan</p>
                <p class="text-xs text-slate-500">Tasvirlar uzatilmoqda</p>
            </div>
            <audio id="remoteAudio" autoplay></audio>
        </div>

    </div>

    <script>
        let peer;
        let localStream;
        let videoTrack;
        let currentCall;
        let html5QrCode;
        let aiActive = false;
        let nightActive = false;
        let cocoModel;
        let rotation = 0;
        let isMonitorMode = true;

        // --- ИНИЦИАЛИЗАЦИЯ С AUTO-JOIN ЛОГИКОЙ ---
        window.onload = () => {
            // Check for ?join=ID parameter
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');
            
            if (joinId) {
                // Auto-join mode: This is a camera device
                console.log('Auto-join mode detected. Target ID:', joinId);
                isMonitorMode = false;
                autoJoinAsCamera(joinId);
            } else {
                // Monitor mode: Show QR and wait for camera to connect
                console.log('Monitor mode: Initializing...');
                initMonitorMode();
            }
        };

        // --- MONITOR MODE INITIALIZATION ---
        function initMonitorMode() {
            peer = new Peer();
            
            peer.on('open', (id) => {
                console.log('Monitor Peer ID:', id);
                document.getElementById('peerIdDisplay').textContent = id;
                
                // Create join URL for QR code
                const joinUrl = `${window.location.origin}${window.location.pathname}?join=${id}`;
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: joinUrl,
                    width: 200,
                    height: 200,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff"
                });
            });

            // When camera calls (incoming stream)
            peer.on('call', (call) => {
                console.log('Incoming call from camera...');
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    localStream = stream;
                    localStream.getAudioTracks()[0].enabled = false; // Mute by default
                    
                    call.answer(stream);
                    currentCall = call;
                    
                    call.on('stream', (remoteStream) => {
                        console.log('Remote stream received!');
                        showScreen('monitorScreen');
                        
                        const videoElement = document.getElementById('remoteVideo');
                        videoElement.srcObject = remoteStream;
                        
                        // Ensure video plays (handle autoplay restrictions)
                        videoElement.play().catch(err => {
                            console.error('Video play error:', err);
                            // Try unmuting and playing again
                            videoElement.muted = true;
                            videoElement.play();
                        });
                    });
                }).catch(err => {
                    console.error('Microphone access error:', err);
                    alert('Mikrofonga ruxsat berilmadi');
                });
            });

            peer.on('error', (err) => {
                console.error('Monitor Peer error:', err);
                alert(`Ulanish xatosi: ${err.type}`);
            });

            peer.on('disconnected', () => {
                console.log('Monitor peer disconnected');
            });
        }

        // --- AUTO-JOIN AS CAMERA ---
        async function autoJoinAsCamera(targetId) {
            try {
                console.log('Requesting camera and microphone...');
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: true 
                });
                videoTrack = localStream.getVideoTracks()[0];
                
                console.log('Camera access granted. Connecting to monitor...');
                initCameraStream(targetId);
            } catch (err) {
                console.error('Camera/microphone access error:', err);
                alert("Kameraga ruxsat berilmagan. Sozlamalarni tekshiring.");
                location.reload();
            }
        }

        // --- SCANNING MODE ---
        async function startScanningMode() {
            showScreen('scannerScreen');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: true 
                });
                videoTrack = localStream.getVideoTracks()[0];
                
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        console.log('QR Code scanned:', decodedText);
                        try {
                            const url = new URL(decodedText);
                            const targetId = url.searchParams.get('join');
                            if (targetId) {
                                html5QrCode.stop();
                                initCameraStream(targetId);
                            }
                        } catch (err) {
                            console.error('Invalid QR code URL:', err);
                        }
                    }
                ).catch(err => {
                    console.error('QR Scanner error:', err);
                    alert('Skaner ishga tushmadi');
                });
            } catch (err) {
                console.error('Camera access error:', err);
                alert("Kameraga ruxsat berilmagan");
                location.reload();
            }
        }

        // --- CAMERA STREAMING LOGIC (FIXED) ---
        function initCameraStream(targetId) {
            console.log('Initializing camera stream to:', targetId);
            showScreen('streamingScreen');
            document.getElementById('localVideo').srcObject = localStream;

            // Use global peer object if not initialized, or create new one for camera mode
            if (!peer) {
                peer = new Peer();
            }

            peer.on('open', (myId) => {
                console.log('Camera Peer ID:', myId);
                console.log('Calling monitor at:', targetId);
                
                const call = peer.call(targetId, localStream);
                currentCall = call;
                
                call.on('stream', (remoteAudio) => {
                    console.log('Receiving audio from monitor');
                    document.getElementById('remoteAudio').srcObject = remoteAudio;
                });

                call.on('error', (err) => {
                    console.error('Call error:', err);
                    alert('Ulanish xatosi yuz berdi');
                });

                call.on('close', () => {
                    console.log('Call closed');
                });
            });

            peer.on('error', (err) => {
                console.error('Camera Peer error:', err);
                alert(`Ulanish xatosi: ${err.type}`);
            });

            peer.on('disconnected', () => {
                console.log('Camera peer disconnected');
                peer.reconnect();
            });
        }

        // --- MANUAL INPUT ---
        function showManualInput() {
            document.getElementById('manualInputBlock').classList.toggle('hidden');
        }

        async function connectViaManualId() {
            const id = document.getElementById('manualPeerId').value.trim();
            if (!id) {
                alert('Kodni kiriting');
                return;
            }
            
            console.log('Manual connection to:', id);
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: true 
                });
                videoTrack = localStream.getVideoTracks()[0];
                initCameraStream(id);
            } catch (err) {
                console.error('Manual connection error:', err);
                alert("Internetni tekshirib qayta urinib ko'ring");
            }
        }

        // --- HELPER FUNCTIONS ---
        function showScreen(screenId) {
            console.log('Showing screen:', screenId);
            ['mainAuthScreen', 'scannerScreen', 'monitorScreen', 'streamingScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
            
            if (screenId === 'monitorScreen') {
                document.body.classList.remove('items-center');
                document.body.classList.add('items-start', 'pt-10');
            } else {
                document.body.classList.remove('items-start', 'pt-10');
                document.body.classList.add('items-center');
            }
        }

        function startPTT() {
            if (localStream) {
                localStream.getAudioTracks()[0].enabled = true;
                document.getElementById('pttButton').classList.replace('bg-blue-600', 'bg-red-600');
            }
        }

        function stopPTT() {
            if (localStream) {
                localStream.getAudioTracks()[0].enabled = false;
                document.getElementById('pttButton').classList.replace('bg-red-600', 'bg-blue-600');
            }
        }

        function rotateVideo() {
            rotation = (rotation + 90) % 360;
            document.getElementById('remoteVideo').style.transform = `rotate(${rotation}deg)`;
            document.getElementById('detectionCanvas').style.transform = `rotate(${rotation}deg)`;
        }

        function toggleNight() {
            nightActive = !nightActive;
            const v = document.getElementById('remoteVideo');
            const b = document.getElementById('nightBtn');
            v.style.filter = nightActive ? 'brightness(1.5) contrast(1.2) sepia(0.5)' : 'none';
            b.classList.toggle('bg-blue-600', nightActive);
        }

        async function toggleAI() {
            aiActive = !aiActive;
            const b = document.getElementById('aiBtn');
            if (aiActive) {
                b.classList.add('bg-blue-600');
                b.innerHTML = '<i class="fa-solid fa-robot mr-2"></i>Yuklanmoqda...';
                try {
                    if (!cocoModel) {
                        cocoModel = await cocoSsd.load();
                    }
                    b.innerHTML = '<i class="fa-solid fa-robot mr-2"></i>Faol';
                    detectFrame();
                } catch (err) {
                    console.error('AI model loading error:', err);
                    alert('AI yuklanmadi');
                    aiActive = false;
                    b.classList.remove('bg-blue-600');
                    b.innerHTML = '<i class="fa-solid fa-robot mr-2"></i>Sun\'iy intellekt';
                }
            } else {
                b.classList.remove('bg-blue-600');
                b.innerHTML = '<i class="fa-solid fa-robot mr-2"></i>Sun\'iy intellekt';
            }
        }

        async function detectFrame() {
            if (!aiActive) return;
            const video = document.getElementById('remoteVideo');
            const canvas = document.getElementById('detectionCanvas');
            const ctx = canvas.getContext('2d');
            
            if (video.videoWidth && video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                try {
                    const predictions = await cocoModel.detect(video);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    predictions.forEach(p => {
                        if (p.class === 'person') {
                            ctx.strokeStyle = '#3b82f6';
                            ctx.lineWidth = 4;
                            ctx.strokeRect(...p.bbox);
                            
                            ctx.fillStyle = '#3b82f6';
                            ctx.font = '16px Inter';
                            ctx.fillText(
                                `Odam ${Math.round(p.score * 100)}%`,
                                p.bbox[0],
                                p.bbox[1] > 20 ? p.bbox[1] - 5 : p.bbox[1] + 20
                            );
                        }
                    });
                } catch (err) {
                    console.error('Detection error:', err);
                }
            }
            requestAnimationFrame(detectFrame);
        }
    </script>
</body>
</html>
