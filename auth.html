<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Kirish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center text-white"
      style="background:linear-gradient(135deg,#0f172a,#020617)">

<div class="rounded-3xl p-8 w-full max-w-md text-center"
     style="background:rgba(255,255,255,.06);backdrop-filter:blur(10px)">

  <h1 class="text-4xl font-bold mb-2">Prank-as</h1>

  <p class="text-slate-300 mb-6">
    Tizimga kirish va akkauntingni boshqarish oynasi
  </p>

  <!-- CAPTCHA BOX -->
  <div id="captchaBox" class="mb-5">
    <p class="mb-2">Robot emasligingizni tasdiqlang</p>
    <button id="captchaBtn"
            class="w-full py-3 rounded-2xl font-semibold bg-yellow-400 text-black">
   Davom etish
    </button>
  </div>

  <!-- LOGIN BUTTONS -->
  <div id="loginBox" class="space-y-4">

    <button id="google-login"
            class="w-full py-3 rounded-2xl font-semibold bg-white text-black">
      Google bilan kirish
    </button>

    <button id="telegram-login"
            class="w-full py-3 rounded-2xl font-semibold"
            style="background:#229ED9">
      Telegram bilan kirish
    </button>

  </div>

  <!-- LOGOUT / DELETE -->
  <div id="accountBox" class="hidden space-y-3 mt-6">

    <button id="logout"
            class="w-full py-3 rounded-2xl font-semibold bg-red-500">
      🚪 Chiqish
    </button>

    <button id="deleteAccount"
            class="w-full py-3 rounded-2xl font-semibold bg-black border">
      🗑 Hisobni unutish (o'chirish)
    </button>

  </div>

</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabase = createClient(
    "https://gefaqrfjzwemwuxuoadp.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg"
  )

  const captchaBox = document.getElementById("captchaBox")
  const captchaBtn = document.getElementById("captchaBtn")

  const loginBox = document.getElementById("loginBox")
  const accountBox = document.getElementById("accountBox")

  const googleBtn = document.getElementById("google-login")
  const tgBtn = document.getElementById("telegram-login")
  const logoutBtn = document.getElementById("logout")
  const deleteBtn = document.getElementById("deleteAccount")

  // ====== CAPTCHA ======
  captchaBtn.onclick = () => {
    localStorage.setItem("captcha_ok", "yes")
    captchaBox.classList.add("hidden")
    loginBox.classList.remove("opacity-50")
  }

  // agar allaqachon o'tgan bo'lsa captcha ko‘rsatilmaydi
  if (localStorage.getItem("captcha_ok") === "yes") {
    captchaBox.classList.add("hidden")
  } else {
    loginBox.classList.add("opacity-50")
  }

  // =========================
  // GOOGLE LOGIN
  // =========================
  googleBtn.onclick = async () => {
    await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: "https://prank-as.site" }
    })
  }

  // =========================
  // TELEGRAM LOGIN
  // =========================
  window.onTelegramAuth = async function(user){
    localStorage.setItem("tg_user", JSON.stringify(user))

    await fetch("https://prankasapi.windowsnoutbook.workers.dev/auth",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(user)
    })

    location.href="/"
  }

  tgBtn.onclick = () => {
    const s = document.createElement("script")
    s.src = "https://telegram.org/js/telegram-widget.js?22"

    s.setAttribute("data-telegram-login","prank_as_bot")
    s.setAttribute("data-size","large")
    s.setAttribute("data-request-access","write")
    s.setAttribute("data-onauth","onTelegramAuth(user)")

    document.body.appendChild(s)
  }

  // =========================
  // LOGOUT (sessiya yopiladi)
  // =========================
  logoutBtn.onclick = async () => {
    await supabase.auth.signOut().catch(()=>{})
    localStorage.removeItem("tg_user")
    alert("Chiqildi 👌")
    location.reload()
  }

  // =========================
  // ACCOUNT DELETE (to'liq)
  // =========================
  deleteBtn.onclick = async () => {

    const tg = localStorage.getItem("tg_user")
    let id = null

    if (tg) id = JSON.parse(tg).id

    if (!id) {
      alert("Telegram orqali ro'yxatdan o'tilgan bo'lsa o'chiriladi.")
      return
    }

    await fetch("https://gefaqrfjzwemwuxuoadp.supabase.co/rest/v1/auth_users?id=eq."+id,{
      method:"DELETE",
      headers:{
        "apikey":"YOUR_SERVICE_KEY",
        "Authorization":"Bearer YOUR_SERVICE_KEY"
      }
    })

    localStorage.clear()

    alert("Hisob o'chirildi 🗑")
    location.href="/"
  }

  // =========================
  // UI HOLATINI TEKSHIRISH
  // =========================
  (async () => {
    const { data:{ session }} = await supabase.auth.getSession()

    if (session || localStorage.getItem("tg_user")) {
      // login qilingan holat
      loginBox.classList.add("hidden")
      captchaBox.classList.add("hidden")
      accountBox.classList.remove("hidden")
    }
  })()
</script>

</body>
</html>
