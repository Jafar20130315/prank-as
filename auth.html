<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Prank-as — Google bilan kirish</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            padding: 2rem;
            border-radius: 1.5rem;
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative">

    <div class="glass-card fade-in-up w-full max-w-sm text-center">
        <h2 class="text-3xl font-bold text-white mb-2">Prank-as</h2>
        <p class="text-slate-400 mb-6">Davom etish uchun Google bilan tizimga kiring</p>

        <button id="google-login" class="w-full py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold">
            Google bilan kirish
        </button>

        <div id="msg-container" class="mt-4 text-sm text-center min-h-[20px]">
            <p id="msg"></p>
        </div>
    </div>

    <!-- Supabase JS minified -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>

    <script>
        // O'zing URL va anon key yozasan
        const supabase = supabase.createClient(
            'https://GEFAQRFJZWEMWUXUOADP.supabase.co', // Supabase URL
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg' // Supabase anon key
        )

        const msgContainer = document.getElementById('msg-container')
        const msgText = document.getElementById('msg')

        function showMessage(text, isError=false) {
            msgText.textContent = text
            msgText.style.color = isError ? 'red' : 'limegreen'
        }

        document.getElementById('google-login').onclick = async () => {
            showMessage("Google login oynasi ochilmoqda...", false)
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google'
            })
            if(error) showMessage(error.message, true)
        }
    </script>
</body>
</html>
