<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Активность</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-900 text-white p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Контейнер для ввода пароля -->
        <div id="passwordContainer" class="mb-6 bg-gray-800/30 rounded-2xl border border-white/10 p-6 text-center">
            <h2 class="text-xl font-bold mb-4">Доступ к админ-панели</h2>
            <p class="text-gray-400 mb-4">Введите пароль для просмотра активности пользователей.</p>
            <div class="flex flex-col sm:flex-row gap-2 max-w-md mx-auto">
                <input type="password" id="adminPassword" placeholder="Введите пароль" class="flex-grow px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="checkPassword()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition font-medium">
                    Войти
                </button>
            </div>
        </div>

        <!-- Основной контент админ-панели (изначально скрыт) -->
        <div id="adminContent" class="hidden">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <span>📊</span> Admin Panel - Активность
                </h1>
                <div class="flex gap-2">
                    <button id="loadActivityBtn" onclick="loadActivity()"
                        class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed px-4 py-2 rounded-lg transition font-medium" 
                        disabled>
                        Обновить данные
                    </button>
                    <button onclick="handleLogout()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition text-sm">
                        Выйти
                    </button>
                </div>
            </div>

            <!-- Отладка -->
            <div class="mb-6 p-4 bg-gray-800/50 border border-white/5 rounded-xl text-xs font-mono">
                <div class="text-gray-400 uppercase tracking-wider mb-2 font-bold">Статус системы:</div>
                <div id="debugInfo" class="space-y-1">Инициализация...</div>
            </div>

            <!-- Таблица -->
            <div class="bg-gray-800/30 rounded-2xl border border-white/10 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-white/5 text-gray-400 uppercase text-[10px] tracking-widest">
                            <tr>
                                <th class="p-4">Пользователь</th>
                                <th class="p-4">Розыгрыш</th>
                                <th class="p-4">Дата</th>
                                <th class="p-4">Время (сек)</th>
                                <th class="p-4">Локация</th>
                                <th class="p-4">IP</th>
                            </tr>
                        </thead>
                        <tbody id="activityTable" class="divide-y divide-white/5">
                            <tr>
                                <td colspan="6" class="p-12 text-center text-gray-500 italic">
                                    Ожидание загрузки данных...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // КОНФИГУРАЦИЯ (убраны лишние пробелы)
        const SUPABASE_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg';

        // --- НАСТРОЙКА ПАРОЛЯ ---
        const ADMIN_PASSWORD = 'my_secret_password'; // <<<===== Установите СВОЙ СЛОЖНЫЙ пароль здесь!
        // --- /НАСТРОЙКА ПАРОЛЯ ---

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const debugEl = document.getElementById('debugInfo');
        const tableEl = document.getElementById('activityTable');
        const btnEl = document.getElementById('loadActivityBtn');
        const passwordContainer = document.getElementById('passwordContainer');
        const adminContent = document.getElementById('adminContent');

        function updateDebug(msg, color = 'text-gray-400') {
            const time = new Date().toLocaleTimeString();
            debugEl.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
            debugEl.scrollTop = debugEl.scrollHeight; // Прокрутка вниз
            console.log(`[Admin] ${msg}`);
        }

        // Функция проверки пароля
        function checkPassword() {
            const input = document.getElementById('adminPassword');
            const enteredPassword = input.value.trim();

            if (enteredPassword === ADMIN_PASSWORD) {
                updateDebug('Пароль верен. Загрузка данных...', 'text-green-400');
                // Скрываем контейнер с паролем и показываем основной контент
                passwordContainer.classList.add('hidden');
                adminContent.classList.remove('hidden');
                btnEl.disabled = false;
                loadActivity(); // Загружаем данные после ввода правильного пароля
            } else {
                updateDebug('Неверный пароль!', 'text-red-500');
                input.value = ''; // Очищаем поле ввода
                input.focus(); // Фокус на поле ввода
            }
        }

        // Глобальная функция для выхода (возвращает к вводу пароля)
        window.handleLogout = function() {
            updateDebug('Выход из админ-панели...', 'text-yellow-500');
            // Скрываем основной контент и показываем контейнер с паролем
            adminContent.classList.add('hidden');
            passwordContainer.classList.remove('hidden');
            // Очищаем таблицу
            tableEl.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-gray-500 italic">Введите пароль для доступа...</td></tr>`;
            btnEl.disabled = true;
        };

        async function loadActivity() {
            if (!btnEl.disabled) { // Проверяем, разрешена ли кнопка (т.е. пароль введен)
                updateDebug('Запрос данных из таблицы user_activity...');
                tableEl.innerHTML = `<tr><td colspan="6" class="p-8 text-center"><div class="animate-pulse">Загрузка данных...</div></td></tr>`;

                try {
                    // Запрос напрямую к таблице user_activity
                    const { data, error, status } = await supabase
                        .from('user_activity')
                        .select(`
                            user_id,
                            email,
                            prank_name,
                            opened_at,
                            duration,
                            city,
                            country,
                            ip_address
                        `)
                        .order('opened_at', { ascending: false }); // Сортировка по дате, новые сверху

                    if (error && status !== 406) {
                        throw error;
                    }

                    if (!data || data.length === 0) {
                        tableEl.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">Данные отсутствуют</td></tr>`;
                        updateDebug('Таблица пуста или нет записей.', 'text-gray-500');
                        return;
                    }

                    // Очищаем таблицу перед заполнением
                    tableEl.innerHTML = '';

                    // Заполняем таблицу
                    data.forEach(item => {
                        const row = document.createElement('tr');
                        row.className = 'hover:bg-white/5 transition';
                        row.innerHTML = `
                            <td class="p-4">
                                <div class="font-medium">${item.email || 'Аноним'}</div>
                                <div class="text-[10px] text-gray-500 font-mono">${item.user_id || 'no-id'}</div>
                            </td>
                            <td class="p-4 text-blue-400">${item.prank_name || '—'}</td>
                            <td class="p-4 text-gray-400">
                                ${item.opened_at ? new Date(item.opened_at).toLocaleString('ru-RU') : '—'}
                            </td>
                            <td class="p-4 font-mono">${item.duration || 0}s</td>
                            <td class="p-4">
                                ${item.city || ''} <span class="text-gray-600">${item.country || ''}</span>
                            </td>
                            <td class="p-4 font-mono text-[10px] text-purple-400">${item.ip_address || '—'}</td>
                        `;
                        tableEl.appendChild(row);
                    });

                    updateDebug(`Успешно загружено ${data.length} записей`, 'text-green-400');

                } catch (err) {
                    console.error("Ошибка загрузки данных:", err);
                    updateDebug(`Ошибка загрузки: ${err.message}`, 'text-red-400');
                    tableEl.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">Не удалось загрузить данные: ${err.message}</td></tr>`;
                }
            } else {
                updateDebug('Сначала введите пароль.', 'text-red-500');
            }
        }

        // Инициализация при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            updateDebug('Ожидание ввода пароля...', 'text-gray-400');
            // Фокус на поле ввода пароля при загрузке страницы
            document.getElementById('adminPassword').focus();
        });

        // Обработка нажатия Enter в поле ввода
        document.getElementById('adminPassword').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
