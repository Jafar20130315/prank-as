<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Login</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.png"/>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center text-white"
      style="font-family: sans-serif; background:#0f172a">

<div class="rounded-3xl p-10 w-full max-w-md text-center"
     style="background: rgba(255,255,255,.05);backdrop-filter:blur(10px)">

  <h1 class="text-4xl font-bold mb-2">Prank-as</h1>

  <p class="text-slate-400 mb-6">
    Quyidagi usullardan biri orqali tizimga kiring
  </p>

  <div class="space-y-4">

    <!-- GOOGLE LOGIN -->
    <button id="google-login"
            class="w-full py-3 rounded-2xl font-semibold bg-white text-black">
      Google bilan kirish
    </button>

    <!-- TELEGRAM LOGIN -->
    <button id="telegram-login"
            class="w-full py-3 rounded-2xl font-semibold"
            style="background:#229ED9">
      Telegram bilan kirish
    </button>

    <!-- LOGOUT -->
    <button id="logout"
            class="hidden w-full py-3 rounded-2xl font-semibold bg-red-500">
      Chiqish
    </button>

  </div>

</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabase = createClient(
    'https://gefaqrfjzwemwuxuoadp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'
  )

  const googleBtn = document.getElementById("google-login")
  const tgBtn = document.getElementById("telegram-login")
  const logoutBtn = document.getElementById("logout")

  // =========================
  // GOOGLE LOGIN
  // =========================
  googleBtn.onclick = async () => {
    await supabase.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo:'https://prank-as.site' }
    })
  }

  // =========================
  // TELEGRAM CALLBACK
  // =========================
  window.onTelegramAuth = async function(user){

    // local saqlaymiz (asosiy sahifada avatar uchun)
    localStorage.setItem("tg_name", user.first_name || "")
    localStorage.setItem("tg_avatar", user.photo_url || "")

    // workerga yuboramiz
    await fetch("https:/prankasapi.windowsnoutbook.workers.dev/auth",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(user)
    })

    alert("Salom, " + (user.first_name || "foydalanuvchi") + "!")

    window.location.href = "/"
  }

  // TELEGRAM LOGIN BUTTON
  tgBtn.onclick = () => {
    const s = document.createElement("script")
    s.src = "https://telegram.org/js/telegram-widget.js?22"

    s.setAttribute("data-telegram-login","prank_as_bot")
    s.setAttribute("data-size","large")
    s.setAttribute("data-userpic","true")
    s.setAttribute("data-request-access","write")
    s.setAttribute("data-onauth","onTelegramAuth(user)")

    document.body.appendChild(s)
  }

  // =========================
  // LOGOUT — UNIVERSAL
  // =========================
  logoutBtn.onclick = async () => {

    // 1) Supabase sessiya chiqish (Google uchun)
    await supabase.auth.signOut().catch(()=>{})

    // 2) Telegram kirishni tozalash
    localStorage.removeItem("tg_name")
    localStorage.removeItem("tg_avatar")

    alert("Chiqildi 👌")
    window.location.href = "/"
  }

  // Agar foydalanuvchi uje login bo'lsa logout ko‘rinadi
  (async () => {
    const { data: { session } } = await supabase.auth.getSession()

    if (session || localStorage.getItem("tg_name")) {
      logoutBtn.classList.remove("hidden")
    }
  })()
</script>

</body>
</html>
