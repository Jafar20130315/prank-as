<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Google Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative text-white">

  <!-- AVATAR -->
  <img id="avatar"
       class="hidden absolute top-4 right-4 w-10 h-10 rounded-full border border-white/20"
       title="Akkaunt rasmi" />

  <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 w-full max-w-sm text-center">
    <h1 class="text-3xl font-bold mb-2">Prank-as</h1>

    <p id="status" class="text-slate-400 mb-6">
      Google orqali tizimga kiring
    </p>

    <!-- LOGIN -->
    <button id="google-login"
      class="w-full py-3 rounded-xl bg-red-500 hover:bg-red-600 font-semibold transition">
      Google bilan kirish
    </button>

    <!-- LOGOUT -->
    <button id="logout"
      class="hidden w-full mt-3 py-3 rounded-xl bg-slate-600 hover:bg-slate-700 font-semibold transition">
      Chiqish
    </button>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://GEFAQRFJZWEMWUXUOADP.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const loginBtn = document.getElementById('google-login')
    const logoutBtn = document.getElementById('logout')
    const status = document.getElementById('status')
    const avatar = document.getElementById('avatar')

    const loadUser = async () => {
      const { data: { user } } = await supabase.auth.getUser()

      if (user) {
        status.textContent = 'Siz allaqachon ro‘yxatdan o‘tgansiz'
        loginBtn.classList.add('hidden')
        logoutBtn.classList.remove('hidden')

        avatar.src = user.user_metadata.picture
        avatar.classList.remove('hidden')

        logoutBtn.onclick = async () => {
          await supabase.auth.signOut()
          location.reload()
        }
      }
    }

    loginBtn.onclick = async () => {
      status.textContent = 'Google oynasi ochilmoqda...'

      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      })

      if (error) status.textContent = error.message
    }

    loadUser()
  </script>

</body>
</html>
