<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Kirish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client?hl=uz" async defer></script>
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass-panel {
      background: rgba(24, 24, 27, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-press:active { transform: scale(0.98); }
  </style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-4 sm:p-6">

  <!-- Orqa fon effektlari -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px]"></div>
    <div class="absolute top-[40%] -right-[10%] w-[400px] h-[400px] bg-indigo-600/10 rounded-full blur-[100px]"></div>
  </div>

  <div class="relative w-full max-w-[400px] flex flex-col gap-5 animate-[fadeIn_0.4s_ease-out]">
    
    <!-- Logo -->
    <div class="text-center mb-2">
      <h1 class="text-3xl font-bold tracking-tight text-white">Prank-as</h1>
      <p class="text-zinc-500 text-sm mt-1">Xavfsiz avtorizatsiya tizimi</p>
    </div>

    <!-- LOGIN HOLATI -->
    <div id="loginView" class="glass-panel rounded-3xl p-6 flex flex-col gap-5">
      
      <!-- reCAPTCHA -->
      <div id="captchaBox" class="flex flex-col items-center">
        <div class="g-recaptcha"
             data-sitekey="6LctEEEsAAAAAIYEMkFvKyCVj6ftjhm3iVPkwQyY"
             data-theme="dark"
             data-callback="onCaptchaSuccess"></div>
        <p class="text-zinc-600 text-[10px] mt-3 uppercase tracking-widest font-medium">Davom etish uchun tasdiqlang</p>
      </div>

      <!-- Tugmalar (Captcha o'tguncha o'chirilgan) -->
      <div id="loginActions" class="flex flex-col gap-3 opacity-30 pointer-events-none transition-all duration-500">
        
        <!-- Google -->
        <div id="googleButtonDiv" class="flex justify-center w-full"></div>

        <!-- Telegram -->
        <button id="tgLoginBtn" type="button"
                class="btn-press w-full flex items-center justify-center gap-3 bg-[#2AABEE] hover:bg-[#229ED9] text-white font-semibold py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-blue-900/20">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.5 3.5 2.6 10.8c-.9.4-.9 1.1-.2 1.3l4.8 1.5 1.8 5.6c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3-14.3c.3-1.2-.4-1.7-1.3-1.3ZM8.5 13.2l9.6-6c.4-.3.8-.1.5.2l-7.8 7-.3 3.2-2-4.4Z"/>
          </svg>
          <span>Telegram orqali kirish</span>
        </button>
        <script async src="https://telegram.org/js/telegram-widget.js?22"></script>
      </div>
    </div>

    <!-- AKKAUNT HOLATI (Boshida yashirin) -->
    <div id="dashboardView" class="hidden flex flex-col gap-4">
      
      <!-- 1. HISOB BO'LIMI -->
      <div class="glass-panel rounded-3xl p-6 flex flex-col items-center text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
        
        <div class="relative mb-4">
          <div id="userAvatar" class="w-20 h-20 rounded-full bg-zinc-800 border-2 border-zinc-700 flex items-center justify-center overflow-hidden shadow-xl">
            <svg class="w-10 h-10 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
            </svg>
          </div>
          <div class="absolute bottom-0 right-0 w-5 h-5 bg-emerald-500 border-2 border-zinc-900 rounded-full"></div>
        </div>

        <h2 id="userName" class="text-xl font-bold text-white mb-1">Foydalanuvchi</h2>
        
        <div class="flex items-center gap-2 text-zinc-400 bg-zinc-900/50 px-4 py-2 rounded-full border border-white/5 mt-2">
          <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          <span id="userEmail" class="text-sm font-medium">email@example.com</span>
        </div>
      </div>

      <!-- 2. SOZLAMALAR BO'LIMI -->
      <div class="glass-panel rounded-3xl p-2 flex flex-col">
        
        <!-- Chiqish tugmasi -->
        <button id="logoutBtn" class="btn-press flex items-center gap-4 w-full p-4 rounded-2xl text-zinc-300 hover:bg-white/5 hover:text-white transition-all duration-200 group">
          <div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center group-hover:bg-zinc-700 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
          </div>
          <div class="text-left">
            <div class="font-semibold text-sm">Tizimdan chiqish</div>
            <div class="text-xs text-zinc-500">Joriy sessiyani yakunlash</div>
          </div>
        </button>

        <div class="h-px bg-white/5 mx-4"></div>

        <!-- Hisobni o'chirish tugmasi -->
        <button id="deleteAccountBtn" class="btn-press flex items-center gap-4 w-full p-4 rounded-2xl text-red-400 hover:bg-red-500/10 transition-all duration-200 group">
          <div class="w-10 h-10 rounded-xl bg-red-500/10 flex items-center justify-center group-hover:bg-red-500/20 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </div>
          <div class="text-left">
            <div class="font-semibold text-sm">Hisobni o'chirish</div>
            <div class="text-xs text-red-400/60">Barcha ma'lumotlar butunlay o'chiriladi</div>
          </div>
        </button>

      </div>
      
      <a href="/" class="text-center text-xs text-zinc-600 hover:text-zinc-400 transition-colors mt-2 flex items-center justify-center gap-1">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Asosiy sahifaga qaytish
      </a>

    </div>
  </div>

<script>
  const WORKER_URL = "https://auth.prank-as.uz";
  const GOOGLE_CLIENT_ID = "712013430650-f0ospumog4obguv9cv52rrik753ok928.apps.googleusercontent.com";
  const TG_BOT_ID = "8214352355";

  const loginView = document.getElementById("loginView");
  const dashboardView = document.getElementById("dashboardView");
  const captchaBox = document.getElementById("captchaBox");
  const loginActions = document.getElementById("loginActions");
  
  const userAvatar = document.getElementById("userAvatar");
  const userName = document.getElementById("userName");
  const userEmail = document.getElementById("userEmail");

  const BTN_WIDTH = Math.min(360, window.innerWidth - 48);

  // ---------- reCAPTCHA ----------
  window.onCaptchaSuccess = function (token) {
    if (token) {
      loginActions.classList.remove("opacity-30", "pointer-events-none");
      captchaBox.classList.add("hidden");
    }
  };

  // ---------- Google ----------
  async function handleCredentialResponse(response) {
    try {
      const res = await fetch(`${WORKER_URL}/api/google-auth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem("session_token", data.token);
        localStorage.setItem("user_data", JSON.stringify(data.user));
        window.location.href = "/";
      } else {
        alert("Google orqali kirishda xatolik yuz berdi");
      }
    } catch (e) {
      console.error(e);
    }
  }

  function initGoogle() {
    if (!window.google || !google.accounts || !google.accounts.id) {
      setTimeout(initGoogle, 150);
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
      use_fedcm_for_button: true,
      use_fedcm_for_prompt: true,
      auto_select: false
    });
    google.accounts.id.renderButton(document.getElementById("googleButtonDiv"), {
      type: "standard",
      shape: "rectangular",
      theme: "filled_black",
      text: "continue_with",
      size: "large",
      logo_alignment: "left",
      width: BTN_WIDTH
    });
  }
  initGoogle();

  // ---------- Telegram ----------
  window.onTelegramAuth = async function (user) {
    try {
      const res = await fetch(`${WORKER_URL}/api/telegram-auth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(user)
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem("session_token", data.token);
        localStorage.setItem("user_data", JSON.stringify(data.user));
        window.location.href = "/";
      }
    } catch (e) {
      console.error(e);
    }
  };

  document.getElementById("tgLoginBtn").onclick = () => {
    if (!window.Telegram || !Telegram.Login) {
      alert("Telegram hali yuklanmadi, qayta urinib ko'ring.");
      return;
    }
    Telegram.Login.auth(
      { bot_id: TG_BOT_ID, request_access: true },
      (user) => { if (user) window.onTelegramAuth(user); }
    );
  };

  // ---------- Akkaunt boshqaruvi ----------
  function showDashboard(user) {
    loginView.classList.add("hidden");
    dashboardView.classList.remove("hidden");
    
    if (user?.name) userName.textContent = user.name;
    if (user?.email) userEmail.textContent = user.email;
    
    if (user?.picture) {
      userAvatar.innerHTML = `<img src="${user.picture}" class="w-full h-full object-cover">`;
    }
  }

  // Chiqish
  document.getElementById("logoutBtn").onclick = async () => {
    const token = localStorage.getItem("session_token");
    if (token) {
      await fetch(`${WORKER_URL}/api/logout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });
    }
    localStorage.removeItem("session_token");
    localStorage.removeItem("user_data");
    if (window.google?.accounts?.id) {
      google.accounts.id.disableAutoSelect();
    }
    window.location.href = "/";
  };

  // Hisobni o'chirish
  document.getElementById("deleteAccountBtn").onclick = async () => {
    const isConfirmed = confirm("Rostdan ham hisobni o'chirmoqchimisiz? Bu amalni qaytarib bo'lmaydi va barcha ma'lumotlaringiz yo'qoladi.");
    if (!isConfirmed) return;

    const token = localStorage.getItem("session_token");
    const userData = JSON.parse(localStorage.getItem("user_data") || "{}");
    const userId = userData.id;

    try {
      const res = await fetch(`${WORKER_URL}/api/delete-account`, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, userId })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.clear();
        alert("Hisob muvaffaqiyatli o'chirildi.");
        window.location.href = "/";
      }
    } catch (e) {
      console.error(e);
      alert("Xatolik yuz berdi, qayta urinib ko'ring.");
    }
  };

  // Sessiyani tekshirish
  (async () => {
    const token = localStorage.getItem("session_token");
    if (token) {
      try {
        const res = await fetch(`${WORKER_URL}/api/me`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (data.user) {
          showDashboard(data.user);
        }
      } catch (e) {
        console.error(e);
      }
    }
  })();
</script>

<script src="/metrika-code-paster.js" data-prank-as="metrika"></script>
<script src="/auto-menu.js" data-prank-as="menu"></script>
<script src="/tracker.js" data-prank-as="tracker"></script>
</body>
</html>
