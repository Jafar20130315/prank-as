<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prank-as — Kirish</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background: #0f172a;
  color: #fff;
  font-family: system-ui;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.auth-box {
  background: #020617;
  padding: 30px;
  border-radius: 16px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.auth-box h2 {
  text-align: center;
  margin-bottom: 20px;
}

.auth-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: none;
  outline: none;
}

.auth-box button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.auth-box p {
  text-align: center;
  margin-top: 12px;
  font-size: 14px;
  opacity: .9;
}
</style>
</head>
<body>

<div class="auth-box">
  <h2>Prank-as</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="signup">Ro'yxatdan o'tish</button>
  <button id="login" style="margin-top:10px;background:#16a34a">Kirish</button>
  <p id="msg"></p>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https:/gefaqrfjzwemwuxuoadp.supabase.co',
  'sb_publishable_QwbEiXXcFD7wQoeuLyM9RQ_R16_EDVq'
)

const email = document.getElementById('email')
const password = document.getElementById('password')
const msg = document.getElementById('msg')

document.getElementById('signup').onclick = async () => {
  const { error } = await supabase.auth.signUp({
    email: email.value,
    password: password.value
  })
  msg.textContent = error ? error.message : "Emailni tasdiqlang ✅"
}

document.getElementById('login').onclick = async () => {
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: password.value
  })
  if (error) msg.textContent = error.message
  else location.href = '/'
}
</script>

</body>
</html>
