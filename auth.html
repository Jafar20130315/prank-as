<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Prank-as — Google bilan kirish</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: move 10s infinite alternate;
        }
        .blob-1 {
            top: 10%;
            left: 20%;
            width: 300px;
            height: 300px;
            background: #7c3aed;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }
        .blob-2 {
            bottom: 20%;
            right: 20%;
            width: 350px;
            height: 350px;
            background: #2563eb;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation-delay: -5s;
        }

        @keyframes move {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(50px, 50px) rotate(20deg); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="glass-card p-8 rounded-2xl w-full max-w-sm fade-in-up mx-4">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white tracking-tight mb-2">Prank-as</h2>
            <p class="text-slate-400 text-sm">Davom etish uchun Google bilan tizimga kiring</p>
        </div>

        <div class="mt-8 space-y-3">
            <button id="google-login" class="group w-full py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold shadow-lg flex items-center justify-center">
                <span class="btn-text">Google bilan kirish</span>
                <div class="loader ml-2"></div>
            </button>
        </div>

        <div id="msg-container" class="mt-6 text-center text-sm min-h-[20px] transition-all duration-300 opacity-0 transform translate-y-2">
            <p id="msg"></p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabase = createClient(
          'https://gefaqrfjzwemwuxuoadp.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'  // Supabase anon key
        )

        const msgContainer = document.getElementById('msg-container')
        const msgText = document.getElementById('msg')

        function showMessage(text, isError = false) {
            msgText.textContent = text;
            msgText.className = isError ? 'text-red-400 font-medium' : 'text-emerald-400 font-medium';
            msgContainer.classList.remove('opacity-0', 'translate-y-2');
        }

        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const textSpan = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.loader');

            if (isLoading) {
                textSpan.style.opacity = '0.5';
                loader.style.display = 'block';
                btn.disabled = true;
                btn.style.cursor = 'wait';
            } else {
                textSpan.style.opacity = '1';
                loader.style.display = 'none';
                btn.disabled = false;
                btn.style.cursor = 'pointer';
            }
        }

        document.getElementById('google-login').onclick = async () => {
            setLoading('google-login', true)
            showMessage("", false)

            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google'
            })

            setLoading('google-login', false)

            if (error) {
                showMessage(error.message, true)
            } else {
                showMessage("Google orqali login uchun yo'naltirilmoqda...", false)
            }
        }
    </script>

</body>
</html>
