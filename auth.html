<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Kirish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <!-- Официальная библиотека Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
        
    /* Принудительное центрирование виджета Telegram */
    iframe[id^="telegram-login"] {
        width: 100% !important;
        display: block !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white p-4"
      style="background: radial-gradient(circle at center, #1e293b 0%, #020617 100%)">

<div class="rounded-3xl p-8 w-full max-w-md text-center shadow-2xl animate-fade"
     style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1)">
  
  <h1 class="text-4xl font-black mb-2 tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-500">
    Prank-as
  </h1>
  <p id="subtitle" class="text-slate-400 mb-8 text-sm font-medium">Xavfsiz avtorizatsiya tizimi</p>

  <div id="captchaBox" class="flex flex-col items-center mb-8">
    <div class="g-recaptcha" 
         data-sitekey="6LctEEEsAAAAAIYEMkFvKyCVj6ftjhm3iVPkwQyY" 
         data-theme="dark" 
         data-callback="onCaptchaSuccess"></div>
    <p id="captchaText" class="text-slate-500 text-[10px] mt-3 uppercase tracking-widest">Davom etish uchun tasdiqlang</p>
  </div>

  <div id="loginBox" class="opacity-20 pointer-events-none transition-all duration-700 scale-95 flex flex-col items-center gap-4">
    <div class="w-[248px] flex flex-col gap-3">
        
        <!-- Google Login Button -->
        <button id="google-login"
                class="w-full h-[40px] rounded-[20px] font-bold bg-white text-black hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-3 shadow-lg text-[14px]">
          <img src="https://www.google.com/favicon.ico" class="w-4 h-4" alt="G"> 
          <span id="googleText">Google bilan kirish</span>
        </button>

        <!-- Telegram Widget -->
        <div class="w-full flex justify-center">
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-login="prank_as_bot" 
                    data-size="large" 
                    data-radius="20" 
                    data-onauth="onTelegramAuth(user)" 
                    data-request-access="write"></script>
        </div>
    </div>
  </div>

  <div id="accountBox" class="hidden space-y-4 mt-6 border-t border-white/10 pt-8 animate-fade">
    <div class="flex items-center justify-center mb-4">
        <div id="userPreview" class="w-16 h-16 rounded-full border-2 border-blue-500 p-1">
            <div class="w-full h-full rounded-full bg-slate-800 flex items-center justify-center overflow-hidden">
                <span class="text-2xl">👤</span>
            </div>
        </div>
    </div>
    
    <button id="logout"
            class="w-full py-3.5 rounded-2xl font-bold bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-500 hover:text-white transition-all">
      Chiqish
    </button>

    <button id="deleteAccount"
            class="w-full py-2 text-slate-500 text-xs font-medium hover:text-slate-300 transition-colors">
      Hisobni butunlay o'chirish
    </button>
  </div>

</div>

<script type="module">
  const WORKER_URL = "https://auth.prank-as.uz";
  const GOOGLE_CLIENT_ID = "712013430650-f0ospumog4obguv9cv52rrik753ok928.apps.googleusercontent.com";

  const loginBox = document.getElementById("loginBox");
  const accountBox = document.getElementById("accountBox");
  const captchaBox = document.getElementById("captchaBox");
  const userPreview = document.getElementById("userPreview");

  // --- ЯЗЫКОВАЯ ЛОГИКА (TRANSLATIONS) ---
  const translations = {
      ru: {
          subtitle: "Система безопасной авторизации",
          captcha: "ПОДТВЕРДИТЕ, ЧТОБЫ ПРОДОЛЖИТЬ",
          google: "Войти через Google",
          logout: "Выйти",
          delete: "Удалить аккаунт навсегда",
          confirmDelete: "Вы уверены, что хотите удалить аккаунт? Это действие нельзя отменить."
      },
      uz: {
          subtitle: "Xavfsiz avtorizatsiya tizimi",
          captcha: "DAVOM ETISH UCHUN TASDIQLANG",
          google: "Google bilan kirish",
          logout: "Chiqish",
          delete: "Hisobni butunlay o'chirish",
          confirmDelete: "Hisobni o'chirishga ishonchingiz komilmi? Bu amalni bekor qilib bo'lmaydi."
      },
      en: {
          subtitle: "Secure authorization system",
          captcha: "VERIFY TO CONTINUE",
          google: "Sign in with Google",
          logout: "Log out",
          delete: "Delete account permanently",
          confirmDelete: "Are you sure you want to delete your account? This cannot be undone."
      }
  };

  let currentLang = 'uz'; // Default
  function setLanguage() {
      const userLang = navigator.language.slice(0, 2); 
      currentLang = translations[userLang] ? userLang : 'uz';
      const t = translations[currentLang];

      document.getElementById('subtitle').innerText = t.subtitle;
      document.getElementById('captchaText').innerText = t.captcha;
      document.getElementById('googleText').innerText = t.google;
      document.getElementById('logout').innerText = t.logout;
      document.getElementById('deleteAccount').innerText = t.delete;
  }
  setLanguage();

  // --- ЛОГИКА КАПЧИ ---
  window.onCaptchaSuccess = function(token) {
    if(token) {
      loginBox.classList.remove("opacity-20", "pointer-events-none", "scale-95");
      captchaBox.classList.add("hidden");
    }
  }

  // --- ИНИЦИАЛИЗАЦИЯ GOOGLE AUTH ---
  window.handleCredentialResponse = async function(response) {
    try {
      const res = await fetch(`${WORKER_URL}/api/google-auth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential })
      });

      const data = await res.json();
      if (data.success) {
        localStorage.setItem("session_token", data.token);
        localStorage.setItem("user_data", JSON.stringify(data.user));
        showUserAccount(data.user);
      } else {
        alert("Google orqali kirishda xatolik yuz berdi");
      }
    } catch (e) {
      console.error(e);
    }
  };

  window.onload = function () {
    if (window.google) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
    }
  };

  document.getElementById("google-login").onclick = () => {
    if (window.google) {
      google.accounts.id.prompt(); // Открывает окно выбора аккаунта Google
    } else {
      alert("Google SDK hali yuklanmadi");
    }
  };

  // --- TELEGRAM AUTH ---
  window.onTelegramAuth = async function(user) {
    try {
      const res = await fetch(`${WORKER_URL}/api/telegram-auth`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user)
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem("session_token", data.token);
        localStorage.setItem("user_data", JSON.stringify(data.user));
        showUserAccount(data.user);
      }
    } catch (e) {
      console.error(e);
      window.location.href = "https://prank-as.site";
    }
  }

  // --- ОТОБРАЖЕНИЕ АККАУНТА ---
  function showUserAccount(user) {
    loginBox.classList.add("hidden");
    captchaBox.classList.add("hidden");
    accountBox.classList.remove("hidden");

    const avatarUrl = user?.picture;
    if (avatarUrl) {
      userPreview.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full">`;
    }
  }

  // --- ЛОГИКА ВЫХОДА (LOGOUT) ---
  async function performLogout() {
    localStorage.removeItem("session_token");
    localStorage.removeItem("user_data");
    window.location.reload();
  }

  document.getElementById("logout").onclick = performLogout;

  // --- ЛОГИКА УДАЛЕНИЯ (DELETE) ---
  document.getElementById("deleteAccount").onclick = async () => {
      const t = translations[currentLang];
      
      if (confirm(t.confirmDelete)) {
          try {
              const token = localStorage.getItem("session_token");
              const userData = JSON.parse(localStorage.getItem("user_data") || "{}");

              await fetch(`${WORKER_URL}/api/delete-account`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, userId: userData.id })
              });
          } catch (e) {
              console.error(e);
          }
          await performLogout();
      }
  };

  // --- ПРОВЕРКА СЕССИИ ПРИ ЗАГРУЗКЕ ---
  (async () => {
    const token = localStorage.getItem("session_token");
    if (token) {
      try {
        const res = await fetch(`${WORKER_URL}/api/me`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (data.user) {
          showUserAccount(data.user);
          return;
        }
      } catch (e) {
        console.error(e);
      }
    }
    // Если токена нет или он просрочен — очищаем локал
    localStorage.removeItem("session_token");
    localStorage.removeItem("user_data");
  })();
</script>

<script src="auto-menu.js"></script>
<script src="/auto-menu.js" data-prank-as="menu"></script>
<script src="/tracker.js" data-prank-as="tracker"></script>
<script src="/metrika-code-paster.js" data-prank-as="metrika"></script>
</body>
</html>
