<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Login</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.png"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
    }
    .btn-google{
      background:#fff;color:#1e293b
    }
    .btn-telegram{
      background:#229ED9;color:white
    }
  </style>

  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

</head>

<body class="min-h-screen flex items-center justify-center text-white">

<div class="glass-card rounded-3xl p-10 w-full max-w-md text-center">
  <h1 class="text-4xl font-bold mb-2">Prank-as</h1>

  <p class="text-slate-400 mb-6">
    Quyidagi usullardan biri orqali tizimga kiring
  </p>

  <div class="space-y-4">

    <!-- reCAPTCHA -->
    <div class="g-recaptcha flex justify-center"
         data-sitekey="6LeOGjssAAAAAHnJBytIycrKEvDJHjMIcnjF7XN2"
         data-callback="recaptchaV2Success">
    </div>

    <!-- GOOGLE LOGIN -->
    <button id="google-login"
            disabled
            class="btn-google w-full py-3 rounded-2xl font-semibold">
      Google bilan kirish
    </button>

    <!-- TELEGRAM LOGIN -->
    <button id="telegram-login"
            class="btn-telegram w-full py-3 rounded-2xl font-semibold">
      Telegram bilan kirish
    </button>

  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabase = createClient(
    'https://gefaqrfjzwemwuxuoadp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'
  )

  const googleBtn = document.getElementById("google-login")
  const tgBtn = document.getElementById("telegram-login")

  // reCAPTCHA success
  window.recaptchaV2Success = function(){
    googleBtn.disabled = false
  }

  // GOOGLE LOGIN
  googleBtn.onclick = async () => {
    await supabase.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo:'https://prank-as.site' }
    })
  }

  // TELEGRAM CALLBACK FUNCTION
  window.onTelegramAuth = async function(user){

    // avatar & name localStorage
    localStorage.setItem("tg_photo", user.photo_url || "");
    localStorage.setItem("tg_name", user.first_name || "");

    // Worker'ga yuboramiz
    await fetch("https://prankasapi.windowsnoutbook.workers.dev/auth",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(user)
    });

    alert("Salom, " + (user.first_name || "foydalanuvchi") + "!");

    // asosiy sahifaga qaytaramiz
    window.location.href = "/";
  }

  // TELEGRAM BUTTON CLICK
  tgBtn.onclick = () => {
    const s = document.createElement("script");
    s.src = "https://telegram.org/js/telegram-widget.js?22";

    s.setAttribute("data-telegram-login","prank_as_bot");
    s.setAttribute("data-size","large");
    s.setAttribute("data-userpic","true");
    s.setAttribute("data-request-access","write");

    // MUHIM
    s.setAttribute("data-onauth","onTelegramAuth(user)");

    document.body.appendChild(s);
  }

</script>

</body>
</html>
