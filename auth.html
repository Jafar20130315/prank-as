<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
:root{
  --bg:#020617;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.1);
  --text:#fff;--muted:#94a3b8;--danger:#f87171;--accent:#54a9eb;--ok:#10b981;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at center,#1e293b 0%,#020617 100%) fixed;
  display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;
}
body.lock{overflow:hidden}
.hidden{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fadeIn .4s ease-out both}

/* ---------- Kirish ---------- */
#loginView{flex:1;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
.card{
  width:100%;max-width:28rem;text-align:center;border-radius:24px;padding:32px 20px;
  background:var(--card);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
}
.logo{display:inline-block;font-size:2.25rem;font-weight:900;letter-spacing:-.05em;line-height:1.2;
  background:linear-gradient(90deg,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.875rem;font-weight:500;margin:4px 0 24px}
#captchaBox{display:flex;flex-direction:column;align-items:center;margin-bottom:24px;min-height:78px}
#captchaWrap{transform-origin:top center}
.hint{color:var(--muted);font-size:.75rem;margin-top:10px}
#loginBox{display:flex;flex-direction:column;align-items:center;gap:12px;opacity:.25;pointer-events:none;transform:scale(.96);transition:all .5s}
#loginBox.on{opacity:1;pointer-events:auto;transform:none}
#googleButtonDiv{height:40px;display:flex;justify-content:center}
.btn-tg{
  height:40px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:.875rem;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .2s,transform .1s;
}
.btn-tg:hover{filter:brightness(1.1)}
.btn-tg:active{transform:scale(.98)}
.btn-tg svg{width:16px;height:16px;fill:currentColor}
.back{display:inline-block;margin-top:28px;font-size:.8125rem;color:var(--muted);padding:6px 10px;transition:color .2s}
.back:hover{color:#e2e8f0}

/* ---------- Yuklanmoqda ---------- */
#loader{flex:1;display:flex;align-items:center;justify-content:center}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:spin .8s linear infinite}

/* ---------- Kabinet ---------- */
#appView{flex:1;display:flex;flex-direction:column}
.bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + var(--safe-t)) 16px 10px;
  background:rgba(2,6,23,.75);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.bar .logo{font-size:1.5rem}
.burger{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.burger:hover{background:rgba(255,255,255,.08)}
.burger svg{width:24px;height:24px}
main{flex:1;width:100%;max-width:32rem;margin:0 auto;padding:24px 16px calc(24px + var(--safe-b))}
.title{font-size:1.25rem;font-weight:700;margin-bottom:16px}
.panel{border-radius:24px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.profile{padding:32px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{
  width:112px;height:112px;border-radius:50%;overflow:hidden;flex:none;
  background:linear-gradient(135deg,#334155,#1e293b);border:2px solid #3f3f46;
  display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:700;color:#cbd5e1;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.pname{margin-top:16px;font-size:1.375rem;font-weight:700;word-break:break-word}
.pmail{
  margin-top:8px;max-width:100%;display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);color:#a1a1aa;font-size:.8125rem;
}
.pmail svg{width:14px;height:14px;flex:none}
.pmail span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{
  width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;
  min-height:68px;transition:background .2s;
}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:rgba(255,255,255,.05)}
.row:active{background:rgba(255,255,255,.08)}
.ico{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:#27272a}
.ico svg{width:20px;height:20px}
.row b{display:block;font-size:.9375rem;font-weight:600}
.row small{display:block;font-size:.75rem;color:#71717a}
.row.danger{color:var(--danger)}
.row.danger .ico{background:rgba(239,68,68,.12)}
.row.danger small{color:rgba(248,113,113,.65)}
.row.danger:hover{background:rgba(239,68,68,.08)}

/* ---------- Gamburger menyu ---------- */
#scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(82vw,20rem);
  padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  background:#0b1220;border-left:1px solid var(--line);
  transform:translateX(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;
  display:flex;flex-direction:column;gap:6px;overflow-y:auto;
}
#drawer.on{transform:none;visibility:visible;transition:transform .28s ease}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.drawer-head span{font-weight:700}
.nav{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;min-height:52px;text-align:left;font-weight:600;color:#cbd5e1;transition:background .2s}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:rgba(255,255,255,.06)}
.nav[aria-current="page"]{background:rgba(84,169,235,.15);color:#fff}

/* ---------- Oyna (alert o'rniga) ---------- */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.dlg{width:100%;max-width:22rem;border-radius:20px;padding:24px 20px 20px;background:#0f172a;border:1px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.6);text-align:center;animation:fadeIn .2s ease-out both}
.dlg .mi{width:48px;height:48px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:rgba(84,169,235,.15);color:var(--accent)}
.dlg .mi.err{background:rgba(239,68,68,.15);color:var(--danger)}
.dlg .mi svg{width:24px;height:24px}
.dlg h3{font-size:1.125rem;font-weight:700}
.dlg p{margin-top:8px;color:var(--muted);font-size:.9375rem}
.acts{display:flex;gap:10px;margin-top:22px}
.acts button{flex:1;min-height:46px;border-radius:12px;font-weight:600;font-size:.9375rem;transition:filter .2s,transform .1s}
.acts button:active{transform:scale(.97)}
.b-cancel{background:rgba(255,255,255,.08)}
.b-ok{background:#fff;color:#0f172a}
.b-danger{background:#ef4444;color:#fff}
.acts button:disabled{opacity:.6;cursor:wait}

@media (max-width:360px){
  .card{padding:28px 14px}
  .logo{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ================= KIRISH ================= -->

<script>
(() => {
  "use strict";

  const WORKER_URL = "https://auth.prank-as.uz";
  const GOOGLE_CLIENT_ID = "712013430650-f0ospumog4obguv9cv52rrik753ok928.apps.googleusercontent.com";
  const TG_BOT_ID = "8214352355";
  const RECAPTCHA_SITEKEY = "6LctEEEsAAAAAIYEMkFvKyCVj6ftjhm3iVPkwQyY";

  const $ = (id) => document.getElementById(id);
  const el = {
    loader: $("loader"), loginView: $("loginView"), appView: $("appView"),
    loginBox: $("loginBox"), captchaBox: $("captchaBox"), captchaWrap: $("captchaWrap"),
    tgBtn: $("tgLoginBtn"), avatar: $("userAvatar"), name: $("userName"), email: $("userEmail"),
    drawer: $("drawer"), scrim: $("scrim"), menuBtn: $("menuBtn")
  };

  let captchaToken = "";
  let captchaId = null;
  let busy = false;

  // ---------- Xavfsiz localStorage ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };
  const clearSession = () => { store.del("session_token"); store.del("user_data"); };

  // ---------- API ----------
  async function api(path, body, method = "POST") {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(WORKER_URL + path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: ctrl.signal
      });
      let data = {};
      try { data = await res.json(); } catch {}
      return { ok: res.ok, status: res.status, data };
    } finally { clearTimeout(t); }
  }

  // ---------- Oyna (alert / confirm o'rniga) ----------
  let lastFocus = null;
  function dialog({ title, text = "", type = "info", ok = "OK", cancel = null, danger = false }) {
    return new Promise((resolve) => {
      lastFocus = document.activeElement;
      const wrap = document.createElement("div");
      wrap.id = "modal";
      const icon = type === "error"
        ? '<path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>'
        : '<path d="M12 8v4m0 4h.01M22 12a10 10 0 11-20 0 10 10 0 0120 0z"/>';
      wrap.innerHTML =
        '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">' +
        '<div class="mi ' + (type === "error" || danger ? "err" : "") + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + icon + '</svg></div>' +
        '<h3 id="dlgT"></h3><p></p><div class="acts"></div></div>';
      wrap.querySelector("h3").textContent = title;
      const p = wrap.querySelector("p");
      if (text) p.textContent = text; else p.remove();

      const acts = wrap.querySelector(".acts");
      const close = (val) => {
        document.removeEventListener("keydown", onKey, true);
        wrap.remove();
        if (lastFocus && lastFocus.focus) lastFocus.focus();
        resolve(val);
      };
      if (cancel) {
        const c = document.createElement("button");
        c.type = "button"; c.className = "b-cancel"; c.textContent = cancel;
        c.onclick = () => close(false);
        acts.appendChild(c);
      }
      const o = document.createElement("button");
      o.type = "button"; o.className = danger ? "b-danger" : "b-ok"; o.textContent = ok;
      o.onclick = () => close(true);
      acts.appendChild(o);

      const onKey = (e) => {
        if (e.key === "Escape") { e.stopPropagation(); close(false); }
        else if (e.key === "Tab") {
          const f = wrap.querySelectorAll("button");
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      };
      document.addEventListener("keydown", onKey, true);
      wrap.addEventListener("click", (e) => { if (e.target === wrap && cancel) close(false); });
      document.body.appendChild(wrap);
      (cancel ? acts.firstChild : o).focus();
    });
  }
  const showError = (text, title = "Xatolik") => dialog({ title, text, type: "error", ok: "Yopish" });

  // ---------- reCAPTCHA (explicit render) ----------
  function fitCaptcha() {
    const w = el.captchaBox.clientWidth || window.innerWidth;
    const s = Math.min(1, (w - 8) / 304);
    el.captchaWrap.style.transform = s < 1 ? "scale(" + s + ")" : "";
    el.captchaWrap.style.height = s < 1 ? Math.round(78 * s) + "px" : "";
  }
  window.onRecaptchaLoad = function () {
    if (captchaId !== null) return;
    captchaId = grecaptcha.render("recaptcha", {
      sitekey: RECAPTCHA_SITEKEY,
      theme: "dark",
      callback: (token) => {
        captchaToken = token || "";
        if (captchaToken) {
          el.loginBox.classList.add("on");
          el.captchaBox.classList.add("hidden");
        }
      },
      "expired-callback": resetCaptcha,
      "error-callback": resetCaptcha
    });
    fitCaptcha();
  };
  function resetCaptcha() {
    captchaToken = "";
    el.loginBox.classList.remove("on");
    el.captchaBox.classList.remove("hidden");
    try { if (captchaId !== null) grecaptcha.reset(captchaId); } catch {}
  }
  window.addEventListener("resize", fitCaptcha, { passive: true });
  fitCaptcha();

  // ---------- Ekranlarni almashtirish ----------
  function showLogin() {
    el.loader.classList.add("hidden");
    el.appView.classList.add("hidden");
    el.loginView.classList.remove("hidden");
    fitCaptcha();
  }

  function initials(name, email) {
    const s = (name || email || "?").trim();
    const parts = s.split(/\s+/).slice(0, 2);
    return parts.map((x) => x[0]).join("").toUpperCase() || "?";
  }

  function showApp(user) {
    user = user || {};
    el.name.textContent = user.name || "Foydalanuvchi";
    el.email.textContent = user.email || (user.username ? "@" + user.username : "—");

    el.avatar.textContent = "";
    const fallback = () => { el.avatar.textContent = initials(user.name, user.email); };
    if (typeof user.picture === "string" && /^https:\/\//i.test(user.picture)) {
      const img = new Image();
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      img.decoding = "async";
      img.onerror = fallback;
      img.src = user.picture;
      el.avatar.appendChild(img);
    } else fallback();

    el.loader.classList.add("hidden");
    el.loginView.classList.add("hidden");
    el.appView.classList.remove("hidden");
    setView("account");
  }

  // ---------- Gamburger menyu ----------
  function setMenu(open) {
    el.drawer.classList.toggle("on", open);
    el.scrim.classList.toggle("on", open);
    el.drawer.setAttribute("aria-hidden", String(!open));
    el.menuBtn.setAttribute("aria-expanded", String(open));
    document.body.classList.toggle("lock", open);
    if (open) el.drawer.querySelector(".nav").focus(); else el.menuBtn.focus({ preventScroll: true });
  }
  function setView(name) {
    ["account", "settings"].forEach((v) => $("view-" + v).classList.toggle("hidden", v !== name));
    el.drawer.querySelectorAll(".nav").forEach((b) => {
      if (b.dataset.view === name) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    window.scrollTo(0, 0);
  }
  el.menuBtn.onclick = () => setMenu(true);
  $("closeMenu").onclick = () => setMenu(false);
  el.scrim.onclick = () => setMenu(false);
  el.drawer.querySelectorAll(".nav").forEach((b) => {
    b.onclick = () => { setView(b.dataset.view); setMenu(false); };
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && el.drawer.classList.contains("on") && !$("modal")) setMenu(false);
  });

  // ---------- Muvaffaqiyatli kirish ----------
  function onAuthSuccess(data) {
    store.set("session_token", data.token);
    store.set("user_data", JSON.stringify(data.user || {}));
    showApp(data.user);
  }

  async function authRequest(path, payload, failText) {
    if (busy) return;
    if (!captchaToken) { showError("Avval \"Men robot emasman\" belgisini tasdiqlang."); return; }
    busy = true;
    try {
      const { data } = await api(path, Object.assign({}, payload, { captcha: captchaToken }));
      if (data && data.success && data.token) onAuthSuccess(data);
      else { await showError(failText); resetCaptcha(); }
    } catch (e) {
      console.error(e);
      await showError("Server bilan aloqa yo'q. Internetni tekshirib, qayta urinib ko'ring.");
      resetCaptcha();
    } finally { busy = false; }
  }

  // ---------- Google ----------
  function handleCredentialResponse(response) {
    authRequest("/api/google-auth", { credential: response.credential }, "Google orqali kirishda xatolik yuz berdi.");
  }
  let googleTries = 0;
  function initGoogle() {
    if (!window.google || !google.accounts || !google.accounts.id) {
      if (++googleTries < 100) setTimeout(initGoogle, 150);
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
      use_fedcm_for_button: true,
      use_fedcm_for_prompt: true,
      auto_select: false
    });
    google.accounts.id.renderButton($("googleButtonDiv"), {
      type: "standard", shape: "pill", theme: "filled_black",
      text: "continue_with", size: "large", logo_alignment: "left",
      width: Math.max(200, Math.min(320, window.innerWidth - 80))
    });
  }
  initGoogle();

  // ---------- Telegram (skript bosilganda yuklanadi) ----------
  const tgWidth = () => Math.max(200, Math.min(320, window.innerWidth - 80));
  el.tgBtn.style.width = tgWidth() + "px";
  let tgLoading = null;
  function loadTelegram() {
    if (window.Telegram && Telegram.Login) return Promise.resolve();
    if (tgLoading) return tgLoading;
    tgLoading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://telegram.org/js/telegram-widget.js?22";
      s.async = true;
      s.onload = resolve;
      s.onerror = () => { tgLoading = null; reject(new Error("tg")); };
      document.head.appendChild(s);
    });
    return tgLoading;
  }
  // tezroq bo'lishi uchun brauzer bo'sh turganda oldindan yuklaymiz
  (window.requestIdleCallback || ((f) => setTimeout(f, 1500)))(() => loadTelegram().catch(() => {}));

  el.tgBtn.onclick = async () => {
    if (!captchaToken) { showError("Avval \"Men robot emasman\" belgisini tasdiqlang."); return; }
    try { await loadTelegram(); }
    catch { showError("Telegram yuklanmadi. Internetni tekshirib, qayta urinib ko'ring."); return; }
    Telegram.Login.auth({ bot_id: TG_BOT_ID, request_access: true }, (user) => {
      if (user) authRequest("/api/telegram-auth", user, "Telegram orqali kirishda xatolik yuz berdi.");
    });
  };

  // ---------- Chiqish ----------
  $("logoutBtn").onclick = async () => {
    const yes = await dialog({ title: "Chiqishni xohlaysizmi?", text: "Akkauntingizdan chiqasiz.", ok: "Chiqish", cancel: "Bekor qilish" });
    if (!yes) return;
    const token = store.get("session_token");
    try { if (token) await api("/api/logout", { token }); } catch (e) { console.error(e); }
    clearSession();
    try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch {}
    location.reload();
  };

  // ---------- Akkauntni o'chirish ----------
  $("deleteAccountBtn").onclick = async () => {
    const yes = await dialog({
      title: "Akkauntni o'chirasizmi?",
      text: "Bu amalni qaytarib bo'lmaydi. Barcha ma'lumotlaringiz o'chiriladi.",
      ok: "Ha, o'chirish", cancel: "Bekor qilish", danger: true
    });
    if (!yes) return;
    const token = store.get("session_token");
    if (!token) { clearSession(); location.reload(); return; }
    try {
      const { data } = await api("/api/delete-account", { token }, "DELETE");
      if (data && data.success) {
        clearSession();
        await dialog({ title: "Akkaunt o'chirildi", text: "Sizni yana ko'rishdan xursand bo'lamiz.", ok: "OK" });
        location.reload();
      } else {
        await showError("Akkauntni o'chirib bo'lmadi. Keyinroq qayta urinib ko'ring.");
      }
    } catch (e) {
      console.error(e);
      await showError("Server bilan aloqa yo'q. Qayta urinib ko'ring.");
    }
  };

  // ---------- Sessiyani tekshirish ----------
  (async () => {
    const token = store.get("session_token");
    if (!token) { showLogin(); return; }

    // tez ko'rsatish uchun keshdagi ma'lumot
    try {
      const cached = JSON.parse(store.get("user_data") || "null");
      if (cached) showApp(cached);
    } catch {}

    try {
      const { data } = await api("/api/me", { token });
      if (data && data.user) {
        store.set("user_data", JSON.stringify(data.user));
        showApp(data.user);
      } else {
        clearSession();
        showLogin();
      }
    } catch (e) {
      console.error(e);
      if (el.appView.classList.contains("hidden")) showLogin();
    }
  })();
})();
</script>
<script src="/metrika-code-paster.js" data-prank-as="metrika" defer></script>
<script src="/tracker.js" data-prank-as="tracker" defer></script>
<script src="auto-menu.js"></script></body>
