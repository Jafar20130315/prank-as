<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Google Login</title>
  <link rel="icon" type="image/x-icon" href="favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative text-white">

  <!-- AVATAR -->
  <img id="avatar"
       class="hidden absolute top-4 right-4 w-10 h-10 rounded-full border border-white/20 cursor-pointer"
       title="Akkauntdan chiqish" />

  <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 w-full max-w-sm text-center">
    <h1 class="text-3xl font-bold mb-2">Prank-as</h1>

    <p id="status" class="text-slate-400 mb-6">
      Google orqali tizimga kiring
    </p>

    <!-- LOGIN -->
    <button id="google-login"
      class="w-full py-3 rounded-xl bg-red-500 hover:bg-red-600 font-semibold transition">
      Google bilan kirish
    </button>

    <!-- LOGOUT -->
    <button id="logout"
      class="hidden w-full mt-3 py-3 rounded-xl bg-slate-600 hover:bg-slate-700 font-semibold transition">
      Chiqish
    </button>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const supabase = createClient(
      'https://GEFAQRFJZWEMWUXUOADP.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'
    )

    const loginBtn = document.getElementById('google-login')
    const logoutBtn = document.getElementById('logout')
    const status = document.getElementById('status')
    const avatar = document.getElementById('avatar')

    // Функция обновления UI
    const updateUI = (user) => {
      if (user) {
        status.textContent = `Salom, ${user.user_metadata.full_name || 'Foydalanuvchi'}!`
        status.classList.add('text-green-400') // Зеленый текст для успеха
        
        loginBtn.classList.add('hidden')
        logoutBtn.classList.remove('hidden')

        avatar.src = user.user_metadata.picture
        avatar.classList.remove('hidden')
      } else {
        status.textContent = 'Google orqali tizimga kiring'
        status.classList.remove('text-green-400')
        
        loginBtn.classList.remove('hidden')
        logoutBtn.classList.add('hidden')
        avatar.classList.add('hidden')
      }
    }

    // 1. Проверяем сессию сразу при загрузке страницы
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession()
      updateUI(session?.user)
    }
    
    checkSession()

    // 2. Слушаем изменения (вход/выход)
    supabase.auth.onAuthStateChange((event, session) => {
      updateUI(session?.user)
    })

    // Логика кнопок
    loginBtn.onclick = async () => {
      status.textContent = 'Google oynasi ochilmoqda...'

      await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          // 👇 ЗДЕСЬ УКАЗЫВАЕМ ГЛАВНУЮ СТРАНИЦУ
          redirectTo: 'https://prank-as.site' 
          // Если тестируете на компьютере локально, то: 'http://localhost:XXXX'
        }
      })
    }

    const handleLogout = async () => {
      await supabase.auth.signOut()
      window.location.reload()
    }

    logoutBtn.onclick = handleLogout
    avatar.onclick = handleLogout
</script>

</body>
</html>
