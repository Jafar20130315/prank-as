<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Google Login</title>
  <link rel="icon" type="image/x-icon" href="favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- reCAPTCHA v2 -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-google {
      background: #ffffff;
      color: #1e293b;
    }
    .disabled-like{
      opacity: 0.5;
      pointer-events:none;
      cursor:not-allowed;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative text-white px-4">

<!-- dizayn o‘sha-o‘sha, o‘zgarmadi -->

<div class="glass-card rounded-3xl p-10 w-full max-w-md text-center">

  <h1 class="text-4xl font-extrabold mb-4">Prank-as</h1>

  <p id="status" class="text-slate-400 mb-6">
    Google orqali tizimga kiring
  </p>

  <!-- reCAPTCHA (faqat kerak bo'lganda ko'rsatiladi) -->
  <div id="recaptcha-wrapper" class="mb-4">
    <div id="recaptcha"
         class="g-recaptcha"
         data-sitekey="6LeOGjssAAAAAHnJBytIycrKEvDJHjMIcnjF7XN2"
         data-callback="captchaSolved">
    </div>
  </div>

  <button id="google-login"
          disabled
          class="btn-google disabled-like w-full py-4 rounded-2xl font-bold">
    Google bilan kirish
  </button>

  <button id="logout"
          class="hidden mt-3 w-full py-3 rounded-2xl bg-white/10">
    Chiqish
  </button>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
 'https://gefaqrfjzwemwuxuoadp.supabase.co/',
 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'
)

const loginBtn = document.getElementById("google-login")
const logoutBtn = document.getElementById("logout")
const status = document.getElementById("status")
const recaptchaBlock = document.getElementById("recaptcha-wrapper")

// holatlarni saqlaymiz
let registered = localStorage.getItem("registered") === "true"
let needChallenge = localStorage.getItem("need_challenge") === "true"

let captchaOK = false

// captcha tugallanganda Google chaqiradi
window.captchaSolved = () => {
  captchaOK = true
  loginBtn.disabled = false
  loginBtn.classList.remove("disabled-like")
}

// UI mantiqi
function updateCaptchaVisibility() {

  // 1-marta login qilish → captcha kerak
  if (!registered) {
    recaptchaBlock.style.display = "block"
    loginBtn.disabled = true
    loginBtn.classList.add("disabled-like")
    return
  }

  // qayta kirib chiqsa → challenge yoqiladi
  if (needChallenge) {
    recaptchaBlock.style.display = "block"
    loginBtn.disabled = true
    loginBtn.classList.add("disabled-like")
    return
  }

  // oddiy kirishda captcha kerak emas
  recaptchaBlock.style.display = "none"
  loginBtn.disabled = false
  loginBtn.classList.remove("disabled-like")
}

// dastlab ishga tushirish
updateCaptchaVisibility()

// login
loginBtn.onclick = async () => {

  // agar challenge kerak bo‘lsa va hal qilinmagan bo‘lsa → ishlamasin
  if ((needChallenge || !registered) && !captchaOK) {
    return
  }

  localStorage.setItem("registered","true")
  localStorage.setItem("need_challenge","false")

  await supabase.auth.signInWithOAuth({
    provider:"google",
    options:{ redirectTo:"https://prank-as.site" }
  })
}

// logout
logoutBtn.onclick = async () => {
  await supabase.auth.signOut()

  // endi challenge majburiy bo'ladi
  localStorage.setItem("need_challenge","true")

  location.reload()
}
</script>

</body>
</html>
