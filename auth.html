<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Kirish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client?hl=uz" async defer></script>
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white p-4 relative"
      style="background: radial-gradient(circle at center, #1e293b 0%, #020617 100%)">

<!-- Контейнер для позиционирования оверлея FedCM строго по центру экрана -->
<div id="g_id_onload_parent" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[9999] pointer-events-none"></div>

<div class="rounded-3xl p-8 w-full max-w-md text-center shadow-2xl animate-fade relative z-10"
     style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1)">
  
  <a href="/" class="inline-block mb-2">
    <h1 class="text-4xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-500">
      Prank-as
    </h1>
  </a>
  <p class="text-slate-400 mb-8 text-sm font-medium">Xavfsiz avtorizatsiya tizimi</p>

  <div id="captchaBox" class="flex flex-col items-center mb-8">
    <div class="g-recaptcha" 
         data-sitekey="6LctEEEsAAAAAIYEMkFvKyCVj6ftjhm3iVPkwQyY" 
         data-theme="dark" 
         data-callback="onCaptchaSuccess"></div>
    <p class="text-slate-500 text-[10px] mt-3 uppercase tracking-widest">Davom etish uchun tasdiqlang</p>
  </div>

  <div id="loginBox" class="opacity-20 pointer-events-none transition-all duration-700 scale-95 flex flex-col items-center gap-4">
    <div class="w-full flex flex-col items-center gap-3">
      <!-- Google Sign-In Container -->
      <div id="googleButtonDiv" class="flex justify-center cursor-pointer" style="height:40px"></div>

      <!-- Telegram -->
      <button id="tgLoginBtn" type="button" 
              class="rounded-full font-semibold text-sm text-white flex items-center justify-center gap-2 transition hover:brightness-110" 
              style="height:40px; background:#54a9eb">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor"><path d="M21.5 3.5 2.6 10.8c-.9.4-.9 1.1-.2 1.3l4.8 1.5 1.8 5.6c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3-14.3c.3-1.2-.4-1.7-1.3-1.3ZM8.5 13.2l9.6-6c.4-.3.8-.1.5.2l-7.8 7-.3 3.2-2-4.4Z"/></svg>
        Telegram bilan davom etish
      </button>
      <script async src="https://telegram.org/js/telegram-widget.js?22"></script>
    </div>
  </div>

  <div id="accountBox" class="hidden space-y-4 mt-6 border-t border-white/10 pt-8 animate-fade">
    <div class="flex items-center justify-center mb-4">
        <div id="userPreview" class="w-20 h-20 rounded-full border-2 border-blue-500 p-1 shadow-lg">
            <div class="w-full h-full rounded-full bg-slate-800 flex items-center justify-center overflow-hidden">
                <span class="text-2xl">👤</span>
            </div>
        </div>
    </div>
    <p class="text-sm font-semibold text-slate-300" id="userName">Foydalanuvchi</p>
    
    <a href="/" class="block w-full py-3 rounded-2xl font-bold bg-blue-600 text-white hover:bg-blue-500 transition-all text-center shadow-lg">
      Bosh sahifaga qaytish
    </a>

    <button id="logout"
            class="w-full py-2.5 rounded-2xl font-bold bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-500 hover:text-white transition-all text-sm">
      Chiqish
    </button>
  </div>

  <div class="mt-8 text-center">
    <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">← Asosiy sahifaga qaytish</a>
  </div>
</div>

<script>
  const WORKER_URL = "https://auth.prank-as.uz";
  const GOOGLE_CLIENT_ID = "712013430650-f0ospumog4obguv9cv52rrik753ok928.apps.googleusercontent.com";
  const TG_BOT_ID = "8214352355";

  const loginBox = document.getElementById("loginBox");
  const accountBox = document.getElementById("accountBox");
  const captchaBox = document.getElementById("captchaBox");
  const userPreview = document.getElementById("userPreview");
  const userName = document.getElementById("userName");

  const BTN_WIDTH = Math.min(320, window.innerWidth - 96);
  document.getElementById("tgLoginBtn").style.width = BTN_WIDTH + "px";

  window.onCaptchaSuccess = function(token) {
    if(token) {
      loginBox.classList.remove("opacity-20", "pointer-events-none", "scale-95");
      captchaBox.classList.add("hidden");
    }
  }

  async function handleCredentialResponse(response) {
    try {
      const res = await fetch(`${WORKER_URL}/api/google-auth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem("session_token", data.token);
        localStorage.setItem("user_data", JSON.stringify(data.user));
        window.location.href = "/";
      } else {
        alert("Google orqali kirishda xatolik yuz berdi");
      }
    } catch (e) {
      console.error(e);
    }
  };

  window.onload = function () {
    if (window.google) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        use_fedcm_for_prompt: true, // Включаем встроенный оверлей браузера (как у Samsung)
        prompt_parent_id: 'g_id_onload_parent', // Центрируем оверлей
        cancel_on_tap_outside: false
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButtonDiv"),
        { 
          type: "standard",
          shape: "pill",
          theme: "filled_black",
          text: "continue_with",
          size: "large",
          logo_alignment: "left",
          width: BTN_WIDTH
        }
      );

      // При клике активируем диалоговый оверлей
      document.getElementById("googleButtonDiv").onclick = () => {
        google.accounts.id.prompt();
      };
    }
  };

  window.onTelegramAuth = async function(user) {
    try {
      const res = await fetch(`${WORKER_URL}/api/telegram-auth`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user)
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem("session_token", data.token);
        localStorage.setItem("user_data", JSON.stringify(data.user));
        window.location.href = "/";
      }
    } catch (e) {
      console.error(e);
    }
  }

  document.getElementById("tgLoginBtn").onclick = () => {
    if (!window.Telegram || !Telegram.Login) {
      alert("Telegram hali yuklanmadi, bir soniyadan keyin qayta urinib ko'ring.");
      return;
    }
    Telegram.Login.auth(
      { bot_id: TG_BOT_ID, request_access: true },
      (user) => { if (user) window.onTelegramAuth(user); }
    );
  };

  function showUserAccount(user) {
    loginBox.classList.add("hidden");
    captchaBox.classList.add("hidden");
    accountBox.classList.remove("hidden");
    if (user?.name) userName.textContent = user.name;
    if (user?.picture) {
      userPreview.innerHTML = `<img src="${user.picture}" class="w-full h-full object-cover rounded-full">`;
    }
  }

  document.getElementById("logout").onclick = () => {
    localStorage.removeItem("session_token");
    localStorage.removeItem("user_data");
    window.location.reload();
  };

  (async () => {
    const token = localStorage.getItem("session_token");
    if (token) {
      try {
        const res = await fetch(`${WORKER_URL}/api/me`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (data.user) {
          showUserAccount(data.user);
        }
      } catch (e) {
        console.error(e);
      }
    }
  })();
</script>
<script src="/metrika-code-paster.js" data-prank-as="metrika"></script>
<script src="/auto-menu.js" data-prank-as="menu"></script>
<script src="/tracker.js" data-prank-as="tracker"></script>
<script src="auto-menu.js"></script></body>
</html>
