<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Prank-as — Google bilan kirish</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            padding: 2rem;
            border-radius: 1.5rem;
            color: white; /* Для читабельности текста */
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative">

    <div class="glass-card fade-in-up w-full max-w-sm text-center">
        <h2 class="text-3xl font-bold mb-2">Prank-as</h2>
        <p class="text-slate-400 mb-6">Davom etish uchun Google bilan tizimga kiring</p>

        <button id="google-login" class="w-full py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold transition duration-200">
            Google bilan kirish
        </button>

        <div id="msg-container" class="mt-4 text-sm text-center min-h-[20px]">
            <p id="msg"></p>
        </div>
    </div>

    <!-- Supabase JS minified -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/supabase.min.js"></script>

    <script>
        // --------------- ИСПРАВЛЕННАЯ ЛОГИКА SUPABASE -----------------

        // VAZIYAT UCHUN MA'LUMOTLARINGIZNI KIRITING (ВВЕДИТЕ ВАШИ ДАННЫЕ)
        const SUPABASE_URL = 'https://GEFAQRFJZWEMWUXUOADP.supabase.co'; // Supabase URL
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'; // Supabase anon key - ОБЯЗАТЕЛЬНО ЗАМЕНИТЕ!
        
        // Ismni o'zgartirdik: global 'supabase' kutubxonasini ishlatamiz
        // va yaratilgan klientni 'supabaseClient' deb nomlaymiz, shunda
        // 'Cannot access before initialization' xatosi bo'lmaydi.
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginButton = document.getElementById('google-login');
        const msgText = document.getElementById('msg');

        function showMessage(text, isError = false) {
            msgText.textContent = text;
            msgText.className = isError ? 'text-red-400' : 'text-green-400';
            console.log(isError ? `SUPABASE XATO: ${text}` : `SUPABASE XABAR: ${text}`);
        }

        // Tizimga kirishni tekshirish (ixtiyoriy, lekin foydali)
        async function checkAuthStatus() {
             const { data: { user } } = await supabaseClient.auth.getUser();
             if (user) {
                 showMessage(`Siz allaqachon tizimga kirgansiz! Foydalanuvchi: ${user.email}`, false);
                 loginButton.disabled = true;
             } else {
                 showMessage("Davom etish uchun Google orqali kiring.", false);
                 loginButton.disabled = false;
             }
        }
        
        document.getElementById('google-login').onclick = async () => {
            if (SUPABASE_ANON_KEY === 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg') {
                showMessage("Xato: Iltimos, Supabase anon kalitingizni kiriting!", true);
                return;
            }

            showMessage("Google login oynasi ochilmoqda...", false);
            
            loginButton.disabled = true;

            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                // Supabase sozlamalaridagi URL o'chirilishi mumkin bo'lgan joy
                // masalan: options: { redirectTo: window.location.origin } 
            });

            if (error) {
                showMessage(`Kirishda xato: ${error.message}`, true);
            } else {
                // Agar muvaffaqiyatli bo'lsa, foydalanuvchi Google oynasiga yo'naltiriladi
                // Bu joyda xabarni o'zgartirish kerak emas
            }
            
            // Xato bo'lsa tugmani qayta yoqish
            loginButton.disabled = false;
        }

        // Sahifa yuklanganda avtomatik tizimga kirishni tekshirish
        checkAuthStatus();
        
    </script>
</body>
</html>
