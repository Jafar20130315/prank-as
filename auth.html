<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Prank-as — Kirish</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Иконки -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            overflow: hidden; /* Чтобы фоновые фигуры не создавали скролл */
        }

        /* Анимированный фон */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: move 10s infinite alternate;
        }
        .blob-1 {
            top: 10%;
            left: 20%;
            width: 300px;
            height: 300px;
            background: #7c3aed; /* Фиолетовый */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }
        .blob-2 {
            bottom: 20%;
            right: 20%;
            width: 350px;
            height: 350px;
            background: #2563eb; /* Синий */
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation-delay: -5s;
        }

        @keyframes move {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(50px, 50px) rotate(20deg); }
        }

        /* Эффект стекла */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Анимация появления */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Анимация загрузки */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
            display: none; /* Скрыто по умолчанию */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Плавные инпуты */
        .input-group:focus-within svg {
            color: #60a5fa; /* blue-400 */
        }
        .input-group:focus-within {
            border-color: #60a5fa;
            background: rgba(255,255,255,0.08);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative">

    <!-- Фоновые фигуры -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Карточка авторизации -->
    <div class="glass-card p-8 rounded-2xl w-full max-w-sm fade-in-up mx-4">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white tracking-tight mb-2">Prank-as</h2>
            <p class="text-slate-400 text-sm">Davom etish uchun tizimga kiring</p>
        </div>

        <div class="space-y-4">
            <!-- Email -->
            <div class="input-group flex items-center bg-white/5 border border-white/10 rounded-xl px-4 py-3 transition-all duration-300">
                <i data-lucide="mail" class="w-5 h-5 text-slate-400 mr-3 transition-colors"></i>
                <input type="email" id="email" placeholder="Email manzilingiz" 
                    class="bg-transparent border-none outline-none text-white w-full placeholder-slate-500 text-sm">
            </div>

            <!-- Password -->
            <div class="input-group flex items-center bg-white/5 border border-white/10 rounded-xl px-4 py-3 transition-all duration-300">
                <i data-lucide="lock" class="w-5 h-5 text-slate-400 mr-3 transition-colors"></i>
                <input type="password" id="password" placeholder="Parolingiz" 
                    class="bg-transparent border-none outline-none text-white w-full placeholder-slate-500 text-sm">
            </div>
        </div>

        <!-- Кнопки -->
        <div class="mt-8 space-y-3">
            <button id="login" class="group w-full relative py-3 rounded-xl bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold shadow-lg shadow-blue-500/30 transition-all duration-300 transform hover:scale-[1.02] active:scale-95 flex items-center justify-center">
                <span class="btn-text">Kirish</span>
                <div class="loader ml-2"></div>
            </button>

            <button id="signup" class="group w-full py-3 rounded-xl border border-white/20 hover:bg-white/10 text-slate-300 hover:text-white font-medium transition-all duration-300 active:scale-95 flex items-center justify-center">
                <span class="btn-text">Ro'yxatdan o'tish</span>
                <div class="loader ml-2"></div>
            </button>
        </div>

        <!-- Сообщения -->
        <div id="msg-container" class="mt-6 text-center text-sm min-h-[20px] transition-all duration-300 opacity-0 transform translate-y-2">
            <p id="msg"></p>
        </div>
    </div>

    <!-- Скрипты -->
    <script>
        // Инициализация иконок
        lucide.createIcons();
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // Ваши ключи (оставил как в оригинале)
        const supabase = createClient(
          'https://gefaqrfjzwemwuxuoadp.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'
        )

        const emailInput = document.getElementById('email')
        const passwordInput = document.getElementById('password')
        const msgContainer = document.getElementById('msg-container')
        const msgText = document.getElementById('msg')

        // Функция для отображения сообщений с анимацией
        function showMessage(text, isError = false) {
            msgText.textContent = text;
            msgText.className = isError ? 'text-red-400 font-medium' : 'text-emerald-400 font-medium';
            
            // Анимация появления
            msgContainer.classList.remove('opacity-0', 'translate-y-2');
            
            // Если ошибка, немного потрясем форму (визуально)
            if(isError) {
                const card = document.querySelector('.glass-card');
                card.classList.add('animate-[shake_0.5s_ease-in-out]');
                setTimeout(() => card.classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);
            }
        }

        // Управление состоянием кнопки (Загрузка)
        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const textSpan = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.loader');

            if (isLoading) {
                textSpan.style.opacity = '0.5';
                loader.style.display = 'block';
                btn.disabled = true;
                btn.style.cursor = 'wait';
            } else {
                textSpan.style.opacity = '1';
                loader.style.display = 'none';
                btn.disabled = false;
                btn.style.cursor = 'pointer';
            }
        }

        // Логика регистрации
        document.getElementById('signup').onclick = async () => {
            setLoading('signup', true);
            msgContainer.classList.add('opacity-0'); // Скрыть старое сообщение

            const { error } = await supabase.auth.signUp({
                email: emailInput.value,
                password: passwordInput.value
            })

            setLoading('signup', false);
            
            if (error) {
                showMessage(error.message, true);
            } else {
                showMessage("Emailga tasdiqlash xati yuborildi ✅", false);
            }
        }

        // Логика входа
        document.getElementById('login').onclick = async () => {
            setLoading('login', true);
            msgContainer.classList.add('opacity-0');

            const { error } = await supabase.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value
            })

            setLoading('login', false);

            if (error) {
                showMessage(error.message, true);
            } else {
                showMessage("Muvaffaqiyatli! Yo'naltirilmoqda...", false);
                setTimeout(() => {
                    location.href = '/'
                }, 1000);
            }
        }
    </script>
    
    <!-- Добавляем кастомную анимацию тряски для ошибок в конфиг Tailwind на лету -->
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</body>
</html>
