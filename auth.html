<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Avtorizatsiya</title>
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
    .tab-active { color: white; border-bottom: 2px solid #3b82f6; }
    .tab-inactive { color: #64748b; }
    input::placeholder { color: #475569; }
    .status-msg { font-size: 11px; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
    .btn-disabled { opacity: 0.5; pointer-events: none; }
    .otp-input { letter-spacing: 0.5rem; text-align: center; font-size: 1.5rem; font-weight: bold; }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center text-white p-4"
      style="background: radial-gradient(circle at center, #1e293b 0%, #020617 100%)">

<div class="rounded-3xl p-8 w-full max-w-md text-center shadow-2xl animate-fade"
     style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1)">

  <h1 class="text-4xl font-black mb-2 tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-500">
    Prank-as
  </h1>
  <p id="system-subtitle" class="text-slate-400 mb-8 text-sm font-medium">Xavfsiz avtorizatsiya tizimi</p>

  <div id="authContent">
    <div id="tabs" class="flex justify-center gap-8 mb-6 border-b border-white/5">
      <button id="tab-login" class="pb-2 text-sm font-bold transition-all tab-active">KIRISH</button>
      <button id="tab-register" class="pb-2 text-sm font-bold transition-all tab-inactive">RO'YXATDAN O'TISH</button>
    </div>

    <!-- Email and Password Form -->
    <div id="emailForm" class="space-y-3 mb-6 transition-all">
      <div class="relative">
        <input type="email" id="email-input" placeholder="Email manzilingiz" 
               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors">
      </div>
      
      <div id="password-container" class="relative">
        <input type="password" id="password-input" placeholder="Parol" 
               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors">
      </div>

      <!-- OTP Input (Hidden by default) -->
      <div id="otp-container" class="hidden space-y-2">
        <p class="text-[10px] text-blue-400 uppercase tracking-widest mb-1">Emailingizga yuborilgan kodni kiriting</p>
        <input type="text" id="otp-input" maxlength="6" placeholder="000000" 
               class="otp-input w-full bg-white/10 border border-blue-500/50 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-400 transition-colors text-blue-400">
      </div>

      <button id="email-action-btn" 
              class="w-full py-3 rounded-xl font-bold bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all shadow-lg text-sm flex items-center justify-center">
        <span id="btn-text">Kirish</span>
      </button>

      <button id="resend-otp-btn" class="hidden text-[10px] text-slate-500 hover:text-white transition-colors uppercase mt-2">
        Kodni qayta yuborish
      </button>
      
      <p id="error-msg" class="status-msg bg-red-500/10 text-red-400 border border-red-500/20"></p>
      <p id="success-msg" class="status-msg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"></p>
    </div>

    <div id="social-divider" class="flex items-center gap-4 mb-6">
      <div class="h-[1px] bg-white/10 flex-1"></div>
      <span class="text-[10px] text-slate-500 uppercase tracking-widest">Yoki</span>
      <div class="h-[1px] bg-white/10 flex-1"></div>
    </div>

    <!-- CAPCHA -->
    <div id="captchaBox" class="flex flex-col items-center mb-6">
      <div class="g-recaptcha" 
           data-sitekey="6LeOGjssAAAAAHnJBytIycrKEvDJHjMIcnjF7XN2" 
           data-theme="dark" 
           data-callback="onCaptchaSuccess"></div>
      <p class="text-slate-500 text-[10px] mt-3 uppercase tracking-widest">Davom etish uchun tasdiqlang</p>
    </div>

    <!-- Social Logins -->
    <div id="loginBox" class="space-y-3 opacity-20 pointer-events-none transition-all duration-700 scale-95">
      <button id="google-login"
              class="w-full py-3.5 rounded-2xl font-bold bg-white text-black hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-3 shadow-lg text-sm">
        <img src="https://www.google.com/favicon.ico" class="w-4 h-4" alt="G"> 
        <span id="google-text-span">Google bilan kirish</span>
      </button>

      <button id="telegram-login"
              class="w-full py-3.5 rounded-2xl font-bold text-white hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-3 shadow-lg text-sm"
              style="background: linear-gradient(135deg, #37aee2 0%, #1e96c8 100%)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        <span id="telegram-text-span">Telegram bilan kirish</span>
      </button>
    </div>
  </div>

  <!-- Account Dashboard -->
  <div id="accountBox" class="hidden space-y-4 mt-6 border-t border-white/10 pt-8 animate-fade">
    <div class="flex flex-col items-center justify-center mb-4">
        <div id="userPreview" class="w-16 h-16 rounded-full border-2 border-blue-500 p-1 mb-2">
            <div class="w-full h-full rounded-full bg-slate-800 flex items-center justify-center overflow-hidden">
                <span class="text-2xl">👤</span>
            </div>
        </div>
        <p id="userEmailDisplay" class="text-xs text-slate-400 font-mono"></p>
    </div>
    
    <button id="logout"
            class="w-full py-3 rounded-xl font-bold bg-white/5 text-slate-300 hover:bg-white/10 transition-all border border-white/10">
      Chiqish
    </button>
    
    <button id="deleteAccount"
            class="w-full py-3 rounded-xl font-bold bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-600 hover:text-white transition-all text-xs">
      Hisobni butunlay o'chirish
    </button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabase = createClient(
    "https://gefaqrfjzwemwuxuoadp.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg"
  )

  const elements = {
    loginBox: document.getElementById("loginBox"),
    accountBox: document.getElementById("accountBox"),
    authContent: document.getElementById("authContent"),
    captchaBox: document.getElementById("captchaBox"),
    userPreview: document.getElementById("userPreview"),
    emailInput: document.getElementById("email-input"),
    passwordInput: document.getElementById("password-input"),
    passwordContainer: document.getElementById("password-container"),
    otpInput: document.getElementById("otp-input"),
    otpContainer: document.getElementById("otp-container"),
    emailActionBtn: document.getElementById("email-action-btn"),
    resendOtpBtn: document.getElementById("resend-otp-btn"),
    errorMsg: document.getElementById("error-msg"),
    successMsg: document.getElementById("success-msg"),
    btnText: document.getElementById("btn-text"),
    tabLogin: document.getElementById("tab-login"),
    tabRegister: document.getElementById("tab-register"),
    userEmailDisplay: document.getElementById("userEmailDisplay"),
    googleTextSpan: document.getElementById("google-text-span"),
    telegramTextSpan: document.getElementById("telegram-text-span")
  };

  let isLoginMode = true;
  let isWaitingForOTP = false;

  const translateError = (err) => {
    const msg = err.message?.toLowerCase() || "";
    if (msg.includes("invalid login credentials") || msg.includes("invalid grant")) return "Email yoki parol/kod noto'g'ri!";
    if (msg.includes("user already registered")) return "Bu email allaqachon ro'yxatdan o'tgan!";
    if (msg.includes("at least 6 characters")) return "Parol kamida 6 ta belgidan iborat bo'lishi kerak!";
    if (msg.includes("rate limit")) return "Siz juda ko'p urinish qildingiz. Biroz kuting.";
    return "Xatolik: " + err.message;
  };

  function updateUI() {
    elements.errorMsg.style.display = "none";
    elements.successMsg.style.display = "none";
    
    if (isWaitingForOTP) {
        elements.passwordContainer.classList.add("hidden");
        elements.otpContainer.classList.remove("hidden");
        elements.resendOtpBtn.classList.remove("hidden");
        elements.btnText.innerText = "Kodni tasdiqlash";
        return;
    }

    elements.passwordContainer.classList.remove("hidden");
    elements.otpContainer.classList.add("hidden");
    elements.resendOtpBtn.classList.add("hidden");

    if (isLoginMode) {
      elements.tabLogin.className = "pb-2 text-sm font-bold transition-all tab-active";
      elements.tabRegister.className = "pb-2 text-sm font-bold transition-all tab-inactive";
      elements.btnText.innerText = "Kirish";
    } else {
      elements.tabLogin.className = "pb-2 text-sm font-bold transition-all tab-inactive";
      elements.tabRegister.className = "pb-2 text-sm font-bold transition-all tab-active";
      elements.btnText.innerText = "Ro'yxatdan o'tish";
    }
  }

  elements.tabLogin.onclick = () => { isLoginMode = true; isWaitingForOTP = false; updateUI(); };
  elements.tabRegister.onclick = () => { isLoginMode = false; isWaitingForOTP = false; updateUI(); };

  window.onCaptchaSuccess = (token) => {
    if(token) {
      elements.loginBox.classList.remove("opacity-20", "pointer-events-none", "scale-95");
      elements.captchaBox.classList.add("hidden");
    }
  }

  // Handle Action
  elements.emailActionBtn.onclick = async () => {
    const email = elements.emailInput.value.trim();
    if(!email) return;

    elements.emailActionBtn.classList.add("btn-disabled");
    elements.errorMsg.style.display = "none";

    try {
        if (isWaitingForOTP) {
            // Verify OTP
            const token = elements.otpInput.value.trim();
            const { error } = await supabase.auth.verifyOtp({
                email,
                token,
                type: isLoginMode ? 'magiclink' : 'signup'
            });

            if (error) throw error;
            window.location.reload();
            return;
        }

        if (isLoginMode) {
            // Option 1: Try password first, if user wants OTP they can just use "Forgot" or we can trigger OTP.
            // Let's implement Password login by default, and provide "Login with Code" via Supabase
            const password = elements.passwordInput.value.trim();
            
            if (password) {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                window.location.reload();
            } else {
                // If no password, send Magic Link (Code)
                const { error } = await supabase.auth.signInWithOtp({ email });
                if (error) throw error;
                isWaitingForOTP = true;
                elements.successMsg.innerText = "Tasdiqlash kodi yuborildi!";
                elements.successMsg.style.display = "block";
                updateUI();
            }
        } else {
            // Register Mode
            const password = elements.passwordInput.value.trim();
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            
            isWaitingForOTP = true;
            elements.successMsg.innerText = "Ro'yxatdan o'tish uchun kod yuborildi!";
            elements.successMsg.style.display = "block";
            updateUI();
        }
    } catch (err) {
        elements.errorMsg.innerText = translateError(err);
        elements.errorMsg.style.display = "block";
    } finally {
        elements.emailActionBtn.classList.remove("btn-disabled");
    }
  };

  // Resend logic
  elements.resendOtpBtn.onclick = () => {
    isWaitingForOTP = false;
    elements.emailActionBtn.click();
  };

  // Socials
  document.getElementById("google-login").onclick = async () => {
    await supabase.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.origin } });
  }

  // Logout
  document.getElementById("logout").onclick = async () => {
    await supabase.auth.signOut();
    localStorage.clear();
    window.location.reload();
  };

  // Auth State
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    const tgUser = JSON.parse(localStorage.getItem("tg_user") || "null");

    if (session || tgUser) {
      elements.authContent.classList.add("hidden");
      elements.accountBox.classList.remove("hidden");

      const userEmail = session?.user?.email || tgUser?.username || "Foydalanuvchi";
      elements.userEmailDisplay.innerText = userEmail;

      const avatarUrl = session?.user?.user_metadata?.avatar_url || localStorage.getItem("tg_avatar");
      if (avatarUrl) {
        elements.userPreview.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full">`;
      }
    }
  })();
</script>
</body>
</html>
