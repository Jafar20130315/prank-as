<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Google Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 w-full max-w-sm text-center text-white">
    <h1 class="text-3xl font-bold mb-2">Prank-as</h1>
    <p class="text-slate-400 mb-6">Google orqali tizimga kiring</p>

    <button id="google-login"
      class="w-full py-3 rounded-xl bg-red-500 hover:bg-red-600 font-semibold transition">
      Google bilan kirish
    </button>

    <p id="msg" class="mt-4 text-sm"></p>
  </div>

  <!-- SUPABASE (ESM, 100% CONNECT) -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://GEFAQRFJZWEMWUXUOADP.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const btn = document.getElementById('google-login')
    const msg = document.getElementById('msg')

    // Sahifa yuklanganda login holatini tekshirish
    const checkUser = async () => {
      const { data: { user } } = await supabase.auth.getUser()
      if (user) {
        msg.textContent = `Tizimga kirding: ${user.email}`
        btn.disabled = true
      }
    }

    btn.onclick = async () => {
      msg.textContent = 'Google oynasi ochilmoqda...'

      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      })

      if (error) {
        msg.textContent = error.message
      }
    }

    checkUser()
  </script>

</body>
</html>
