<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Login</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.png"/>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

</head>

<body class="min-h-screen flex items-center justify-center text-white"
      style="font-family: sans-serif; background:#0f172a">

<div class="rounded-3xl p-10 w-full max-w-md text-center"
     style="background: rgba(255,255,255,.05);backdrop-filter:blur(10px)">

  <h1 class="text-4xl font-bold mb-2">Prank-as</h1>

  <p class="text-slate-400 mb-6">
    Quyidagi usullardan biri orqali tizimga kiring
  </p>

  <!-- reCAPTCHA BOX -->
  <div class="flex justify-center mb-5">
    <div class="g-recaptcha"
         data-sitekey="6LctEEEsAAAAAIYEMkFvKyCVj6ftjhm3iVPkwQyY"
         data-callback="captchaOk">
    </div>
  </div>

  <div class="space-y-4">

    <!-- GOOGLE LOGIN -->
    <button id="google-login"
            disabled
            class="w-full py-3 rounded-2xl font-semibold bg-white/40 text-black cursor-not-allowed">
      Google bilan kirish
    </button>

    <!-- TELEGRAM LOGIN -->
    <button id="telegram-login"
            disabled
            class="w-full py-3 rounded-2xl font-semibold bg-blue-400 cursor-not-allowed">
      Telegram bilan kirish
    </button>

    <!-- LOGOUT -->
    <button id="logout"
            class="hidden w-full py-3 rounded-2xl font-semibold bg-red-500">
      Chiqish
    </button>

  </div>

</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const WORKER_URL = "https://prankasapi.windowsnoutbook.workers.dev";

  const supabase = createClient(
    'https://gefaqrfjzwemwuxuoadp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'
  )

  const googleBtn = document.getElementById("google-login")
  const tgBtn = document.getElementById("telegram-login")
  const logoutBtn = document.getElementById("logout")

  // ============= CAPTCHA CALLBACK ===================
  window.captchaOk = function(){
    googleBtn.disabled = false
    tgBtn.disabled = false

    googleBtn.classList.remove("cursor-not-allowed","bg-white/40")
    googleBtn.classList.add("bg-white")

    tgBtn.classList.remove("cursor-not-allowed","bg-blue-400")
    tgBtn.classList.add("bg-blue-500")
  }

  // =========================
  // GOOGLE LOGIN
  // =========================
  googleBtn.onclick = async () => {
    await supabase.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo:'https://prank-as.site' }
    })
  }

  // =========================
  // TELEGRAM CALLBACK
  // =========================
  window.onTelegramAuth = async function(user){

    // ---> BU MA’LUMOTNI LOCALSTORAGEGA EMAS
    // ---> SERVER TOMONIDA KVDA SAQLAYSAN (tushuntirish pastda)

    await fetch(`${WORKER_URL}/auth`,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(user)
    })

    alert("Salom, " + (user.first_name || "foydalanuvchi") + "!")

    window.location.href = "/"
  }

  // TELEGRAM LOGIN BUTTON
  tgBtn.onclick = () => {
    const s = document.createElement("script")
    s.src = "https://telegram.org/js/telegram-widget.js?22"

    s.setAttribute("data-telegram-login","prank_as_bot")
    s.setAttribute("data-size","large")
    s.setAttribute("data-userpic","true")
    s.setAttribute("data-request-access","write")
    s.setAttribute("data-onauth","onTelegramAuth(user)")

    document.body.appendChild(s)
  }

  // =========================
  // LOGOUT — UNIVERSAL
  // =========================
  logoutBtn.onclick = async () => {

    await supabase.auth.signOut().catch(()=>{})

    alert("Chiqildi 👌")
    window.location.href = "/auth"
  }

  // =========================
  // HOLATNI TEKSHIRISH
  // =========================
  (async () => {

    const { data: { session } } = await supabase.auth.getSession()

    if (session) {

      // 🔥 login tugmalarni yashiramiz
      googleBtn.classList.add("hidden")
      tgBtn.classList.add("hidden")

      // 🔥 logout tugmasini ko'rsatamiz
      logoutBtn.classList.remove("hidden")
    }
  })()
</script>

</body>
</html>
