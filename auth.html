<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Avtorizatsiya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    @keyframes fadeIn {from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    .animate-fade{animation:fadeIn .5s ease-out forwards}
    .tab-active{color:#fff;border-bottom:2px solid #3b82f6}
    .tab-inactive{color:#64748b}
    .status-msg{font-size:11px;padding:10px;border-radius:8px;margin-top:10px;display:none}
    .otp-input{letter-spacing:.5rem;text-align:center;font-size:1.5rem;font-weight:bold}
  </style>
</head>

<body class="min-h-screen flex items-center justify-center text-white p-4"
      style="background:radial-gradient(circle at center,#1e293b 0%,#020617 100%)">

<div class="rounded-3xl p-8 w-full max-w-md text-center shadow-2xl animate-fade"
     style="background:rgba(255,255,255,.03);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)">

  <h1 class="text-4xl font-black mb-2 tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-500">
    Prank-as
  </h1>
  <p class="text-slate-400 mb-8 text-sm font-medium">Xavfsiz avtorizatsiya tizimi</p>

  <!-- AUTH CONTENT -->
  <div id="authContent">

    <!-- TABS -->
    <div class="flex justify-center gap-8 mb-6 border-b border-white/5">
      <button id="tab-login" class="pb-2 text-sm font-bold tab-active">KIRISH</button>
      <button id="tab-register" class="pb-2 text-sm font-bold tab-inactive">RO'YXATDAN O'TISH</button>
    </div>

    <!-- EMAIL FORM -->
    <div id="emailForm" class="space-y-3 mb-6">

      <input id="email-input" type="email" placeholder="Email manzilingiz"
             class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm">

      <div id="password-box">
        <input id="password-input" type="password" placeholder="Parol"
               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm">
      </div>

      <!-- OTP INPUT -->
      <div id="otp-box" class="hidden">
        <p class="text-[10px] text-blue-400 uppercase tracking-widest">Emailga yuborilgan kodni kiriting</p>
        <input id="otp-input" maxlength="6" placeholder="000000"
               class="otp-input w-full bg-white/10 border border-blue-500/50 rounded-xl px-4 py-3 text-blue-400">
      </div>

      <button id="email-action-btn"
              class="w-full py-3 rounded-xl font-bold bg-blue-600 hover:bg-blue-500">
        <span id="btn-text">Kirish</span>
      </button>

      <p id="error-msg" class="status-msg bg-red-500/10 text-red-400 border border-red-500/20"></p>
      <p id="success-msg" class="status-msg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"></p>

    </div>

    <!-- DIVIDER -->
    <div class="flex items-center gap-4 mb-6">
      <div class="h-[1px] bg-white/10 flex-1"></div>
      <span class="text-[10px] text-slate-500 uppercase tracking-widest">Yoki</span>
      <div class="h-[1px] bg-white/10 flex-1"></div>
    </div>

    <!-- CAPTCHA -->
    <div id="captchaBox" class="flex flex-col items-center mb-6">
      <div class="g-recaptcha"
           data-sitekey="6LeOGjssAAAAAHnJBytIycrKEvDJHjMIcnjF7XN2"
           data-theme="dark"
           data-callback="onCaptchaSuccess"></div>
    </div>

    <!-- SOCIAL LOGIN -->
    <div id="loginBox" class="space-y-3 opacity-20 pointer-events-none transition-all scale-95">

      <button id="google-login"
              class="w-full py-3.5 rounded-2xl font-bold bg-white text-black flex items-center justify-center gap-3">
        <img src="https://www.google.com/favicon.ico" class="w-4 h-4"> Google bilan kirish
      </button>

      <button id="telegram-login"
              class="w-full py-3.5 rounded-2xl font-bold text-white flex items-center justify-center gap-3"
              style="background:linear-gradient(135deg,#37aee2,#1e96c8)">
        Telegram bilan kirish
      </button>

    </div>
  </div>

  <!-- ACCOUNT -->
  <div id="accountBox" class="hidden mt-6 space-y-4 border-t border-white/10 pt-6">
    <div id="userPreview"
      class="w-16 h-16 mx-auto rounded-full border-2 border-blue-500 flex items-center justify-center">👤</div>

    <p id="userEmailDisplay" class="text-xs text-slate-400 font-mono"></p>

    <button id="logout"
      class="w-full py-3 rounded-2xl bg-white/5 text-slate-300 border border-white/10">
      Chiqish
    </button>
  </div>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
 "https://gefaqrfjzwemwuxuoadp.supabase.co",
 "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg"
)

const emailInput = document.getElementById("email-input")
const passwordInput = document.getElementById("password-input")
const otpInput = document.getElementById("otp-input")

const otpBox = document.getElementById("otp-box")
const passwordBox = document.getElementById("password-box")

const errorMsg = document.getElementById("error-msg")
const successMsg = document.getElementById("success-msg")

const emailBtn = document.getElementById("email-action-btn")

let isLoginMode = true
let waitingOtp = false
let tempEmail = null

// tabs
document.getElementById("tab-login").onclick = () => { isLoginMode = true; waitingOtp = false; refreshUI(); }
document.getElementById("tab-register").onclick = () => { isLoginMode = false; waitingOtp = false; refreshUI(); }

// captcha
window.onCaptchaSuccess = () => {
 document.getElementById("loginBox").classList.remove("opacity-20","pointer-events-none","scale-95")
 document.getElementById("captchaBox").classList.add("hidden")
}

// refresh UI
function refreshUI(){
 errorMsg.style.display="none"
 successMsg.style.display="none"

 if(waitingOtp){
   passwordBox.classList.add("hidden")
   otpBox.classList.remove("hidden")
   return
 }

 passwordBox.classList.remove("hidden")
 otpBox.classList.add("hidden")
}

// EMAIL + PASSWORD + OTP flow
emailBtn.onclick = async () => {

 errorMsg.style.display="none"
 successMsg.style.display="none"

 const email = emailInput.value.trim()

 if(waitingOtp){
   const token = otpInput.value.trim()

   const { error } = await supabase.auth.verifyOtp({
     email,
     token,
     type: "email" // <-- MUHIM! to‘g‘ri tur
   })

   if(error){
     errorMsg.innerText="Kod noto‘g‘ri yoki muddati o‘tgan"
     errorMsg.style.display="block"
   } else location.reload()

   return
 }

 const password = passwordInput.value.trim()

 let result

 if(isLoginMode)
   result = await supabase.auth.signInWithPassword({ email,password })
 else
   result = await supabase.auth.signUp({ email,password })

 if(result.error){
   errorMsg.innerText=result.error.message
   errorMsg.style.display="block"
   return
 }

 tempEmail = email

 await supabase.auth.signInWithOtp({
   email,
   options:{ shouldCreateUser:false }
 })

 waitingOtp = true
 successMsg.innerText="Kod emailingizga yuborildi"
 successMsg.style.display="block"

 refreshUI()
}

// GOOGLE
document.getElementById("google-login").onclick = async () => {
 await supabase.auth.signInWithOAuth({
   provider:"google",
   options:{ redirectTo: window.location.origin }
 })
}

// TELEGRAM
window.onTelegramAuth = async function(user){
 localStorage.setItem("tg_user",JSON.stringify(user))
 if(user.photo_url) localStorage.setItem("tg_avatar",user.photo_url)
 location.reload()
}

document.getElementById("telegram-login").onclick = () => {
 const s=document.createElement("script")
 s.src="https://telegram.org/js/telegram-widget.js?22"
 s.setAttribute("data-telegram-login","prank_as_bot")
 s.setAttribute("data-size","large")
 s.setAttribute("data-onauth","onTelegramAuth(user)")
 document.body.appendChild(s)
}

// LOGOUT
document.getElementById("logout").onclick = async()=>{
 await supabase.auth.signOut()
 localStorage.clear()
 location.reload()
}

// SESSION INIT
;(async()=>{
 const { data:{ session } }=await supabase.auth.getSession()
 const tg=JSON.parse(localStorage.getItem("tg_user")||"null")

 if(session || tg){
  authContent.classList.add("hidden")
  accountBox.classList.remove("hidden")

  userEmailDisplay.innerText=session?.user?.email || tg?.username

  const avatar=session?.user?.user_metadata?.avatar_url || localStorage.getItem("tg_avatar")
  if(avatar) userPreview.innerHTML=`<img src="${avatar}" class="w-full h-full rounded-full">`
 }
})();
</script>

</body>
</html>
