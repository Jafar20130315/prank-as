<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Google Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- reCAPTCHA v2 -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <!-- reCAPTCHA v3 -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LdfHDssAAAAAHlwdbWRhiJW5fnGwh1r32335fzZ"></script>

  <style>
    body {
      font-family: sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 100%);
      color: white;
    }
    .btn-disabled{
      opacity: .5;
      cursor: not-allowed;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center">

<div class="glass-card rounded-3xl p-10 w-full max-w-md text-center">

  <h1 class="text-3xl font-bold mb-5">Prank-as</h1>

  <p id="status" class="mb-5 text-slate-300">
    Google orqali tizimga kiring
  </p>

  <!-- reCAPTCHA v2 — faqat birinchi marta -->
  <div id="captcha-box" class="g-recaptcha mb-4"
       data-sitekey="6LeOGjssAAAAAHnJBytIycrKEvDJHjMIcnjF7XN2"
       data-callback="recaptchaV2Done">
  </div>

  <button id="google-login"
          disabled
          class="w-full py-3 rounded-xl bg-white text-black font-bold btn-disabled">
      Google bilan kirish
  </button>

  <button id="logout"
          class="hidden mt-3 w-full py-3 rounded-xl bg-white/10 border border-white/20">
      Chiqish
  </button>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
 'https://gefaqrfjzwemwuxuoadp.supabase.co/',
 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'
)

const loginBtn = document.getElementById("google-login")
const logoutBtn = document.getElementById("logout")
const captchaBox = document.getElementById("captcha-box")
const status = document.getElementById("status")

// holatlarni saqlash
let registered = localStorage.getItem("user_registered") === "true"
let attempts = Number(localStorage.getItem("login_attempts") || 0)

let v2ok = false
let v3ok = false

// v2 bajarilganda
window.recaptchaV2Done = () => {
  v2ok = true
  enableLogin()
}

// v3 ishga tushirish
function runV3() {
  grecaptcha.ready(() => {
    grecaptcha.execute("6LdfHDssAAAAAHlwdbWRhiJW5fnGwh1r32335fzZ", {action: "login"})
      .then(token => {
        // token bor — ok
        v3ok = Boolean(token)
        enableLogin()
      })
  })
}

// tugma holatini boshqarish
function enableLogin() {
  // hali registratsiya bo'lmagan — v2 majburiy
  if (!registered && !v2ok) {
    loginBtn.disabled = true
    loginBtn.classList.add("btn-disabled")
    return
  }

  // ko‘p urinilgan — v3 majburiy
  if (registered && attempts >= 3 && !v3ok) {
    loginBtn.disabled = true
    loginBtn.classList.add("btn-disabled")
    return
  }

  // ruxsat beriladi
  loginBtn.disabled = false
  loginBtn.classList.remove("btn-disabled")
}

// UI sozlash
if (registered) {
  captchaBox.style.display = "none"
  enableLogin()
  if (attempts >= 3) runV3()
}

// sessiya tekshirish
const { data: { session } } = await supabase.auth.getSession()
if (session?.user) {
  status.textContent = `Salom, ${session.user.user_metadata.full_name || "foydalanuvchi"}`
  loginBtn.classList.add("hidden")
  logoutBtn.classList.remove("hidden")
}

// login
loginBtn.onclick = async () => {
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: "https://prank-as.site" }
  })

  localStorage.setItem("user_registered", "true")
}

// logout
logoutBtn.onclick = async () => {
  await supabase.auth.signOut()
  attempts++
  localStorage.setItem("login_attempts", attempts)
  location.reload()
}
</script>

</body>
</html>
