<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Kirish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
    
    /* Центрирование виджета Telegram */
    iframe[id^="telegram-login"] {
        display: block !important;
        margin: 0 auto !important;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center text-white p-4"
      style="background: radial-gradient(circle at center, #1e293b 0%, #020617 100%)">

<div class="rounded-3xl p-8 w-full max-w-md text-center shadow-2xl animate-fade"
     style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1)">

  <h1 class="text-4xl font-black mb-2 tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-500">
    Prank-as
  </h1>
  <p id="subtitle" class="text-slate-400 mb-8 text-sm font-medium">Xavfsiz avtorizatsiya tizimi</p>

  <div id="captchaBox" class="flex flex-col items-center mb-8">
    <div class="g-recaptcha" 
         data-sitekey="6LctEEEsAAAAAIYEMkFvKyCVj6ftjhm3iVPkwQyY" 
         data-theme="dark" 
         data-callback="onCaptchaSuccess"></div>
    <p id="captchaText" class="text-slate-500 text-[10px] mt-3 uppercase tracking-widest">Davom etish uchun tasdiqlang</p>
  </div>

  <div id="loginBox" class="space-y-4 opacity-20 pointer-events-none transition-all duration-700 scale-95 flex flex-col items-center">
    
    <button id="google-login"
            class="w-[240px] h-[40px] rounded-[20px] font-bold bg-white text-black hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg text-sm">
      <img src="https://www.google.com/favicon.ico" class="w-4 h-4" alt="G"> 
      <span id="googleText">Google bilan kirish</span>
    </button>

    <div id="telegram-widget-container" class="w-full flex justify-center">
        <script async src="https://telegram.org/js/telegram-widget.js?22" 
                data-telegram-login="prank_as_bot" 
                data-size="medium" 
                data-radius="20" 
                data-onauth="onTelegramAuth(user)" 
                data-request-access="write"></script>
    </div>

  </div>

  <div id="accountBox" class="hidden space-y-4 mt-6 border-t border-white/10 pt-8 animate-fade">
    <div class="flex items-center justify-center mb-4">
        <div id="userPreview" class="w-16 h-16 rounded-full border-2 border-blue-500 p-1">
            <div class="w-full h-full rounded-full bg-slate-800 flex items-center justify-center overflow-hidden">
                <span class="text-2xl">👤</span>
            </div>
        </div>
    </div>
    
    <button id="logout"
            class="w-full py-3.5 rounded-2xl font-bold bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-500 hover:text-white transition-all">
      Chiqish
    </button>

    <button id="deleteAccount"
            class="w-full py-2 text-slate-500 text-xs font-medium hover:text-slate-300 transition-colors">
      Hisobni butunlay o'chirish
    </button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabase = createClient(
    "https://gefaqrfjzwemwuxuoadp.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg"
  )

  const loginBox = document.getElementById("loginBox");
  const accountBox = document.getElementById("accountBox");
  const captchaBox = document.getElementById("captchaBox");
  const userPreview = document.getElementById("userPreview");

  // --- ЯЗЫКОВАЯ ЛОГИКА (TRANSLATIONS) ---
  const translations = {
      ru: {
          subtitle: "Система безопасной авторизации",
          captcha: "ПОДТВЕРДИТЕ, ЧТОБЫ ПРОДОЛЖИТЬ",
          google: "Войти через Google",
          logout: "Выйти",
          delete: "Удалить аккаунт навсегда"
      },
      uz: {
          subtitle: "Xavfsiz avtorizatsiya tizimi",
          captcha: "DAVOM ETISH UCHUN TASDIQLANG",
          google: "Google bilan kirish",
          logout: "Chiqish",
          delete: "Hisobni butunlay o'chirish"
      },
      en: {
          subtitle: "Secure authorization system",
          captcha: "VERIFY TO CONTINUE",
          google: "Sign in with Google",
          logout: "Log out",
          delete: "Delete account permanently"
      }
  };

  function setLanguage() {
      // Получаем язык браузера (например, "ru-RU" -> "ru")
      const userLang = navigator.language.slice(0, 2); 
      // Выбираем переводы или дефолтный (uz)
      const t = translations[userLang] || translations['uz'];

      document.getElementById('subtitle').innerText = t.subtitle;
      document.getElementById('captchaText').innerText = t.captcha;
      document.getElementById('googleText').innerText = t.google;
      document.getElementById('logout').innerText = t.logout;
      document.getElementById('deleteAccount').innerText = t.delete;
  }
  // Запускаем перевод при загрузке
  setLanguage();

  // --- ЛОГИКА АВТОРИЗАЦИИ ---

  // RECAPTCHA SUCCESS
  window.onCaptchaSuccess = function(token) {
    if(token) {
      loginBox.classList.remove("opacity-20", "pointer-events-none", "scale-95");
      captchaBox.classList.add("hidden");
    }
  }

  // GOOGLE LOGIN
  document.getElementById("google-login").onclick = async () => {
    await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: "https://prank-as.site" }
    });
  }

  // TELEGRAM LOGIN CALLBACK (Глобальная функция, чтобы виджет её видел)
  window.onTelegramAuth = async function(user) {
    // Сохраняем данные пользователя
    localStorage.setItem("tg_user", JSON.stringify(user));
    
    // Сохраняем фото
    if (user.photo_url) {
        localStorage.setItem("tg_avatar", user.photo_url);
    }

    try {
        await fetch("https://prankasapi.windowsnoutbook.workers.dev/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(user)
        });
    } finally {
        // Редирект на главную
        window.location.href = "https://prank-as.site";
    }
  }

  // LOGOUT
  document.getElementById("logout").onclick = async () => {
    await supabase.auth.signOut();
    localStorage.removeItem("tg_user");
    localStorage.removeItem("tg_avatar");
    window.location.reload();
  }

  // INITIAL STATE CHECK
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    const tgUser = localStorage.getItem("tg_user");

    if (session || tgUser) {
      loginBox.classList.add("hidden");
      captchaBox.classList.add("hidden");
      accountBox.classList.remove("hidden");

      // Показ аватарки
      const avatarUrl = session?.user?.user_metadata?.picture || localStorage.getItem("tg_avatar");
      if (avatarUrl) {
        userPreview.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full">`;
      }
    }
  })();
</script>
</body>
</html>
