<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 3D Generator Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { background: #050505; color: #0f0; font-family: 'JetBrains Mono', monospace; margin: 0; overflow: hidden; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; }
        .glass { background: rgba(10, 20, 15, 0.9); border: 1px solid #0f0; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); padding: 2rem; max-width: 600px; width: 90%; }
        input, textarea { background: #000; border: 1px solid #333; color: #0f0; width: 100%; padding: 0.5rem; margin-bottom: 1rem; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #0f0; }
        button { background: #0f0; color: #000; border: none; padding: 1rem; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #fff; box-shadow: 0 0 15px #0f0; }
        .hidden { display: none !important; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        /* Стилизация dat.GUI для киберпанк стиля */
        .dg.main { right: 20px !important; top: 20px !important; z-index: 100 !important; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-container" class="ui-layer flex flex-col items-center justify-center">
        
        <!-- Окно подключения и ввода промпта -->
        <div id="setup-panel" class="glass interactive">
            <h1 class="text-3xl font-bold mb-6 text-center">NEURAL LINK 3D</h1>
            
            <div class="mb-4">
                <label class="text-xs text-gray-400">URL СЕРВЕРА (из Google Colab)</label>
                <input type="text" id="api-url" placeholder="https://xxxx-xx-xx.ngrok-free.app">
            </div>

            <div class="mb-6">
                <label class="text-xs text-gray-400">ПРОМПТ ДЛЯ ГЕНЕРАЦИИ</label>
                <textarea id="prompt-input" rows="3" placeholder="Красный робот-гигант в тяжелой броне..."></textarea>
            </div>

            <button onclick="connectAndGenerate()">ЗАПУСТИТЬ ГЕНЕРАЦИЮ</button>
            <p id="status-msg" class="text-xs mt-2 text-center text-red-500 min-h-[20px]"></p>
        </div>

        <!-- Экран загрузки -->
        <div id="loading-panel" class="hidden glass interactive text-center">
            <h2 class="text-2xl animate-pulse">ОБРАБОТКА ДАННЫХ...</h2>
            <p class="text-sm text-gray-400 mt-2">Python Backend выполняет инференс нейросети</p>
        </div>

        <!-- Подсказка после генерации -->
        <div id="controls-hint" class="hidden absolute bottom-5 left-5 glass interactive" style="width: auto; padding: 1rem;">
            <h3 class="font-bold border-b border-green-900 pb-1 mb-2">РИГГИНГ АКТИВЕН</h3>
            <ul class="text-xs text-gray-400 space-y-1">
                <li>Панель справа: управление костями (рот, руки)</li>
                <li>ПКМ: Перемещение камеры</li>
                <li>ЛКМ: Вращение</li>
            </ul>
            <button onclick="location.reload()" class="mt-4 py-2 text-xs">НОВАЯ МОДЕЛЬ</button>
        </div>

    </div>

<script>
    let scene, camera, renderer, characterGroup, gui;
    
    // Состояние риггинга для программного сдвигания
    const rigState = {
        mouthOpen: 0,
        armLift: 0,
        headTurn: 0
    };

    // Основные части модели
    let jawPart, armL, armR, headPart;

    async function connectAndGenerate() {
        const apiUrlInput = document.getElementById('api-url').value.trim();
        const apiUrl = apiUrlInput.replace(/\/$/, ""); 
        const prompt = document.getElementById('prompt-input').value;
        const msg = document.getElementById('status-msg');

        if (!apiUrl || !prompt) {
            msg.textContent = "ОШИБКА: Введите URL и Промпт";
            return;
        }

        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('loading-panel').classList.remove('hidden');

        try {
            // Запрос к вашему Python серверу в Colab
            const response = await fetch(`${apiUrl}/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });

            if (!response.ok) throw new Error("Server Error");
            
            const data = await response.json();
            
            document.getElementById('loading-panel').classList.add('hidden');
            document.getElementById('controls-hint').classList.remove('hidden');
            
            initThreeJS(data.dna);

        } catch (error) {
            document.getElementById('loading-panel').classList.add('hidden');
            document.getElementById('setup-panel').classList.remove('hidden');
            msg.textContent = "ОШИБКА СВЯЗИ: Проверьте ссылку Ngrok";
            console.error(error);
        }
    }

    function initThreeJS(dna) {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.Fog(0x050505, 5, 25);

        camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 5);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        // Свет
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const spot = new THREE.SpotLight(dna.color_glow, 2);
        spot.position.set(2, 5, 3);
        spot.castShadow = true;
        scene.add(spot);

        // Генерация меша на основе ДНК от нейросети
        createProceduralMesh(dna);

        // Настройка GUI для управления точками
        if (gui) gui.destroy();
        gui = new dat.GUI();
        const rigFolder = gui.addFolder('УПРАВЛЕНИЕ ТОЧКАМИ (RIGGING)');
        rigFolder.add(rigState, 'mouthOpen', 0, 1).name('Открыть рот').onChange(updateRig);
        rigFolder.add(rigState, 'armLift', 0, 2).name('Поднять руки').onChange(updateRig);
        rigFolder.add(rigState, 'headTurn', -1, 1).name('Поворот головы').onChange(updateRig);
        rigFolder.open();

        new THREE.OrbitControls(camera, renderer.domElement);
        animate();
    }

    function createProceduralMesh(dna) {
        characterGroup = new THREE.Group();
        
        const mainMat = new THREE.MeshStandardMaterial({ 
            color: dna.color_skin, 
            roughness: 0.3,
            metalness: 0.8
        });
        const glowMat = new THREE.MeshBasicMaterial({ color: dna.color_glow });

        const sH = dna.scale_head;
        const sA = dna.scale_arms;

        // Корпус (Torso)
        const torso = new THREE.Mesh(new THREE.BoxGeometry(dna.build === 'bulky' ? 0.9 : 0.6, 1.0, 0.4), mainMat);
        torso.position.y = 1.2;
        torso.castShadow = true;
        characterGroup.add(torso);

        // Голова
        headPart = new THREE.Group();
        headPart.position.set(0, 1.75, 0);
        characterGroup.add(headPart);

        const skull = new THREE.Mesh(new THREE.BoxGeometry(0.4 * sH, 0.4 * sH, 0.4 * sH), mainMat);
        headPart.add(skull);

        const eyeLine = new THREE.Mesh(new THREE.BoxGeometry(0.3 * sH, 0.04, 0.05), glowMat);
        eyeLine.position.set(0, 0.05, 0.2 * sH);
        headPart.add(eyeLine);

        // Нижняя челюсть (ТОЧКА СДВИГАНИЯ)
        jawPart = new THREE.Group();
        jawPart.position.set(0, -0.15 * sH, 0);
        headPart.add(jawPart);
        
        const jawMesh = new THREE.Mesh(new THREE.BoxGeometry(0.38 * sH, 0.15 * sH, 0.35 * sH), mainMat);
        jawMesh.position.set(0, -0.07, 0.05);
        jawPart.add(jawMesh);

        // Руки (ТОЧКИ СДВИГАНИЯ)
        function createArm(side) {
            const group = new THREE.Group();
            group.position.set(side * 0.5, 1.6, 0);
            
            const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.7 * sA), mainMat);
            upper.position.y = -0.35 * sA;
            group.add(upper);

            const hand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), glowMat);
            hand.position.y = -0.75 * sA;
            group.add(hand);

            return group;
        }

        armL = createArm(1);
        armR = createArm(-1);
        characterGroup.add(armL);
        characterGroup.add(armR);

        // Ноги
        const legGeo = new THREE.BoxGeometry(0.15, 1.2, 0.15);
        const legL = new THREE.Mesh(legGeo, mainMat);
        legL.position.set(0.2, 0.6, 0);
        characterGroup.add(legL);
        const legR = new THREE.Mesh(legGeo, mainMat);
        legR.position.set(-0.2, 0.6, 0);
        characterGroup.add(legR);

        scene.add(characterGroup);
    }

    function updateRig() {
        if(!jawPart) return;
        
        // Манипуляция ртом
        jawPart.rotation.x = rigState.mouthOpen * 0.6;
        jawPart.position.y = (-0.15) - (rigState.mouthOpen * 0.1);
        
        // Манипуляция руками
        if(armL && armR) {
            armL.rotation.z = -rigState.armLift;
            armR.rotation.z = rigState.armLift;
        }

        // Манипуляция головой
        if(headPart) {
            headPart.rotation.y = rigState.headTurn;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    // Ресайз окна
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
<script src="auto-menu.js"></script></body>
</html>
