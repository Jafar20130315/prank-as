<script>
    const toggleBtn = document.getElementById('toggleButton');
// Убираем косую черту в начале, если файл лежит в той же папке
const track = new Audio('six-seven-funk.mp3'); 

toggleBtn.addEventListener('click', (e) => {
  e.preventDefault(); // ВАЖНО: это остановит перезагрузку страницы

  if (track.paused) {
    track.play().catch(error => {
        console.error("xato", error);
        alert("SIX-SEVEN");
    });
    toggleBtn.textContent = 'SIX-SEVEN';
  } else {
    track.pause();
    toggleBtn.textContent = 'Tekshirish';
  }
});
</script>
