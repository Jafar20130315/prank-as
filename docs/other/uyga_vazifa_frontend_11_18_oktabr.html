<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            border: none;
            border-radius: 10px;
        }

        button:active {
            animation: animation-for-buttons 250ms;
        }

        #change-color-red {
            background-color: red;
            color: white;
        }

        #change-color-green {
            background-color: rgb(115, 255, 0);
            color: rgb(36, 35, 35);
        }

        #change-color-blue {
            background-color: rgb(0, 132, 255);
            color: white;
        }

        @keyframes animation-for-buttons {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.8);
            }

            100% {
                transform: scale(1);
            }
        }

        #change-size-bigger {
            background-color: rgb(151, 151, 151);
            color: white;
        }

        #change-size-smaller {
            background-color: rgb(151, 151, 151);
            color: white;
        }

        .all_buttons {
            user-select: none;
        }
    </style>
</head>
