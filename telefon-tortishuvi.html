<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telefon tortishishi 🌐</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1222;color:white;text-align:center;overflow:hidden;}
h1{margin:12px 0 2px;font-size:20px;} p{margin:0;opacity:0.85;}
#area{position:relative;width:100%;height:80vh;margin-top:16px;overflow:hidden;}
.phone{position:absolute;width:56px;height:56px;background:white;border-radius:50%;color:black;font-weight:700;line-height:56px;text-align:center;font-size:20px;z-index:4;box-shadow:0 10px 25px rgba(0,0,0,0.6);}
#line{position:absolute;width:2px;height:2px;background:linear-gradient(90deg,#00f,#f0f);z-index:2;transform-origin:top left;border-radius:2px;filter:drop-shadow(0 6px 18px rgba(0,0,0,0.5));}
#infoBtn{position:fixed;right:18px;top:18px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);color:white;font-weight:700;font-size:18px;z-index:20;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:transform .12s ease;}
#infoBtn:active{transform:scale(.98);}
#infoPanel{position:fixed;right:72px;top:18px;min-width:220px;max-width:360px;background:rgba(255,255,255,0.06);color:white;padding:12px 14px;border-radius:10px;z-index:19;transform-origin:left center;transform:scaleX(0);opacity:0;transition:transform 260ms cubic-bezier(.2,.9,.2,1),opacity 200ms ease;box-shadow:0 12px 30px rgba(0,0,0,0.5);backdrop-filter:blur(6px);pointer-events:none;}
#infoPanel.open{transform:scaleX(1);opacity:1;pointer-events:auto;}
#infoText{font-size:14px;line-height:1.35;text-align:left;}
@media(max-width:520px){#infoPanel{right:64px;min-width:180px;padding:10px;}.phone{width:44px;height:44px;line-height:44px;font-size:16px;}}
</style>
</head>
<body>
<h1>📱 Telefonlar orasidagi tortishish</h1>
<p>Joylashuvga ruxsat ber!</p>

<div id="area">
  <div id="phone1" class="phone">1</div>
  <div id="phone2" class="phone">2</div>
  <div id="line"></div>
</div>

<button id="infoBtn" aria-label="info">I</button>
<div id="infoPanel" role="status" aria-live="polite">
  <div id="infoText"></div>
</div>

<script>
const phone1=document.getElementById("phone1");
const phone2=document.getElementById("phone2");
const line=document.getElementById("line");
const infoBtn=document.getElementById('infoBtn');
const infoPanel=document.getElementById('infoPanel');
const infoText=document.getElementById('infoText');

let pos1={lat:0,lon:0}, pos2={lat:0,lon:0}, infoTimer=null;

// Foydalanuvchidan 1 yoki 2 so‘rash
let phoneId;
while(true){
  let p=prompt("Bu telefon 1-chi yoki 2-chi? (faqat raqam yozing)");
  if(p==='1'||p==='2'){ phoneId=p; break; }
  alert("Faqat 1 yoki 2 yozing!");
}

function distance(lat1,lon1,lat2,lon2){
  const R=6371e3, φ1=lat1*Math.PI/180, φ2=lat2*Math.PI/180, Δφ=(lat2-lat1)*Math.PI/180, Δλ=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(Δφ/2)**2+Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function updatePositions(){
  const latSet=pos1.lat && pos2.lat;
  if(!latSet){ phone1.style.left="20%"; phone1.style.top="40%"; phone2.style.left="70%"; phone2.style.top="40%"; line.style.width="0px"; return; }

  const dist=distance(pos1.lat,pos1.lon,pos2.lat,pos2.lon);
  const maxDist=500;
  const strength=Math.max(0,1-dist/maxDist);

  const vw=Math.max(document.documentElement.clientWidth||0,window.innerWidth||0);
  const vh=Math.max(document.documentElement.clientHeight||0,window.innerHeight||0)-120;
  const baseLeft=0.18*vw, baseRight=0.72*vw, shift=strength*0.18*vw;
  const x1=baseLeft+shift, y1=vh*0.45, x2=baseRight-shift, y2=vh*0.45;

  phone1.style.left=`${x1}px`; phone1.style.top=`${y1}px`;
  phone2.style.left=`${x2}px`; phone2.style.top=`${y2}px`;

  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  line.style.left=`${x1+28}px`; line.style.top=`${y1+28}px`; line.style.width=`${len}px`; line.style.height="6px";
  line.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;
  const hueA=Math.round(10+(1-strength)*200), hueB=Math.round(200-(1-strength)*150);
  line.style.background=`linear-gradient(90deg,hsl(${hueA} 90% 55%),hsl(${hueB} 90% 55%))`;
}

function showInfo(text){
  clearTimeout(infoTimer);
  infoText.textContent=text;
  infoPanel.classList.add('open');
  infoTimer=setTimeout(()=>{infoPanel.classList.remove('open');},2000);
}

infoBtn.addEventListener('click',()=>{ showInfo("Joylashuvga ruxsat bering va telefonni 1 yoki 2 deb belgilang."); });

function startGPS(){
  if(!navigator.geolocation){ showInfo("Geolocation qo'llab-quvvatlanmaydi!"); return; }
  showInfo("Joylashuvga ruxsat bering — sahifa real vaqtda yangilanadi.");
  navigator.geolocation.watchPosition(pos=>{
    const lat=pos.coords.latitude, lon=pos.coords.longitude;
    if(phoneId==="1") pos1={lat,lon}; else pos2={lat,lon};
    updatePositions();
    showInfo("Joylashuv o‘lchandi ✔");
  }, err=>{ console.warn(err); showInfo("Joylashuvni yoq! (brauzer ruxsatini tasdiqlang)"); }, {enableHighAccuracy:true,maximumAge:3000,timeout:7000});
}

window.addEventListener('load',()=>{ updatePositions(); startGPS(); });
</script>
</body>
</html>
