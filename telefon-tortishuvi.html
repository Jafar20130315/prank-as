<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telefon Tortishishi 🌐</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1222;color:white;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;}
#area{position:relative;width:100%;height:100%;}
.phone{
  position:absolute;width:60px;height:60px;border-radius:50%;background:#fff;display:flex;justify-content:center;align-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,0.5);cursor:pointer;transition:transform 0.3s;
}
.arrow{
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
  border-bottom:20px solid #ffcc00;position:absolute;top:50%;left:50%;transform-origin:50% 80%;
}
#line{position:absolute;width:2px;height:2px;background:linear-gradient(90deg,#00f,#f0f);z-index:1;transform-origin:top left;border-radius:2px;filter:drop-shadow(0 6px 18px rgba(0,0,0,0.5));pointer-events:none;}
#info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:8px;}
</style>
</head>
<body>
<div id="area">
  <div id="phone1" class="phone"><div class="arrow"></div></div>
  <div id="phone2" class="phone"><div class="arrow"></div></div>
  <div id="line"></div>
</div>
<div id="info">Telefoningizni tanlang (1 yoki 2)</div>

<script>
const phone1 = document.getElementById("phone1");
const phone2 = document.getElementById("phone2");
const arrow1 = phone1.querySelector(".arrow");
const arrow2 = phone2.querySelector(".arrow");
const line = document.getElementById("line");
const info = document.getElementById("info");

let pos1 = {lat:null, lon:null};
let pos2 = {lat:null, lon:null};
let phoneId = null;

// Telefon raqamini so‘rash
(function askPhoneId(){
  for(;;){
    const p = prompt("Bu telefon 1-chi yoki 2-chi? (faqat raqam yozing)");
    if(p===null){ alert("Sahifa ishlashi uchun 1 yoki 2 belgilash kerak."); return; }
    const trimmed = String(p).trim();
    if(trimmed==='1' || trimmed==='2'){ phoneId=trimmed; break; }
    alert("Faqat 1 yoki 2 yozing!");
  }
})();

function distance(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const φ1 = lat1*Math.PI/180;
  const φ2 = lat2*Math.PI/180;
  const Δφ = (lat2-lat1)*Math.PI/180;
  const Δλ = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updatePositions(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  if(pos1.lat===null || pos2.lat===null){
    phone1.style.left = `${vw*0.25}px`; phone1.style.top = `${vh*0.5}px`;
    phone2.style.left = `${vw*0.75}px`; phone2.style.top = `${vh*0.5}px`;
    line.style.width = "0px";
    return;
  }

  const x1 = vw*0.25, y1 = vh*0.5;
  const x2 = vw*0.75, y2 = vh*0.5;
  phone1.style.left = `${x1}px`; phone1.style.top = `${y1}px`;
  phone2.style.left = `${x2}px`; phone2.style.top = `${y2}px`;

  // chiziq
  const dx = x2-x1, dy = y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  line.style.left = `${x1+30}px`; line.style.top = `${y1+30}px`;
  line.style.width = `${len}px`; line.style.height="4px";
  line.style.transform = `rotate(${Math.atan2(dy,dx)}rad)`;

  // strelkalarni burish
  const angle1 = Math.atan2(y2-y1, x2-x1) * 180/Math.PI;
  const angle2 = Math.atan2(y1-y2, x1-x2) * 180/Math.PI;
  arrow1.style.transform = `translate(-50%, -50%) rotate(${angle1}deg)`;
  arrow2.style.transform = `translate(-50%, -50%) rotate(${angle2}deg)`;
}

function startGPS(){
  if(!phoneId){ info.textContent="Telefon raqami tanlanmadi"; return; }
  if(!navigator.geolocation){ info.textContent="Geolocation qo‘llab-quvvatlanmaydi!"; return; }

  info.textContent = "Joylashuvga ruxsat bering...";
  navigator.geolocation.watchPosition(pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    if(phoneId==="1"){ pos1.lat=lat; pos1.lon=lon; } 
    else { pos2.lat=lat; pos2.lon=lon; }
    updatePositions();
    info.textContent="Joylashuv o‘lchandi ✔";
  }, err=>{
    info.textContent="Joylashuvga ruxsat rad etildi yoki xato yuz berdi";
  }, {enableHighAccuracy:true, maximumAge:3000, timeout:7000});
}

window.addEventListener('load', startGPS);
window.addEventListener('resize', updatePositions);
</script>
</body>
</html>
