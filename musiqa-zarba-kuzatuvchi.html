<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <title>Musiqa pleyeri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            transition: opacity 0.5s ease;
            backdrop-filter: blur(5px);
        }

        #ui-layer.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            background: linear-gradient(90deg, #00f260, #0575e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(5, 117, 230, 0.5);
            text-align: center;
        }

        p {
            margin-bottom: 2rem;
            color: #aaa;
            max-width: 600px;
            text-align: center;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1rem;
            border: 2px solid #0575e6;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .btn:hover {
            background: #0575e6;
            box-shadow: 0 0 20px #0575e6;
            transform: translateY(-2px);
        }

        .btn-secondary {
            border-color: #00f260;
        }

        .btn-secondary:hover {
            background: #00f260;
            box-shadow: 0 0 20px #00f260;
        }

        #file-input {
            display: none;
        }

        #track-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 5;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            pointer-events: none;
        }
        
        #overlay-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: none; /* Shown via JS */
        }

        .icon-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.3); }

    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="visualizer"></canvas>
    </div>

    <div id="ui-layer">
        <h1>Musiqadagi zarbani kuzatish</h1>
        <p>Reaktiv audio vizualizatsiya tizimi. Zarrachalar chastota o'tishlariga (beatlar'ga) javob beradi. Boshlash uchun audio faylni yuklang yoki mikrofondan foydalaning.</p>
        
        <div class="controls">
            <button class="btn" onclick="document.getElementById('file-input').click()">Audio fayl yuklash</button>
            <button class="btn btn-secondary" id="mic-btn">Mikrofonni ishlatish</button>
        </div>
        <input type="file" id="file-input" accept="audio/*">
    </div>

    <div id="overlay-controls">
        <button class="icon-btn" id="reset-btn" title="Change Source">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/></svg>
        </button>
    </div>

      <div id="track-info">Musiqa kiritilishi kutilmoqda...</div>

    <script>
        // --- Configuration ---
        const CONFIG = {
            fftSize: 2048,
            smoothing: 0.8,
            beatHoldTime: 15, // Frames to wait before detecting next beat (debounce)
            beatDecay: 0.95,  // How fast the beat threshold decays
            beatMinVol: 140,   // Minimum volume to trigger a beat (0-255)
            particleCount: 150,
            colorPalette: [
                '#00f260', '#0575e6', '#ff0055', '#ffff00', '#00ffff'
            ]
        };

        // --- Global Variables ---
        let audioCtx, analyser, source;
        let canvas, ctx;
        let width, height;
        let dataArray, bufferLength;
        let animationId;
        let particles = [];
        let beatCutoff = CONFIG.beatMinVol;
        let beatTimer = 0;
        let isBeat = false;
        let bassVolume = 0;
        let audioEl; // For file playback
        let stream; // For mic stream

        // --- Initialization ---
        window.addEventListener('load', () => {
            canvas = document.getElementById('visualizer');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Button Listeners
            document.getElementById('file-input').addEventListener('change', handleFileUpload);
            document.getElementById('mic-btn').addEventListener('click', handleMicrophone);
            document.getElementById('reset-btn').addEventListener('click', resetApp);
            
            // Start default animation loop (idle state)
            idleAnimation();
        });

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function setupAnalyser() {
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = CONFIG.fftSize;
            analyser.smoothingTimeConstant = CONFIG.smoothing;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
        }

        // --- Input Handlers ---

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            initAudioContext();
            stopAudio(); // Stop any existing audio

            audioEl = new Audio();
            audioEl.src = URL.createObjectURL(file);
            audioEl.crossOrigin = "anonymous";
            
            setupAnalyser();
            
            source = audioCtx.createMediaElementSource(audioEl);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            audioEl.play();
            startVisualizer();
            
            document.getElementById('track-info').textContent = `Ijro etilmoqda:${file.name}`;
            hideUI();
        }

        async function handleMicrophone() {
            try {
                initAudioContext();
                stopAudio();

                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                setupAnalyser();

                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                // Note: Don't connect mic to destination (speakers) to avoid feedback loop

                startVisualizer();
                document.getElementById('track-info').textContent = "Moslama: Mikrofon";
                hideUI();
            } catch (err) {
                console.error("Mic Error:", err);
                alert("Mikrofonga ruxsat bering.");
            }
        }

        function stopAudio() {
            if (audioEl) {
                audioEl.pause();
                audioEl.src = '';
                audioEl = null;
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (source) {
                source.disconnect();
                source = null;
            }
            cancelAnimationFrame(animationId);
        }

        function resetApp() {
            stopAudio();
            document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('overlay-controls').style.display = 'none';
            document.getElementById('track-info').textContent = "Musiqa kiritilishi kutilmoqda...";
            particles = [];
            idleAnimation();
        }

        function hideUI() {
            document.getElementById('ui-layer').classList.add('hidden');
            document.getElementById('overlay-controls').style.display = 'block';
        }

        // --- Core Visualizer Logic ---

        function startVisualizer() {
            // Initialize some particles
            createParticles(CONFIG.particleCount);
            renderFrame();
        }

        function detectBeat(lowFreqData) {
            // Calculate average volume of the bass range (approx 0-100Hz)
            // Bin size = 44100 / 2048 = ~21.5 Hz. So first 5-8 bins are sub-bass/bass.
            let sum = 0;
            let range = 10; 
            for (let i = 0; i < range; i++) {
                sum += lowFreqData[i];
            }
            let average = sum / range;
            bassVolume = average; // Global for visualization usage

            // Beat detection logic
            // If current bass average is higher than the threshold AND we waited enough frames
            if (average > beatCutoff && average > CONFIG.beatMinVol) {
                if (beatTimer <= 0) {
                    isBeat = true;
                    beatTimer = CONFIG.beatHoldTime;
                    beatCutoff = average * 1.1; // Jump the threshold up
                } else {
                    isBeat = false;
                }
            } else {
                isBeat = false;
                if (beatTimer <= 0) {
                    beatCutoff *= CONFIG.beatDecay; // Slowly lower threshold
                    if (beatCutoff < CONFIG.beatMinVol) beatCutoff = CONFIG.beatMinVol;
                }
            }
            
            if (beatTimer > 0) beatTimer--;
        }

        function createParticles(count, x, y, burst = false) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, burst));
            }
            // Limit particle count to prevent lag
            if (particles.length > 500) {
                particles.splice(0, particles.length - 500);
            }
        }

        class Particle {
            constructor(x, y, burst) {
                this.x = x || width / 2;
                this.y = y || height / 2;
                
                // If burst (beat), much faster velocity
                const speed = burst ? Math.random() * 15 + 5 : Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.size = Math.random() * 5 + 1;
                this.color = CONFIG.colorPalette[Math.floor(Math.random() * CONFIG.colorPalette.length)];
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
                this.history = []; // For trail effect
            }

            update(bassIntensity) {
                // Movement
                this.x += this.vx;
                this.y += this.vy;
                
                // Friction
                this.vx *= 0.95;
                this.vy *= 0.95;

                // React to bass: push away from center
                if (bassIntensity > 200) {
                     const dx = this.x - width/2;
                     const dy = this.y - height/2;
                     const dist = Math.sqrt(dx*dx + dy*dy);
                     if (dist > 0) {
                         this.vx += (dx / dist) * 0.5;
                         this.vy += (dy / dist) * 0.5;
                     }
                }

                // Life decay
                this.life -= this.decay;
                
                // Trail history
                this.history.push({x: this.x, y: this.y});
                if (this.history.length > 5) this.history.shift();
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                
                // Draw Head
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Draw Trail
                if (this.history.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.history[0].x, this.history[0].y);
                    for (let i = 1; i < this.history.length; i++) {
                        ctx.lineTo(this.history[i].x, this.history[i].y);
                    }
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size / 2;
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
            }
        }

        function renderFrame() {
            animationId = requestAnimationFrame(renderFrame);

            analyser.getByteFrequencyData(dataArray);
            detectBeat(dataArray);

            // Background clearing with fade effect for trails
            // On powerful beats, flash the background slightly
            if (isBeat) {
                 ctx.fillStyle = `rgba(20, 20, 25, 0.4)`;
            } else {
                 ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            }
            ctx.fillRect(0, 0, width, height);

            // Center Circle Visual
            const centerX = width / 2;
            const centerY = height / 2;
            
            // Draw Center Bass Circle
            // Size depends on bass volume
            const radius = bassVolume * 0.8 + 20;
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = isBeat ? '#fff' : '#222';
            ctx.fill();
            ctx.strokeStyle = isBeat ? CONFIG.colorPalette[0] : '#333';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Additional outer rings based on higher frequencies
            // Mid-range ring
            let midVol = dataArray[100]; // approximate mid freq
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + midVol * 0.5 + 10, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(5, 117, 230, ${midVol/255})`;
            ctx.lineWidth = 2;
            ctx.stroke();


            // Spawn particles on beat
            if (isBeat) {
                // Shake screen effect
                if (bassVolume > 200) {
                    const shakeX = (Math.random() - 0.5) * 10;
                    const shakeY = (Math.random() - 0.5) * 10;
                    ctx.save();
                    ctx.translate(shakeX, shakeY);
                }
                
                createParticles(20, centerX, centerY, true);
            }

            // Update and Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(bassVolume);
                p.draw(ctx);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Draw Frequency Bars (Optional overlay)
            drawFrequencyBars();

            if (isBeat && bassVolume > 200) {
                ctx.restore(); // Restore from screen shake
            }
        }

        function drawFrequencyBars() {
            const barWidth = (width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 2; // Scale down
                
                // Color based on frequency
                const r = barHeight + (25 * (i/bufferLength));
                const g = 250 * (i/bufferLength);
                const b = 50;

                ctx.fillStyle = `rgba(${r},${g},${b}, 0.5)`;
                
                // Draw mirrored bars at bottom
                ctx.fillRect(x, height - barHeight, barWidth, barHeight);
                
                x += barWidth + 1;
                
                // Only draw a portion of the spectrum to save performance/visual clutter
                if(x > width) break;
            }
        }

        function idleAnimation() {
            if (source) return; // Stop if audio plays

            animationId = requestAnimationFrame(idleAnimation);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            if (Math.random() < 0.05) {
                createParticles(1, Math.random() * width, Math.random() * height);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(0);
                p.draw(ctx);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

    </script>
<script src="/auto-menu.js"></script><script src="auto-menu.js"></script><script src="/new-domain-banner.js"></script>
</body>
</html>
