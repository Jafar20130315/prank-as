<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prank-as</title>
  <meta name="description" content="Do'stlaringiz bilan soxta hacker buyumlari orqali xazillashing, va o'zingizga boshqa foydali narsalar toping!">
  <link rel="icon" type="image/x-icon" href="favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />

  <style>
    @keyframes gradientBG {0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    *{margin:0;padding:0;box-sizing:border-box}
    body {
      font-family:'Poppins',sans-serif;line-height:1.6;color:#fff;
      background:linear-gradient(270deg,#1f1f1f,#111,#222,#333);
      background-size:800% 800%;animation:gradientBG 20s ease infinite;
      min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
    }
    h1{text-align:center;margin-bottom:40px;text-shadow:0 0 10px rgba(255,255,255,0.2)}
    .button-container{display:grid;gap:15px;width:100%;max-width:800px;margin-bottom:100px}
    @media(min-width:768px){.button-container{grid-template-columns:repeat(2,1fr)}}
    @media(min-width:1200px){.button-container{grid-template-columns:repeat(3,1fr)}}
    .btn{
      display:block;padding:16px 20px;background:rgba(255,255,255,0.1);
      border:2px solid rgba(255,255,255,0.5);border-radius:8px;color:#fff;
      text-decoration:none;font-weight:600;box-shadow:0 4px 6px rgba(0,0,0,0.3);
      transition:all 0.3s;opacity:0;transform:translateY(20px);animation:fadeInUp 0.6s forwards;
    }
    .btn:hover{background:rgba(255,255,255,0.95);color:#111;transform:scale(1.05)}
    @keyframes fadeInUp{to{opacity:1;transform:translateY(0)}}

    /* CAPTCHA overlay */
    #captchaOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    #captchaForm {
      background: #fff;
      color: #111;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 350px;
    }
    #captchaForm h2 {
      margin-bottom: 15px;
    }
    #captchaForm button {
      margin-top: 20px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    #captchaForm button:hover {
      background: #333;
      transform: scale(1.05);
    }
  </style>

  <!-- Cloudflare Turnstile skripti -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

  <!-- CAPTCHA overlay -->
  <div id="captchaOverlay">
    <form id="captchaForm" method="POST">
      <h2>Xavfsizlik tekshiruvi</h2>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAB7m2CdiY7Mt3d_L"></div>
      <button type="submit">Tasdiqlash</button>
    </form>
  </div>

  <h1>Prank_as orqali do‘stlaringiz bilan hazillashing!</h1>

  <div class="button-container">
    <a class="btn" href="/soxta-ulanish-sistemasi">Soxta ulanish sistemasi</a>
    <a class="btn" href="/soxta-uyin-bank-kartasi">Soxta o‘yin bank kartasi</a>
    <a class="btn" href="/soxta-wifi-parol-aniqlovchi">Soxta Wi-Fi parol aniqlovchi</a>
    <a class="btn" href="/soxta-joylashuv-aniqlovchi">Soxta joylashuv aniqlovchi</a>
    <a class="btn" href="/soxta-random-yashash-joyi">Soxta random yashash joyi</a>
    <a class="btn" href="/soxta-shaxs-aniqlovchi">Soxta shaxs aniqlovchi</a>
  </div>

  <script>
    // CAPTCHA formasi yuborilgach, overlay yopiladi
    const form = document.getElementById('captchaForm');
    form.addEventListener('submit', e => {
      e.preventDefault();
      document.getElementById('captchaOverlay').style.display = 'none';
    });

    // Tugmalar chiqish animatsiyasi
    document.querySelectorAll('.button-container a').forEach((btn, i) => {
      btn.style.animationDelay = `${i * 0.2}s`;
    });
  </script>
</body>
</html>
