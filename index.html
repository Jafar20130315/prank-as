<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prank-as</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #222;
      color: white;
      padding: 10px 20px;
    }
    .menu-btn {
      font-size: 24px;
      cursor: pointer;
    }
    nav {
      display: none;
      background: #333;
    }
    nav a {
      display: block;
      padding: 10px;
      color: white;
      text-decoration: none;
    }
    nav a:hover {
      background: #444;
    }
    .show {
      display: block;
    }
    /* Banner (xabarlar) */
    #banner {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      display: none;
      z-index: 999;
      animation: fadein 0.3s ease;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .install-btn {
      background: #00aaff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
    }
    .disclaimer {
      background: #fff3cd;
      border-left: 6px solid #ffcc00;
      padding: 15px;
      margin: 20px;
      border-radius: 8px;
      color: #856404;
    }
  </style>
</head>
<body>

<header>
  <div class="menu-btn">☰</div>
  <h1>Prank-as</h1>
  <button class="install-btn">📱 Ilovani o‘rnatish</button>
</header>

<nav id="menu">
  <a href="#">Bosh sahifa</a>
  <a href="#">Yangiliklar</a>
  <a href="#">Aloqa</a>
</nav>

<div class="disclaimer">
  ⚠️ <b>Disclaimer:</b> Ushbu sayt test rejimida ishlamoqda. Ba’zi funksiyalar (masalan, ilova o‘rnatish yoki oflayn ishlash) barcha brauzerlarda ko‘rinmasligi mumkin.
</div>

<div id="banner"></div>

<script>
  const menuBtn = document.querySelector('.menu-btn');
  const menu = document.getElementById('menu');
  const banner = document.getElementById('banner');
  let deferredPrompt;

  menuBtn.addEventListener('click', () => {
    menu.classList.toggle('show');
  });

  // Banner funksiyasi (xabar ko‘rsatish)
  function showBanner(msg, color = "#333") {
    banner.textContent = msg;
    banner.style.background = color;
    banner.style.display = "block";
    setTimeout(() => {
      banner.style.display = "none";
    }, 3000);
  }

  // PWA install tugmasi
  const installBtn = document.querySelector('.install-btn');
  installBtn.style.display = "none";

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "inline-block";
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === "accepted") {
        showBanner("✅ Ilova o‘rnatildi!", "green");
      } else {
        showBanner("ℹ️ O‘rnatish bekor qilindi", "#ff9800");
      }
      deferredPrompt = null;
    } else {
      showBanner("⚠️ Ilovani o‘rnatish hozircha mavjud emas", "#ff0000");
    }
  });
</script>

</body>
</html>
