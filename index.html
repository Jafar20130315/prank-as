<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Kirish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google reCAPTCHA API -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center text-white p-4"
      style="background: radial-gradient(circle at center, #1e293b 0%, #020617 100%)">

<div class="rounded-3xl p-8 w-full max-w-md text-center shadow-2xl animate-fade"
     style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1)">

  <h1 class="text-4xl font-black mb-2 tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-500">
    Prank-as
  </h1>
  <p class="text-slate-400 mb-8 text-sm font-medium">Xavfsiz avtorizatsiya tizimi</p>

  <!-- CAPTCHA BOX -->
  <div id="captchaBox" class="flex flex-col items-center mb-8">
    <!-- ВАЖНО: Замените data-sitekey на ваш реальный ключ -->
    <div class="g-recaptcha" 
         data-sitekey="6LeOGjssAAAAAHnJBytIycrKEvDJHjMIcnjF7XN2" 
         data-theme="dark" 
         data-callback="onCaptchaSuccess"></div>
    <p class="text-slate-500 text-[10px] mt-3 uppercase tracking-widest">Davom etish uchun tasdiqlang</p>
  </div>

  <!-- LOGIN BUTTONS -->
  <div id="loginBox" class="space-y-4 opacity-20 pointer-events-none transition-all duration-700 scale-95">
    <button id="google-login"
            class="w-full py-4 rounded-2xl font-bold bg-white text-black hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-3 shadow-lg">
      <img src="https://www.google.com/favicon.ico" class="w-5 h-5" alt="G"> 
      Google bilan kirish
    </button>

    <button id="telegram-login"
            class="w-full py-4 rounded-2xl font-bold text-white hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-3 shadow-lg"
            style="background: linear-gradient(135deg, #37aee2 0%, #1e96c8 100%)">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
      Telegram bilan kirish
    </button>
  </div>

  <!-- ACCOUNT ACTIONS -->
  <div id="accountBox" class="hidden space-y-4 mt-6 border-t border-white/10 pt-8 animate-fade">
    <div class="flex items-center justify-center mb-4">
        <div id="userPreview" class="w-16 h-16 rounded-full border-2 border-blue-500 p-1">
            <div class="w-full h-full rounded-full bg-slate-800 flex items-center justify-center overflow-hidden">
                <span class="text-2xl">👤</span>
            </div>
        </div>
    </div>
    
    <button id="logout"
            class="w-full py-3.5 rounded-2xl font-bold bg-red-500/10 text-red-500 border border-red-500/20 hover:bg-red-500 hover:text-white transition-all">
      Chiqish
    </button>

    <button id="deleteAccount"
            class="w-full py-2 text-slate-500 text-xs font-medium hover:text-slate-300 transition-colors">
      Hisobni butunlay o'chirish
    </button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const supabase = createClient(
    "https://gefaqrfjzwemwuxuoadp.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg"
  )

  const loginBox = document.getElementById("loginBox");
  const accountBox = document.getElementById("accountBox");
  const captchaBox = document.getElementById("captchaBox");
  const userPreview = document.getElementById("userPreview");

  // RECAPTCHA SUCCESS
  window.onCaptchaSuccess = function(token) {
    if(token) {
      loginBox.classList.remove("opacity-20", "pointer-events-none", "scale-95");
      captchaBox.classList.add("hidden");
    }
  }

  // GOOGLE LOGIN
  document.getElementById("google-login").onclick = async () => {
    await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: "https://prank-as.site" }
    });
  }

  // TELEGRAM LOGIN
  window.onTelegramAuth = async function(user) {
    // Сохраняем данные пользователя
    localStorage.setItem("tg_user", JSON.stringify(user));
    
    // ВАЖНО: Сохраняем фото, чтобы оно отображалось на главной странице вместо смайлика
    if (user.photo_url) {
        localStorage.setItem("tg_avatar", user.photo_url);
    }

    try {
        await fetch("https://prankasapi.windowsnoutbook.workers.dev/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(user)
        });
    } finally {
        // Редирект на главную
        window.location.href = "https://prank-as.site";
    }
  }

  document.getElementById("telegram-login").onclick = () => {
    const s = document.createElement("script");
    s.src = "https://telegram.org/js/telegram-widget.js?22";
    s.setAttribute("data-telegram-login", "prank_as_bot");
    s.setAttribute("data-size", "large");
    s.setAttribute("data-onauth", "onTelegramAuth(user)");
    s.setAttribute("data-request-access", "write");
    document.body.appendChild(s);
  }

  // LOGOUT
  document.getElementById("logout").onclick = async () => {
    await supabase.auth.signOut();
    localStorage.removeItem("tg_user");
    localStorage.removeItem("tg_avatar");
    window.location.reload();
  }

  // INITIAL STATE
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    const tgUser = localStorage.getItem("tg_user");

    if (session || tgUser) {
      loginBox.classList.add("hidden");
      captchaBox.classList.add("hidden");
      accountBox.classList.remove("hidden");

      // Показ аватарки в предпросмотре (если есть)
      const avatarUrl = session?.user?.user_metadata?.picture || localStorage.getItem("tg_avatar");
      if (avatarUrl) {
        userPreview.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full">`;
      }
    }
  })();
</script>
</body>
</html>
