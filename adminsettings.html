<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white p-6">

  <h1 class="text-3xl font-bold mb-6">Admin statistika</h1>

  <table class="w-full border border-white/10 text-sm">
    <thead class="bg-white/10">
      <tr>
        <th class="p-2 text-left">User ID</th>
        <th class="p-2 text-left">Prank</th>
        <th class="p-2 text-left">Vaqt</th>
        <th class="p-2 text-left">Davomiylik (sec)</th>
      </tr>
    </thead>
    <tbody id="stats"></tbody>
  </table>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://GEFAQRFJZWEMWUXUOADP.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'

    const ADMIN_ID = 'f5c0015c-51ef-4f5a-a989-afa85250f012' // supabase.auth.getUser() orqali olingan admin id

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const tbody = document.getElementById('stats')

    const checkAdminAndLoad = async () => {
      const { data: { user }, error: userError } = await supabase.auth.getUser()
      if (userError || !user || user.id !== ADMIN_ID) {
        location.href = '/'  // Admin emas → bosh sahifaga
        return
      }

      const { data, error } = await supabase
        .from('user_activity')
        .select('*')
        .order('opened_at', { ascending: false }) // oldin created_at edi, endi opened_at

      if (error) {
        alert(error.message)
        return
      }

      tbody.innerHTML = '' // eski satrlarni tozalash

      data.forEach(row => {
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td class="p-2 border-t border-white/10">${row.user_id}</td>
          <td class="p-2 border-t border-white/10">${row.prank_name}</td>
          <td class="p-2 border-t border-white/10">${new Date(row.opened_at).toLocaleString()}</td>
          <td class="p-2 border-t border-white/10">${row.duration || '-'}</td>
        `
        tbody.appendChild(tr)
      })
    }

    checkAdminAndLoad()
  </script>

</body>
</html>
