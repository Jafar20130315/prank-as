<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white p-6">
<div class="max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">📊 Admin Panel</h1>
    <button onclick="loadUsers()"
      class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded">
      Refresh
    </button>
  </div>

  <div class="overflow-x-auto rounded-lg border border-white/10">
    <table class="w-full text-sm">
      <thead class="bg-white/10 text-xs uppercase text-gray-300">
        <tr>
          <th class="p-3">ID</th>
          <th class="p-3">Email</th>
          <th class="p-3">Phone</th>
          <th class="p-3">Confirmed</th>
          <th class="p-3">Created At</th>
        </tr>
      </thead>
      <tbody id="userTable" class="divide-y divide-white/10">
        <tr>
          <td colspan="5" class="p-4 text-center text-gray-400">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const FUNCTION_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co/functions/v1/track-activity'; // Replace with your Edge Function URL
const userTable = document.getElementById('userTable');

async function loadUsers() {
  userTable.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Loading...</td></tr>`;
  try {
    const res = await fetch(FUNCTION_URL);
    const json = await res.json();
    
    if (json.error) {
      userTable.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">${json.error}</td></tr>`;
      return;
    }
    
    const users = json.data;
    if (!users || users.length === 0) {
      userTable.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No users found</td></tr>`;
      return;
    }
    
    userTable.innerHTML = users.map(u => `
      <tr class="hover:bg-white/5">
        <td class="p-3">${u.id}</td>
        <td class="p-3">${u.email || '-'}</td>
        <td class="p-3">${u.phone || '-'}</td>
        <td class="p-3">${u.confirmed_at ? 'Yes' : 'No'}</td>
        <td class="p-3">${new Date(u.created_at).toLocaleString()}</td>
      </tr>
    `).join('');
    
  } catch (err) {
    userTable.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">${err.message}</td></tr>`;
  }
}

// Load users immediately
loadUsers();
</script>
</body>
</html>
