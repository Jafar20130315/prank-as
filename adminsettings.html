<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Активность</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-900 text-white p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span>📊</span> Admin Panel - Активность
            </h1>
            <div class="flex gap-2">
                <button id="loadActivityBtn" onclick="loadActivity()"
                    class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed px-4 py-2 rounded-lg transition font-medium" 
                    disabled>
                    Обновить данные
                </button>
                <button onclick="handleLogout()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition text-sm">
                    Выйти
                </button>
            </div>
        </div>

        <!-- Отладка -->
        <div class="mb-6 p-4 bg-gray-800/50 border border-white/5 rounded-xl text-xs font-mono">
            <div class="text-gray-400 uppercase tracking-wider mb-2 font-bold">Статус системы:</div>
            <div id="debugInfo" class="space-y-1">Инициализация...</div>
        </div>

        <!-- Таблица -->
        <div class="bg-gray-800/30 rounded-2xl border border-white/10 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-white/5 text-gray-400 uppercase text-[10px] tracking-widest">
                        <tr>
                            <th class="p-4">Пользователь</th>
                            <th class="p-4">Розыгрыш</th>
                            <th class="p-4">Дата</th>
                            <th class="p-4">Время (сек)</th>
                            <th class="p-4">Локация</th>
                            <th class="p-4">IP</th>
                        </tr>
                    </thead>
                    <tbody id="activityTable" class="divide-y divide-white/5">
                        <tr>
                            <td colspan="6" class="p-12 text-center text-gray-500 italic">
                                Ожидание авторизации...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // КОНФИГУРАЦИЯ
        const SUPABASE_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg';
        const ADMIN_UID = 'c11bed70-f718-47dd-85ae-4764717a566c';
        const FUNCTION_URL = `https://gefaqrfjzwemwuxuoadp.supabase.co/functions/v1/track-activity`;

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const debugEl = document.getElementById('debugInfo');
        const tableEl = document.getElementById('activityTable');
        const btnEl = document.getElementById('loadActivityBtn');

        function updateDebug(msg, color = 'text-gray-400') {
            const time = new Date().toLocaleTimeString();
            debugEl.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
            console.log(`[Admin] ${msg}`);
        }

        async function checkAuth() {
            updateDebug('Проверка сессии...');
            const { data: { session }, error } = await supabase.auth.getSession();

            if (error || !session) {
                updateDebug('Сессия не найдена. Редирект на /auth...', 'text-yellow-500');
                tableEl.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-yellow-500">Авторизуйтесь для доступа</td></tr>`;
                setTimeout(() => window.location.href = '/auth', 2000);
                return;
            }

            const user = session.user;
            updateDebug(`Вошел как: ${user.email}`);

            if (user.id !== ADMIN_UID) {
                updateDebug('ОШИБКА: Нет прав администратора!', 'text-red-500');
                tableEl.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">Доступ запрещен (UID mismatch)</td></tr>`;
                return;
            }

            updateDebug('Доступ разрешен ✅', 'text-green-400');
            btnEl.disabled = false;
            loadActivity();
        }

        async function loadActivity() {
            tableEl.innerHTML = `<tr><td colspan="6" class="p-8 text-center"><div class="animate-pulse">Загрузка данных...</div></td></tr>`;
            
            try {
                const { data: { session } } = await supabase.auth.getSession();
                
                // Пробуем GET, но если функция требует POST, нужно изменить method
                const response = await fetch(FUNCTION_URL, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${session.access_token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error(`Ошибка: ${response.status}`);

                const result = await response.json();
                const data = Array.isArray(result) ? result : (result.data || []);

                if (data.length === 0) {
                    tableEl.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">Данные отсутствуют</td></tr>`;
                    return;
                }

                tableEl.innerHTML = data.map(item => `
                    <tr class="hover:bg-white/5 transition">
                        <td class="p-4">
                            <div class="font-medium">${item.email || 'Аноним'}</div>
                            <div class="text-[10px] text-gray-500 font-mono">${item.user_id || 'no-id'}</div>
                        </td>
                        <td class="p-4 text-blue-400">${item.prank_name || '—'}</td>
                        <td class="p-4 text-gray-400">
                            ${item.opened_at ? new Date(item.opened_at).toLocaleString('ru-RU') : '—'}
                        </td>
                        <td class="p-4 font-mono">${item.duration || 0}s</td>
                        <td class="p-4">
                            ${item.city || ''} <span class="text-gray-600">${item.country || ''}</span>
                        </td>
                        <td class="p-4 font-mono text-[10px] text-purple-400">${item.ip_address || '—'}</td>
                    </tr>
                `).join('');

                updateDebug(`Успешно загружено ${data.length} записей`, 'text-green-400');

            } catch (err) {
                updateDebug(`Ошибка загрузки: ${err.message}`, 'text-red-400');
                tableEl.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">Не удалось загрузить данные. Проверьте CORS или тип запроса в Edge Function.</td></tr>`;
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        // Инициализация при загрузке
        window.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
