<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Admin — User Activity</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white p-6">

<h1 class="text-2xl font-bold mb-4">User Activity (IP bilan)</h1>

<table class="w-full text-sm border border-white/10">
<thead class="bg-white/10">
<tr>
  <th class="p-2">User</th>
  <th class="p-2">Email</th>
  <th class="p-2">Prank</th>
  <th class="p-2">IP</th>
  <th class="p-2">Joylashuv</th>
  <th class="p-2">Vaqt</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const body = document.getElementById('body')

async function load() {
  const { data } = await supabase
    .from('user_activity')
    .select('*')
    .order('opened_at', { ascending: false })

  body.innerHTML = ''

  data.forEach(r => {
    body.innerHTML += `
    <tr class="border-t border-white/10">
      <td class="p-2">${r.user_id ? '🟢 User' : '⚪ Guest'}</td>
      <td class="p-2">${r.email ?? '-'}</td>
      <td class="p-2">${r.prank_name}</td>
      <td class="p-2">${r.ip}</td>
      <td class="p-2">${r.country}, ${r.city}</td>
      <td class="p-2">${new Date(r.opened_at).toLocaleString()}</td>
    </tr>`
  })
}

load()

supabase.channel('rt')
.on('postgres_changes',
 { event:'INSERT', schema:'public', table:'user_activity' },
 () => load()
).subscribe()
</script>

</body>
</html>
