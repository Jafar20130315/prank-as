<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Активность розыгрышей</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white p-6">
<div class="max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">📊 Admin Panel - Активность розыгрышей</h1>
    <button onclick="loadActivity()"
      class="text-sm bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded transition">
      Обновить активность
    </button>
  </div>

  <!-- Панель отладки -->
  <div class="mb-4 p-3 bg-gray-800 rounded-lg text-xs">
    <div class="font-bold mb-1">Отладочная информация:</div>
    <div id="debugInfo" class="text-gray-400">Ожидание данных...</div>
  </div>

  <!-- Таблица активности -->
  <div>
    <h2 class="text-xl font-semibold mb-4 text-green-300">📍 Активность розыгрышей</h2>
    <div class="overflow-x-auto rounded-lg border border-white/10">
      <table class="w-full text-sm">
        <thead class="bg-white/10 text-xs uppercase text-gray-300">
          <tr>
            <th class="p-3 text-left">ID</th>
            <th class="p-3 text-left">User ID</th>
            <th class="p-3 text-left">Email</th>
            <th class="p-3 text-left">Розыгрыш</th>
            <th class="p-3 text-left">Открыт</th>
            <th class="p-3 text-left">Длительность (с)</th>
            <th class="p-3 text-left">IP-адрес</th>
            <th class="p-3 text-left">Город</th>
            <th class="p-3 text-left">Страна</th>
          </tr>
        </thead>
        <tbody id="activityTable" class="divide-y divide-white/10">
          <tr>
            <td colspan="9" class="p-4 text-center text-gray-400">Загрузка активности...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ЗАМЕНИТЕ на ваш способ получения токена
async function getAuthToken() {
  // Пример: получение токена из localStorage
  // return localStorage.getItem('sb-access-token');
  // ВРЕМЕННО - ЗАМЕНИТЕ НА РЕАЛЬНЫЙ ТОКЕН АДМИНИСТРАТОРА
  return null;
}

const ACTIVITY_FUNCTION_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co/functions/v1/user-activity';

const activityTable = document.getElementById('activityTable');
const debugInfo = document.getElementById('debugInfo');

function formatDate(dateString) {
  if (!dateString) return '-';
  try {
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return '-';
    return date.toLocaleString('ru-RU', {
      year: 'numeric',
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  } catch (e) {
    console.error('Ошибка форматирования даты:', e);
    return '-';
  }
}

function safeGet(obj, path, defaultValue = '-') {
  if (!obj) return defaultValue;
  return path.split('.').reduce((acc, part) => {
    return acc && acc[part] !== undefined && acc[part] !== null ? acc[part] : defaultValue;
  }, obj);
}

async function loadActivity() {
  activityTable.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-400">Загрузка активности...</td></tr>`;
  debugInfo.textContent = 'Получение токена и загрузка активности...';

  try {
    const token = await getAuthToken();
    if (!token) {
        throw new Error('Токен аутентификации не найден. Пожалуйста, войдите как администратор.');
    }

    const res = await fetch(ACTIVITY_FUNCTION_URL, {
      method: 'GET',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
      }
    });

    if (!res.ok) {
      const errorText = await res.text();
      throw new Error(`Ошибка сервера: ${res.status} ${res.statusText}. Ответ: ${errorText}`);
    }

    const json = await res.json();
    console.log('Активность:', json);

    debugInfo.innerHTML = `<div class="max-h-40 overflow-y-auto"><strong>Полученная активность:</strong><pre class="text-xs mt-1">${JSON.stringify(json, null, 2)}</pre></div>`;

    let activities = [];
    if (json.data && Array.isArray(json.data)) {
      activities = json.data;
    } else if (Array.isArray(json)) {
      activities = json;
    }

    if (activities.length === 0) {
      activityTable.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-400">Нет данных об активности</td></tr>`;
      return;
    }

    // Создаем строки таблицы
    const rows = activities.map((activity) => {
      const id = safeGet(activity, 'id') || '-';
      const userId = safeGet(activity, 'user_id') || '-';
      const email = safeGet(activity, 'email') || '-';
      const prankName = safeGet(activity, 'prank_name') || '-';
      const openedAt = formatDate(safeGet(activity, 'opened_at'));
      const duration = safeGet(activity, 'duration') || '-';
      const ipAddress = safeGet(activity, 'ip_address') || '-';
      const city = safeGet(activity, 'city') || '-';
      const country = safeGet(activity, 'country') || '-';

      return `
      <tr class="hover:bg-white/5 transition">
        <td class="p-3 font-mono">${id}</td>
        <td class="p-3 font-mono">${userId}</td>
        <td class="p-3 break-all">${email}</td>
        <td class="p-3">${prankName}</td>
        <td class="p-3 text-blue-300">${openedAt}</td>
        <td class="p-3 text-center">${duration}</td>
        <td class="p-3 font-mono text-purple-300">${ipAddress}</td>
        <td class="p-3">${city}</td>
        <td class="p-3">${country}</td>
      </tr>
      `;
    });

    activityTable.innerHTML = rows.join('');

  } catch (err) {
    console.error('Ошибка при загрузке активности:', err);
    activityTable.innerHTML = `
      <tr>
        <td colspan="9" class="p-4 text-center text-red-400">
          Ошибка: ${err.message || 'Неизвестная ошибка при загрузке активности'}
        </td>
      </tr>
    `;
  }
}

// Загружаем данные при загрузке страницы
document.addEventListener('DOMContentLoaded', loadActivity);
</script>
</body>
</html>
