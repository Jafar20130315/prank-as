<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Активность розыгрышей</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://esm.sh/@supabase/supabase-js@2?global"></script>
</head>

<body class="bg-slate-900 text-white p-6">
<div class="max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">📊 Admin Panel - Активность розыгрышей</h1>
    <button id="loadActivityBtn" onclick="loadActivity()"
      class="text-sm bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded transition">
      Обновить активность
    </button>
  </div>

  <!-- Панель отладки -->
  <div class="mb-4 p-3 bg-gray-800 rounded-lg text-xs">
    <div class="font-bold mb-1">Отладочная информация:</div>
    <div id="debugInfo" class="text-gray-400">Проверка прав администратора...</div>
  </div>

  <!-- Таблица активности -->
  <div>
    <h2 class="text-xl font-semibold mb-4 text-green-300">📍 Активность розыгрышей</h2>
    <div class="overflow-x-auto rounded-lg border border-white/10">
      <table class="w-full text-sm">
        <thead class="bg-white/10 text-xs uppercase text-gray-300">
          <tr>
            <th class="p-3 text-left">ID</th>
            <th class="p-3 text-left">User ID</th>
            <th class="p-3 text-left">Email</th>
            <th class="p-3 text-left">Розыгрыш</th>
            <th class="p-3 text-left">Открыт</th>
            <th class="p-3 text-left">Длительность (с)</th>
            <th class="p-3 text-left">IP-адрес</th>
            <th class="p-3 text-left">Город</th>
            <th class="p-3 text-left">Страна</th>
          </tr>
        </thead>
        <tbody id="activityTable" class="divide-y divide-white/10">
          <tr>
            <td colspan="9" class="p-4 text-center text-gray-400">Проверка доступа...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
// --- ИНИЦИАЛИЗАЦИЯ SUPABASE КЛИЕНТА ---
const SUPABASE_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// --- /ИНИЦИАЛИЗАЦИЯ SUPABASE КЛИЕНТА ---

// Укажите здесь UID администратора (его UUID из таблицы auth.users)
// ЗАМЕНИТЕ ЭТО НА РЕАЛЬНЫЙ UUID АДМИНИСТРАТОРА!
const ADMIN_USER_ID = 'c11bed70-f718-47dd-85ae-4764717a566c';

// Функция редиректа на главную страницу
function redirectToHome() {
  console.log("Выполняется редирект на главную страницу...");
  window.location.href = '/';
}

// Функция проверки администратора по UID
async function checkAdminStatus() {
  const debugInfo = document.getElementById('debugInfo');
  const activityTable = document.getElementById('activityTable');
  const loadActivityBtn = document.getElementById('loadActivityBtn');

  debugInfo.textContent = 'Получение сессии...';

  try {
    const {  { session }, error } = await supabase.auth.getSession();
    
    if (error) {
      console.error('Ошибка получения сессии:', error);
      debugInfo.innerHTML = `<span class="text-red-400">Ошибка получения сессии: ${error.message}</span>`;
      // Не редиректим при ошибке получения сессии, а показываем сообщение
      activityTable.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-red-400">Ошибка аутентификации</td></tr>`;
      loadActivityBtn.disabled = true;
      return false;
    }

    if (!session || !session.user) {
      console.log('Пользователь не вошёл в систему');
      debugInfo.innerHTML = '<span class="text-yellow-400">Пользователь не вошёл в систему. Перенаправление...</span>';
      setTimeout(redirectToHome, 1000); // Редирект через 1 секунду
      return false;
    }

    const currentUserId = session.user.id;
    debugInfo.innerHTML = `UID текущего пользователя: ${currentUserId}<br>UID администратора: ${ADMIN_USER_ID}`;

    if (currentUserId === ADMIN_USER_ID) {
      console.log('Пользователь является администратором');
      debugInfo.innerHTML += '<br><span class="text-green-400">✅ Доступ разрешен. Готово.</span>';
      activityTable.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-400">Нажмите "Обновить активность", чтобы загрузить данные</td></tr>`;
      loadActivityBtn.disabled = false; // Активируем кнопку
      return true;
    } else {
      console.log('Пользователь не является администратором (UID не совпадает)');
      debugInfo.innerHTML += '<br><span class="text-red-400">❌ UID не совпадает. Перенаправление...</span>';
      setTimeout(redirectToHome, 1500); // Редирект через 1.5 секунды
      return false;
    }
  } catch (error) {
    console.error('Критическая ошибка при проверке администратора:', error);
    debugInfo.innerHTML = `<span class="text-red-400">Критическая ошибка: ${error.message}</span>`;
    activityTable.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-red-400">Критическая ошибка</td></tr>`;
    loadActivityBtn.disabled = true;
    return false;
  }
}

// Функция получения токена (для использования в fetch)
async function getAuthToken() {
  try {
    const {  { session } } = await supabase.auth.getSession();
    return session?.access_token || null;
  } catch (error) {
    console.error('Ошибка при получении токена:', error);
    return null;
  }
}

const ACTIVITY_FUNCTION_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co/functions/v1/track-activity';

const activityTable = document.getElementById('activityTable');
const debugInfo = document.getElementById('debugInfo');

function formatDate(dateString) {
  if (!dateString) return '-';
  try {
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return '-';
    return date.toLocaleString('ru-RU', {
      year: 'numeric',
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  } catch (e) {
    console.error('Ошибка форматирования даты:', e);
    return '-';
  }
}

function safeGet(obj, path, defaultValue = '-') {
  if (!obj) return defaultValue;
  return path.split('.').reduce((acc, part) => {
    return acc && acc[part] !== undefined && acc[part] !== null ? acc[part] : defaultValue;
  }, obj);
}

// Функция загрузки активности (теперь без проверки администратора)
async function loadActivity() {
  // Проверим еще раз, на всякий случай (опционально)
  const isAdmin = await checkAdminStatus();
  if (!isAdmin) {
    console.warn("Попытка загрузки активности не администратором");
    return;
  }

  activityTable.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-400">Загрузка активности...</td></tr>`;

  try {
    const token = await getAuthToken();
    if (!token) {
        throw new Error('Токен аутентификации не найден.');
    }

    const res = await fetch(ACTIVITY_FUNCTION_URL, {
      method: 'GET',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
      }
    });

    if (!res.ok) {
      const errorText = await res.text();
      throw new Error(`Ошибка сервера: ${res.status} ${res.statusText}. Ответ: ${errorText}`);
    }

    const json = await res.json();
    console.log('Активность:', json);

    let activities = [];
    if (json.data && Array.isArray(json.data)) {
      activities = json.data;
    } else if (Array.isArray(json)) {
      activities = json;
    }

    if (activities.length === 0) {
      activityTable.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-400">Нет данных об активности</td></tr>`;
      return;
    }

    // Создаем строки таблицы
    const rows = activities.map((activity) => {
      const id = safeGet(activity, 'id') || '-';
      const userId = safeGet(activity, 'user_id') || '-';
      const email = safeGet(activity, 'email') || '-';
      const prankName = safeGet(activity, 'prank_name') || '-';
      const openedAt = formatDate(safeGet(activity, 'opened_at'));
      const duration = safeGet(activity, 'duration') || '-';
      const ipAddress = safeGet(activity, 'ip_address') || '-';
      const city = safeGet(activity, 'city') || '-';
      const country = safeGet(activity, 'country') || '-';

      return `
      <tr class="hover:bg-white/5 transition">
        <td class="p-3 font-mono">${id}</td>
        <td class="p-3 font-mono">${userId}</td>
        <td class="p-3 break-all">${email}</td>
        <td class="p-3">${prankName}</td>
        <td class="p-3 text-blue-300">${openedAt}</td>
        <td class="p-3 text-center">${duration}</td>
        <td class="p-3 font-mono text-purple-300">${ipAddress}</td>
        <td class="p-3">${city}</td>
        <td class="p-3">${country}</td>
      </tr>
      `;
    });

    activityTable.innerHTML = rows.join('');

  } catch (err) {
    console.error('Ошибка при загрузке активности:', err);
    activityTable.innerHTML = `
      <tr>
        <td colspan="9" class="p-4 text-center text-red-400">
          Ошибка: ${err.message || 'Неизвестная ошибка при загрузке активности'}
        </td>
      </tr>
    `;
  }
}

// Загружаем данные при загрузке страницы
document.addEventListener('DOMContentLoaded', checkAdminStatus);
</script>
</body>
</html>
