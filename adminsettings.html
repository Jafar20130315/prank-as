<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Statistika</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white p-6">

<div class="max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">📊 Statistika</h1>
    <button onclick="location.reload()"
      class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded">
      Yangilash
    </button>
  </div>

  <div class="overflow-x-auto rounded-lg border border-white/10">
    <table class="w-full text-sm">
      <thead class="bg-white/10 text-xs uppercase text-gray-300">
        <tr>
          <th class="p-3">User</th>
          <th class="p-3">Email</th>
          <th class="p-3">Sahifa</th>
          <th class="p-3">IP</th>
          <th class="p-3">Joylashuv</th>
          <th class="p-3">Vaqt</th>
          <th class="p-3 text-center">Davomiylik</th>
        </tr>
      </thead>
      <tbody id="body" class="divide-y divide-white/10">
        <tr>
          <td colspan="7" class="p-4 text-center text-gray-400">
            Yuklanmoqda...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'
const ADMIN_UUID = 'c11bed70-f718-47dd-85ae-4764717a566c'

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const body = document.getElementById('body')

// Admin check
async function checkAdmin() {
  const { data: { user } } = await supabase.auth.getUser()
  if (!user || user.id !== ADMIN_UUID) {
    location.href = '/'
    return false
  }
  return true
}

async function loadStats() {
  if (!(await checkAdmin())) return

  const { data, error } = await supabase
    .from('user_activity')
    .select('*')
    .order('opened_at', { ascending: false })
    .limit(200)

  if (error || !data?.length) {
    body.innerHTML = `
      <tr><td colspan="7" class="p-4 text-center text-gray-400">
        Ma'lumot yo'q
      </td></tr>`
    return
  }

  body.innerHTML = data.map(r => `
    <tr class="hover:bg-white/5">
      <td class="p-3 flex items-center gap-3">
        ${r.avatar_url
          ? `<img src="${r.avatar_url}" class="w-8 h-8 rounded-full">`
          : `<div class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center">?</div>`
        }
        <span>${r.user_name || 'Guest'}</span>
      </td>
      <td class="p-3 text-gray-300">${r.user_email || '-'}</td>
      <td class="p-3">${r.prank_name}</td>
      <td class="p-3 text-xs font-mono">${r.ip || '-'}</td>
      <td class="p-3">${r.country || '-'} ${r.city ? `(${r.city})` : ''}</td>
      <td class="p-3 text-gray-400">${new Date(r.opened_at).toLocaleString()}</td>
      <td class="p-3 text-center">${r.duration || 0}s</td>
    </tr>
  `).join('')
}

loadStats()

supabase.channel('rt')
  .on('postgres_changes',
    { event: 'INSERT', schema: 'public', table: 'user_activity' },
    loadStats
  )
  .subscribe()
</script>

</body>
</html>
