<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Prank-as — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white p-6">

  <h1 class="text-3xl font-bold mb-6">Admin statistika</h1>

  <table class="w-full border border-white/10 text-sm">
    <thead class="bg-white/10">
      <tr>
        <th class="p-2 text-left">User ID</th>
        <th class="p-2 text-left">Action</th>
        <th class="p-2 text-left">Vaqt</th>
      </tr>
    </thead>
    <tbody id="stats"></tbody>
  </table>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://GEFAQRFJZWEMWUXUOADP.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'

    const ADMIN_EMAIL = 'admin@prank-as.site'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const tbody = document.getElementById('stats')

    const checkAdminAndLoad = async () => {
      const { data: { user } } = await supabase.auth.getUser()

      if (!user || user.email !== ADMIN_EMAIL) {
        location.href = '/'
        return
      }

      const { data, error } = await supabase
        .from('user_activity')
        .select('*')
        .order('created_at', { ascending: false })

      if (error) {
        alert(error.message)
        return
      }

      data.forEach(row => {
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td class="p-2 border-t border-white/10">${row.user_id}</td>
          <td class="p-2 border-t border-white/10">${row.action}</td>
          <td class="p-2 border-t border-white/10">${new Date(row.created_at).toLocaleString()}</td>
        `
        tbody.appendChild(tr)
      })
    }

    checkAdminAndLoad()
  </script>

</body>
</html>
