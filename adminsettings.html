<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6">

<h1 class="text-3xl font-bold mb-6">Statistika</h1>

<table class="w-full border border-white/10 text-sm">
  <thead class="bg-white/10">
    <tr>
      <th class="p-2 text-left">Foydalanuvchi</th>
      <th class="p-2 text-left">Email</th>
      <th class="p-2 text-left">Sahifa</th>
      <th class="p-2 text-left">Vaqt</th>
      <th class="p-2 text-left">Davomiylik (soniya)</th>
    </tr>
  </thead>
  <tbody id="stats"></tbody>
</table>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://gefaqrfjzwemwuxuoadp.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZmFxcmZqendlbXd1eHVvYWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MDEwNTMsImV4cCI6MjA4MTM3NzA1M30.97YAWGJv7i9OgEMs0mFAuaxQ94ZJCuaxa0qKv-7XDJg'

const ADMIN_UUID = 'f5c0015c-51ef-4f5a-a989-afa85250f012'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const tbody = document.getElementById('stats')

// Prank URL → Haqiqiy title
const PRANK_TITLES = {
  'soxta-ulanish-sistemasi': 'Soxta ulanish sistemasi',
  'soxta-uyin-bank-kartasi': 'Soxta o‘yin bank kartasi',
  'soxta-wifi-parol-aniqlovchi': 'Soxta Wi-Fi parol aniqlovchi',
  'soxta-joylashuv-aniqlovchi': 'Soxta joylashuv aniqlovchi',
  'soxta-random-yashash-joyi': 'Soxta random yashash joyi',
  'soxta-shaxs-aniqlovchi': 'Soxta shaxs aniqlovchi',
  'avtoraqam-rasm-generatori': 'Avtoraqam rasm generatori',
  'soxta-parol-aniqlovchi': 'Soxta parol aniqlovchi',
  'soxta-balans-aniqlovchi': 'Soxta balans aniqlovchi',
  'oyin-barabani': 'O‘yin barabani',
  'ovoz-olchovchi': 'Ovoz o‘lchovchi',
  'tekst-ovoz': 'Tekst → Ovo‍z',
  'soxta-wifi-parol-joylashuv-aniqlovchi': 'Soxta Wi-Fi parol aniqlovchi PRO',
  'rangligradient': 'Rangli sensor',
  '3d-qol-boshqaruvi': '3D Shakl boshqaruvi',
  'ai-kamera': 'Aqlli kamera',
  'musiqa-zarba-kuzatuvchi': 'Musiqa pleyeri'
}

// 🔹 Admin tekshiruv
async function checkAdmin() {
  const { data: { user }, error } = await supabase.auth.getUser()
  if (error || !user || user.id !== ADMIN_UUID) {
    location.href = '/'
  }
}
checkAdmin()

// 🔹 Statistika yuklash
async function loadStats() {
  try {
    const { data: activities, error } = await supabase
      .from('user_activity')
      .select('*')
      .order('opened_at', { ascending: false })

    if (error) throw error
    tbody.innerHTML = ''

    if (!activities || activities.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-white/50">Maʼlumot yo‘q</td></tr>`
      return
    }

    for (const row of activities) {
      // 🔹 user info
      const { data: userData, error: userError } = await supabase.auth.getUser(row.user_id)
      const user = userData.user || {}
      const email = user.email || '-'
      const name = user.user_metadata?.full_name || 'Noma’lum'
      const picture = user.user_metadata?.picture || ''

      const title = PRANK_TITLES[row.prank_name] || row.prank_name || 'unknown'

      const tr = document.createElement('tr')
      tr.innerHTML = `
        <td class="p-2 border-t border-white/10 flex items-center gap-2">
          ${picture ? `<img src="${picture}" class="w-8 h-8 rounded-full object-cover">` : ''}
          <span>${name}</span>
        </td>
        <td class="p-2 border-t border-white/10 break-all">${email}</td>
        <td class="p-2 border-t border-white/10">${title}</td>
        <td class="p-2 border-t border-white/10">${new Date(row.opened_at).toLocaleString()}</td>
        <td class="p-2 border-t border-white/10 text-center">${row.duration ?? '-'}</td>
      `
      tbody.appendChild(tr)
    }

  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">Xatolik: ${err.message}</td></tr>`
  }
}

// 🔹 Real-time monitoring
const channel = supabase.channel('public:user_activity')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'user_activity' }, payload => {
    loadStats()
  })
  .subscribe()

// 🔹 Dastlabki yuklash
loadStats()

// 🔹 Har 15 soniyada zaxira yangilash
setInterval(loadStats, 15000)
</script>

</body>
</html>
