<html lang="ru-uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Avtoraqam rasm generatori</title>
<link rel="icon" type="image/x-icon" href="favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
@font-face {
  font-family: 'PlateFont'; 
  src: url('https://prank-as.uz/docs/FE-Font-uzbek-plate-avtoraqam.uz.woff2') format('woff2'); 
  font-weight: normal;
  font-style: normal;
  font-display: swap; 
}

body { font-family: 'Inter', sans-serif; }

.license-plate {
    font-family: 'PlateFont';
    width: 100%;
    max-width: 520px;
    height: 112px;
    background: white;
    border: 3px solid black;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    user-select: none;
    box-sizing: border-box;
    overflow: hidden;
}

.plate-region {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-width: 70px;
    /* УДАЛЕНО: border-left: 3px solid black; */
    padding-left: 5px;
}

.plate-region svg { width: 55px; height: 30px; }
.plate-uz { font-weight: 600; font-size: 24px; margin-top: 4px; font-family: sans-serif; line-height: 1; }

.plate-main {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    letter-spacing: 1px;
    color: black;
    line-height: 1;
    white-space: nowrap;
    --offset-y: 0px;
    transform: translateY(var(--offset-y));
    transition: transform 0.1s ease-out;
}

.plate-divider { width: 3px; height: 70px; background: black; margin: 0 10px; flex-shrink: 0; }

.editable { outline: none; cursor: pointer; border-radius: 5px; transition: background-color 0.2s; }
.editable:hover, .editable:focus { background-color: #e0f2fe; }

.tab { transition: all 0.2s; }
.tab.active { background-color: #1d4ed8; color: white; }

@media(max-width:600px){
    .license-plate { height: 80px; padding: 0 5px; border-width: 2px; }
    .plate-region { min-width: 55px; }
    .plate-region svg { width: 35px; height: 17px; }
    .plate-uz { font-size: 16px; }
    .plate-main { font-size: 44px; }
    .plate-divider { width: 2px; height: 50px; margin: 0 5px; }
}
</style>
</head>

    <button id="download-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-all flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Rasm sifatida yuklash
    </button>
</div>

<script>
const tabIndividual=document.getElementById('tab-individual');
const tabLegal=document.getElementById('tab-legal');
const individualPlate=document.getElementById('individual-plate');
const legalPlate=document.getElementById('legal-plate');
const downloadBtn=document.getElementById('download-btn');
const editableElements=document.querySelectorAll('.editable');

function switchTab(activeTab){
    if(activeTab==='individual'){
        tabIndividual.classList.add('active');
        tabLegal.classList.remove('active');
        individualPlate.classList.remove('hidden');
        legalPlate.classList.add('hidden');
    } else {
        tabLegal.classList.add('active');
        tabIndividual.classList.remove('active');
        legalPlate.classList.remove('hidden');
        individualPlate.classList.add('hidden');
    }
}

tabIndividual.addEventListener('click',()=>switchTab('individual'));
tabLegal.addEventListener('click',()=>switchTab('legal'));

downloadBtn.addEventListener('click',()=>{
    const activePlate = individualPlate.classList.contains('hidden') ? legalPlate : individualPlate;
    
    html2canvas(activePlate,{backgroundColor:null,scale:3}).then((canvas)=>{
        const link=document.createElement('a');
        link.download='avtoraqam.png';
        link.href=canvas.toDataURL('image/png');
        link.click();
    });
});

editableElements.forEach((el)=>{
    el.addEventListener('keydown',(e)=>{
        const type=el.dataset.type;
        const maxLength=parseInt(el.dataset.length,10);
        const currentLength=el.textContent.length;
        const allowedKeys=['Backspace','Delete','ArrowLeft','ArrowRight','Tab'];
        if(allowedKeys.includes(e.key))return;
        if(currentLength>=maxLength){e.preventDefault();return;}
        if(type==='number'&&!/^[0-9]$/.test(e.key))e.preventDefault();
        if(type==='letter'&&!/^[a-zA-Z]$/.test(e.key))e.preventDefault();
    });
    el.addEventListener('input',()=>{
        if(el.dataset.type==='letter'){
            const selection=window.getSelection();
            const range=selection.getRangeAt(0);
            const offset=range.startOffset;
            el.textContent=el.textContent.toUpperCase();
            const newRange=document.createRange();
            if(el.childNodes.length>0){
                newRange.setStart(el.childNodes[0],Math.min(offset,el.textContent.length));
                newRange.collapse(true);
                selection.removeAllRanges();
                selection.addRange(newRange);
            }
        }
    });
});
</script>
</body>
