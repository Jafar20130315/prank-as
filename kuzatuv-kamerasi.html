<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuzatuv Kamerasi (ID & QR)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Библиотеки для упрощенного соединения и QR -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #1f2937;
            margin: 0;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        video {
            background: #000;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1rem;
        }
        .mirror { transform: scaleX(-1); }
        .step-card { display: none; }
        .step-card.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #qrcode img { margin: 0 auto; border: 8px solid white; border-radius: 12px; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-lg glass rounded-3xl p-6 shadow-2xl relative">
        
        <!-- Загрузка -->
        <div id="loader" class="absolute inset-0 z-50 bg-white/90 flex flex-col items-center justify-center rounded-3xl hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p class="text-indigo-600 font-medium">Ulanmoqda...</p>
        </div>

        <!-- 1. Роль -->
        <div id="step-1" class="step-card active space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-slate-800">Kuzatuv Tizimi</h1>
                <p class="text-slate-500 mt-2">ID va QR orqali ulanish</p>
            </div>
            
            <div class="grid gap-4 mt-8">
                <button onclick="startRole('monitor')" class="p-6 border-2 border-indigo-100 rounded-2xl hover:border-indigo-500 hover:bg-indigo-50 transition-all text-left group">
                    <div class="text-indigo-600 font-bold text-xl mb-1">Monitor bo'lish</div>
                    <p class="text-sm text-gray-500">Boshqa qurilmani kuzatish</p>
                </button>

                <button onclick="startRole('camera')" class="p-6 border-2 border-emerald-100 rounded-2xl hover:border-emerald-500 hover:bg-emerald-50 transition-all text-left group">
                    <div class="text-emerald-600 font-bold text-xl mb-1">Kamera bo'lish</div>
                    <p class="text-sm text-gray-500">Tasvirni uzatish</p>
                </button>
            </div>
        </div>

        <!-- 2. Экран Монитора (Ожидание) -->
        <div id="step-monitor" class="step-card space-y-6 text-center">
            <h2 class="text-xl font-bold text-indigo-600">Kamera ulanishini kuting</h2>
            
            <div id="qrcode" class="flex justify-center my-4"></div>
            
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Ulanish kodi</p>
                <div id="my-id-display" class="text-4xl font-mono font-bold text-indigo-600 tracking-tighter">------</div>
            </div>
            
            <p class="text-sm text-gray-500">Kamerada ushbu kodni kiriting yoki QR-ni skanerlang</p>
            <button onclick="location.reload()" class="text-red-500 font-medium pt-4">Bekor qilish</button>
        </div>

        <!-- 3. Экран Камеры (Ввод кода) -->
        <div id="step-camera" class="step-card space-y-6">
            <h2 class="text-xl font-bold text-center text-emerald-600">Monitorga ulanish</h2>
            
            <div class="space-y-4">
                <input type="text" id="peer-id-input" placeholder="ID kodni kiriting" 
                       class="w-full text-center text-3xl font-mono p-4 border-2 border-gray-100 rounded-2xl focus:border-emerald-500 outline-none bg-gray-50">
                
                <button onclick="connectToMonitor()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all text-xl">
                    Ulanish
                </button>
            </div>
            
            <p class="text-center text-gray-400 text-sm italic">Eslatma: Monitor ekranidagi 6 xonali sonni kiriting</p>
            <button onclick="location.reload()" class="w-full text-gray-400">Orqaga</button>
        </div>

        <!-- 4. Видео экран -->
        <div id="call-screen" class="step-card space-y-4">
            <div class="relative aspect-video bg-black rounded-2xl overflow-hidden ring-4 ring-black/5 shadow-2xl">
                <video id="remote-video" autoplay playsinline></video>
                <div id="local-preview" class="absolute bottom-3 right-3 w-1/4 aspect-video rounded-lg overflow-hidden border-2 border-white shadow-xl hidden bg-slate-900">
                    <video id="local-video" autoplay playsinline muted class="mirror"></video>
                </div>
                <div class="absolute top-4 left-4 flex gap-2">
                    <div class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded font-bold animate-pulse">LIVE</div>
                    <div id="role-label" class="bg-black/40 backdrop-blur text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase"></div>
                </div>
            </div>
            
            <div class="flex justify-between items-center bg-white/50 p-4 rounded-2xl border border-white">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
                    <span class="font-bold text-slate-700">Aloqa o'rnatildi</span>
                </div>
                <button onclick="location.reload()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-xl font-bold transition-colors">Tugatish</button>
            </div>
        </div>
    </div>

    <script>
        let peer;
        let myId;
        let currentRole = '';

        function showStep(id) {
            document.querySelectorAll('.step-card').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function toggleLoader(show) {
            document.getElementById('loader').classList.toggle('hidden', !show);
        }

        // Инициализация PeerJS
        function initPeer(callback) {
            toggleLoader(true);
            // Создаем случайный 6-значный ID
            const shortId = Math.floor(100000 + Math.random() * 900000).toString();
            
            peer = new Peer(shortId, {
                debug: 1,
                config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]}
            });

            peer.on('open', (id) => {
                myId = id;
                toggleLoader(false);
                callback(id);
            });

            peer.on('error', (err) => {
                console.error(err);
                alert("Ulanish xatosi: " + err.type);
                location.reload();
            });
        }

        window.startRole = (role) => {
            currentRole = role;
            if (role === 'monitor') {
                initPeer((id) => {
                    showStep('step-monitor');
                    document.getElementById('my-id-display').innerText = id;
                    // Создаем QR код
                    new QRCode(document.getElementById('qrcode'), {
                        text: id,
                        width: 180,
                        height: 180,
                        colorDark : "#4f46e5",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    // Ждем звонка от камеры
                    peer.on('call', (call) => {
                        // Монитор может отправлять аудио обратно, если нужно
                        navigator.mediaDevices.getUserMedia({video: false, audio: true})
                            .then(stream => {
                                call.answer(stream);
                                handleStream(call);
                            })
                            .catch(() => {
                                call.answer(); // Отвечаем без своего потока
                                handleStream(call);
                            });
                    });
                });
            } else {
                showStep('step-camera');
            }
        };

        async function connectToMonitor() {
            const targetId = document.getElementById('peer-id-input').value;
            if (!targetId || targetId.length < 6) return alert("ID kodni kiriting!");

            toggleLoader(true);
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                initPeer((id) => {
                    document.getElementById('local-video').srcObject = stream;
                    document.getElementById('local-preview').classList.remove('hidden');
                    
                    const call = peer.call(targetId, stream);
                    handleStream(call);
                });
            } catch (err) {
                alert("Kameraga ruxsat berilmadi!");
                toggleLoader(false);
            }
        }

        function handleStream(call) {
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                document.getElementById('role-label').innerText = currentRole;
                toggleLoader(false);
                showStep('call-screen');
            });
            
            call.on('close', () => location.reload());
        }

        // Фильтр только цифр для ввода
        document.getElementById('peer-id-input').oninput = function() {
            this.value = this.value.replace(/\D/g,'');
        };
    </script>
</body>
</html>
