<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuzatuv kamerasi (Telefon orqali)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glass { background: rgba(255, 255, 255, 0.95); border-radius: 1.5rem; }
        video { background: #000; border-radius: 1rem; width: 100%; height: 100%; object-fit: cover; }
        .mirror { transform: scaleX(-1); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div id="app" class="w-full max-w-lg glass p-6 shadow-2xl">
        
        <!-- Выбор роли -->
        <div id="setup-screen" class="space-y-6">
            <h1 class="text-2xl font-bold text-center mb-8 text-slate-800">Bu qurilma qanday ishlatilsin ?</h1>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="startRole('monitor')" class="p-6 border-2 border-indigo-500 rounded-xl hover:bg-indigo-50 transition-all text-left group">
                    <div class="text-indigo-600 font-bold text-lg mb-1">Monitor</div>
                    <p class="text-sm text-gray-500">Telefondagi videoni ko'rish</p>
                </button>
                <button onclick="startRole('camera')" class="p-6 border-2 border-emerald-500 rounded-xl hover:bg-emerald-50 transition-all text-left group">
                    <div class="text-emerald-600 font-bold text-lg mb-1">Kamera/div>
                    <p class="text-sm text-gray-500">Videoni monitorga yuboraman va kuzatuv kamerasidek ishlayman</p>
                </button>
            </div>
        </div>

        <!-- Экран ожидания (Монитор) -->
        <div id="monitor-setup" class="hidden flex flex-col items-center space-y-6">
            <h2 class="text-xl font-semibold">Kamera ulanishi kutilmoqda</h2>
            <div id="qrcode" class="p-4 bg-white border-4 border-indigo-100 rounded-2xl"></div>
            <div class="text-center">
                <p class="text-gray-400 text-xs uppercase tracking-widest mb-1">Ulanish uchun kod</p>
                <div id="display-id" class="text-4xl font-mono font-bold text-indigo-600 tracking-tighter">------</div>
            </div>
            <button onclick="location.reload()" class="text-red-400 hover:text-red-600">bekor qilish</button>
        </div>

        <!-- Экран ввода ID (Камера) -->
        <div id="camera-setup" class="hidden space-y-6 text-center">
            <h2 class="text-xl font-semibold">Monitorga ulanish</h2>
            <input type="text" id="join-id" maxlength="6" placeholder="6 xonaliik raqamni kiriting" 
                   class="w-full text-center text-3xl font-mono p-4 border-2 border-gray-100 rounded-2xl focus:border-emerald-500 outline-none">
            <button onclick="joinSession()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all">
               Boshlash
            </button>
            <button onclick="location.reload()" class="text-gray-400 text-sm">orqaga</button>
        </div>

        <!-- Экран связи (Общий) -->
        <div id="call-screen" class="hidden flex flex-col space-y-4">
            <div class="relative aspect-video rounded-2xl overflow-hidden bg-black shadow-inner">
                <video id="remote-video" autoplay playsinline></video>
                <div id="local-preview-container" class="absolute bottom-4 right-4 w-1/4 aspect-video rounded-lg overflow-hidden border-2 border-white shadow-lg hidden">
                    <video id="local-video" autoplay playsinline muted class="mirror"></video>
                </div>
                <div class="absolute top-4 left-4 flex gap-2">
                    <span id="status-badge" class="bg-red-600 text-white text-[10px] px-2 py-1 rounded font-bold animate-pulse">LIVE</span>
                    <span id="role-badge" class="bg-black/50 text-white text-[10px] px-2 py-1 rounded font-bold uppercase"></span>
                </div>
            </div>
            
            <div class="flex flex-col items-center gap-4">
                <div id="mic-indicator" class="flex items-center gap-2 text-indigo-600 font-medium">
                    <div class="w-3 h-3 bg-indigo-500 rounded-full animate-bounce"></div>
                    <span id="mic-text">Mikrofon ishlayabdi</span>
                </div>
                <button onclick="location.reload()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-2xl transition-all shadow-lg">
                    Tugatish
                </button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Автоматическая конфигурация
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'webrtc-prod-app';

        const servers = {
            iceServers: [
                { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
            ],
            iceCandidatePoolSize: 10,
        };

        let pc = new RTCPeerConnection(servers);
        let localStream = null;
        let remoteStream = null;
        let currentRole = null;

        // Авторизация
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        window.startRole = async (role) => {
            currentRole = role;
            await initAuth();
            document.getElementById('setup-screen').classList.add('hidden');

            if (role === 'monitor') {
                document.getElementById('monitor-setup').classList.remove('hidden');
                setupMonitor();
            } else {
                document.getElementById('camera-setup').classList.remove('hidden');
            }
        };

        // МОНИТОР
        async function setupMonitor() {
            const sessionId = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('display-id').innerText = sessionId;
            new QRCode(document.getElementById('qrcode'), { text: sessionId, width: 160, height: 160 });

            const callDoc = doc(db, 'artifacts', appId, 'public', 'data', sessionId);
            const offerCandidates = collection(callDoc, 'offerCandidates');
            const answerCandidates = collection(callDoc, 'answerCandidates');

            pc.onicecandidate = (event) => {
                if (event.candidate) addDoc(offerCandidates, event.candidate.toJSON());
            };

            // Включаем микрофон монитора сразу
            localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            remoteStream = new MediaStream();
            document.getElementById('remote-video').srcObject = remoteStream;

            pc.ontrack = (event) => {
                event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
            };

            const offerDescription = await pc.createOffer();
            await pc.setLocalDescription(offerDescription);

            await setDoc(callDoc, { offer: { type: offerDescription.type, sdp: offerDescription.sdp } });

            onSnapshot(callDoc, (snapshot) => {
                const data = snapshot.data();
                if (!pc.currentRemoteDescription && data?.answer) {
                    pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                    startCallUI('Монитор');
                }
            }, (err) => console.error(err));

            onSnapshot(answerCandidates, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            }, (err) => console.error(err));
        }

        // КАМЕРА
        window.joinSession = async () => {
            const sessionId = document.getElementById('join-id').value;
            if (!sessionId) return;

            const callDoc = doc(db, 'artifacts', appId, 'public', 'data', sessionId);
            const answerCandidates = collection(callDoc, 'answerCandidates');
            const offerCandidates = collection(callDoc, 'offerCandidates');

            pc.onicecandidate = (event) => {
                if (event.candidate) addDoc(answerCandidates, event.candidate.toJSON());
            };

            const callSnapshot = await getDoc(callDoc);
            if (!callSnapshot.exists()) return alert("Сессия не найдена");
            const callData = callSnapshot.data();

            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            document.getElementById('local-video').srcObject = localStream;
            document.getElementById('local-preview-container').classList.remove('hidden');

            remoteStream = new MediaStream();
            document.getElementById('remote-video').srcObject = remoteStream;

            pc.ontrack = (event) => {
                event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
            };

            await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answerDescription = await pc.createAnswer();
            await pc.setLocalDescription(answerDescription);

            await updateDoc(callDoc, { answer: { type: answerDescription.type, sdp: answerDescription.sdp } });

            onSnapshot(offerCandidates, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            }, (err) => console.error(err));

            startCallUI('Камера');
        };

        function startCallUI(roleName) {
            document.getElementById('monitor-setup').classList.add('hidden');
            document.getElementById('camera-setup').classList.add('hidden');
            document.getElementById('call-screen').classList.remove('hidden');
            document.getElementById('role-badge').innerText = roleName;
            document.getElementById('mic-text').innerText = (currentRole === 'camera') ? "Video bor" : "Siz gapirayabsiz";
        }

        document.getElementById('join-id')?.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

    </script>
</body>
</html>
