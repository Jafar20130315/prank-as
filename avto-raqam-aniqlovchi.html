<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzbek ALPR - Пакетный сканер номеров</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm p-6 text-center border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">
                <i class="fa-solid fa-car-tunnel text-blue-600 mr-2"></i>Avtoraqam aniqlovchi skaner<span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full uppercase">BETA versiya</span>
            </h1>
            <p class="text-gray-500">Rasm orqali avtotransportning davlat raqamini aniqlang.</p>
        </div>

        <!-- Upload Section -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <label class="block text-sm font-semibold text-gray-700 mb-3">Rasmni yuklash (bir nechta rasm qo'llab-quvvatlanadi)</label>
            <div class="flex items-center justify-center w-full">
                <label for="image-upload" class="flex flex-col items-center justify-center w-full h-36 border-2 border-blue-300 border-dashed rounded-xl cursor-pointer bg-blue-50/50 hover:bg-blue-50 transition-colors">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6 px-4 text-center">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-500 mb-3"></i>
                        <p class="mb-1 text-sm text-gray-700 font-medium">Rasmlarni torib keling, yoki yuklang.</p>
                        <p class="text-xs text-gray-400">PNG, JPG, WEBP.</p>
                    </div>
                    <input id="image-upload" type="file" class="hidden" accept="image/*" multiple />
                </label>
            </div>
        </div>

        <!-- Results Dashboard -->
        <div id="dashboard" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hidden">
            <div class="p-6 border-b border-gray-100 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h2 class="text-lg font-bold text-gray-900">Natija</h2>
                    <p class="text-sm text-gray-500" id="stats-counter">0 dan 0 ta rasm aniqlandi</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportToCSV()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> CSV ga eksport
                    </button>
                    <button onclick="clearAll()" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 text-sm font-semibold rounded-lg transition-colors">
                        Hammasini tozalash
                    </button>
                </div>
            </div>

            <!-- Table Container -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-400 text-xs uppercase tracking-wider border-b border-gray-100">
                            <th class="p-4 font-semibold">Prevyu</th>
                            <th class="p-4 font-semibold">Status</th>
                            <th class="p-4 font-semibold">Davlat raqami</th>
                            <th class="p-4 font-semibold">AT turi</th>
                            <th class="p-4 font-semibold">Viloyat</th>
                            <th class="p-4 font-semibold text-right">Amallar</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody" class="divide-y divide-gray-100 text-sm">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

<script>
    const uploadInput = document.getElementById('image-upload');
    const dashboard = document.getElementById('dashboard');
    const resultsTbody = document.getElementById('results-tbody');
    const statsCounter = document.getElementById('stats-counter');

    const validRegions = ['01', '20', '30', '40', '50', '60', '70', '75', '80', '85', '90'];
    let scanResults = [];

    uploadInput.addEventListener('change', async function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        dashboard.classList.remove('hidden');
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const base64Url = await fileToDataURL(file);
            
            const itemIndex = scanResults.length;
            scanResults.push({
                file: file.name,
                image: base64Url,
                status: 'processing',
                plate: '---',
                type: '-',
                region: '-',
                raw: '-'
            });

            renderTable();
            
            // Запускаем анализ ИИ для каждого файла асинхронно
            processImageWithAI(base64Url, itemIndex);
        }
        
        // Сбросить инпут, чтобы можно было загрузить те же файлы повторно если нужно
        uploadInput.value = '';
    });

    function fileToDataURL(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }

    async function processImageWithAI(base64Url, index) {
        const base64Data = base64Url.split(',')[1];
        const mimeType = base64Url.split(';')[0].split(':')[1];

        const prompt = `Ты продвинутая система распознавания автомобильных номеров (ALPR). 
Внимательно посмотри на фото и найди автомобильный номер Узбекистана.
Прочитай его текст (только буквы и цифры, игнорируй флаги и гербы).
Если номер не найден, верни found: false.
Форматы номеров Узбекистана: 
- Физические лица: 2 цифры региона, 1 буква, 3 цифры, 2 буквы (напр. 01A123AA)
- Юридические лица: 2 цифры региона, 3 цифры, 3 буквы (напр. 01123AAA)
В 'plateText' пиши результат без пробелов.`;

        const payload = {
            contents: [{
                role: "user",
                parts: [
                    { text: prompt },
                    { inlineData: { mimeType: mimeType, data: base64Data } }
                ]
            }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        "found": { "type": "BOOLEAN" },
                        "plateText": { "type": "STRING" }
                    },
                    required: ["found", "plateText"]
                }
            }
        };

        try {
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            if (result.candidates && result.candidates[0].content.parts.length > 0) {
                const jsonText = result.candidates[0].content.parts[0].text;
                const aiData = JSON.parse(jsonText);
                
                if (aiData.found && aiData.plateText) {
                    const analysis = parseUzbekPlate(aiData.plateText);
                    scanResults[index] = {
                        ...scanResults[index],
                        status: analysis.valid ? 'success' : 'warning',
                        plate: analysis.formatted,
                        type: analysis.type,
                        region: analysis.region,
                        raw: aiData.plateText
                    };
                } else {
                    scanResults[index].status = 'error';
                    scanResults[index].plate = 'Topilmadi';
                }
            } else {
                scanResults[index].status = 'error';
                scanResults[index].plate = 'Javob qaytmadi';
            }
        } catch (error) {
            console.error(error);
            scanResults[index].status = 'error';
            scanResults[index].plate = 'Aloqada xatolik yuz berdi';
        }

        renderTable();
    }

    function parseUzbekPlate(rawText) {
        let clean = rawText.toUpperCase().replace(/[^A-Z0-9]/g, '');
        
        if(clean.length >= 2) {
           let start = clean.substring(0,2).replace(/O/g, '0').replace(/I/g, '1');
           clean = start + clean.substring(2);
        }

        let result = { 
            valid: false, 
            type: 'Nomalum', 
            formatted: clean || 'XATOLIK', 
            region: 'Nomalum' 
        };

        if (!clean || clean.length < 8) return result;

        const physRegex = /^([0-9]{2})([A-HJ-Z])([0-9]{3})([A-HJ-Z]{2})$/;
        const legalRegex = /^([0-9]{2})([0-9]{3})([A-HJ-Z]{3})$/;

        if (physRegex.test(clean)) {
            let match = clean.match(physRegex);
            let reg = match[1];
            if (validRegions.includes(reg)) {
                result.valid = true;
                result.type = 'Jis. shaxs';
                result.region = getRegionName(reg);
                result.formatted = `${match[1]} ${match[2]} ${match[3]} ${match[4]}`;
            }
        } else if (legalRegex.test(clean)) {
            let match = clean.match(legalRegex);
            let reg = match[1];
            if (validRegions.includes(reg)) {
                result.valid = true;
                result.type = 'Yur. shaxs';
                result.region = getRegionName(reg);
                result.formatted = `${match[1]} ${match[2]} ${match[3]}`;
            }
        }

        return result;
    }

    function getRegionName(code) {
        const map = {
            '01': 'Toshkent', '20': 'Sirdaryo', '30': 'Samarqand',
            '40': 'Farğona', '50': 'Namangan', '60': 'Andijon',
            '70': 'Qashqadaryo', '75': 'Surxandaryo', '80': 'Buxoro',
            '85': 'Navoiy', '90': 'Xorazm'
        };
        return `${code} - ${map[code] || 'Регион'}`;
    }

    function renderTable() {
        resultsTbody.innerHTML = '';
        let processedCount = 0;

        scanResults.forEach((item, index) => {
            if (item.status !== 'processing') processedCount++;

            let statusBadge = '';
            if (item.status === 'processing') {
                statusBadge = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700"><span class="loader"></span> Анализ...</span>`;
            } else if (item.status === 'success') {
                statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-green-50 text-green-700">Aniqlandi</span>`;
            } else if (item.status === 'warning') {
                statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700">Noodatiy</span>`;
            } else {
                statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-red-50 text-red-600">Xatolik</span>`;
            }

            const row = `
                <tr class="hover:bg-gray-50/50 transition-colors">
                    <td class="p-4">
                        <img src="${item.image}" class="w-16 h-12 object-cover rounded-lg border border-gray-200" />
                    </td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 font-mono font-bold text-gray-900 tracking-wider">${item.plate}</td>
                    <td class="p-4 text-gray-600">${item.type}</td>
                    <td class="p-4 text-gray-600 text-xs">${item.region}</td>
                    <td class="p-4 text-right">
                        <button onclick="copyToClipboard('${item.plate}')" class="p-2 text-gray-400 hover:text-blue-600 transition-colors" title="Avtoraqamni nusxalash">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </td>
                </tr>
            `;
            resultsTbody.innerHTML += row;
        });

        statsCounter.innerText = `Обработано: ${processedCount} из ${scanResults.length}`;
    }

    function copyToClipboard(text) {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        alert(`${text} davlat raqami nusxalandi!`);
    }

    function exportToCSV() {
        let csvContent = "data:text/csv;charset=utf-8,File,Plate,Type,Region\n";
        scanResults.forEach(row => {
            csvContent += `"${row.file}","${row.plate}","${row.type}","${row.region}"\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "uzb_plates_report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function clearAll() {
        scanResults = [];
        dashboard.classList.add('hidden');
        resultsTbody.innerHTML = '';
    }
</script>
</body>
</html>
