<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Avtoraqam aniqlovchi - SI & Informer</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* PlatesMania Style Uzbek License Plate Informer — moslashuvchan o'lcham */
        .uz-plate-informer {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            border: 2px solid #000000;
            border-radius: 6px;
            padding: 2px 6px;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.4), 0 2px 5px rgba(0,0,0,0.15);
            user-select: none;
            height: 40px;
            min-width: 0;
            width: fit-content;
            max-width: 100%;
            box-sizing: border-box;
        }

        .uz-plate-region {
            font-family: 'Oswald', 'Arial Black', sans-serif;
            font-weight: 700;
            font-size: 17px;
            line-height: 1;
            color: #000000;
            padding-right: 6px;
            border-right: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .uz-plate-number {
            font-family: 'Oswald', 'Arial Black', sans-serif;
            font-weight: 700;
            font-size: 19px;
            line-height: 1;
            color: #000000;
            padding: 0 8px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .uz-plate-flag-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 6px;
            border-left: 1px solid #cbd5e1;
            height: 100%;
            flex-shrink: 0;
        }

        .uz-plate-uz {
            color: #0099b5;
            font-weight: 900;
            font-size: 9px;
            line-height: 1;
            margin-top: 2px;
            font-family: sans-serif;
            letter-spacing: -0.5px;
        }

        #modal-img-wrapper {
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        #modal-img-wrapper:active {
            cursor: grabbing;
        }

        .action-btn:focus-visible,
        button:focus-visible,
        label:focus-within {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        /* Katta bosish maydonlari mobil uchun (44px — Apple/Google tavsiyasi) */
        @media (max-width: 767px) {
            .touch-target {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* Versiya belgisi — faqat kattaroq ekranlarda (PC) ko'rinadi */
        #version-badge {
            display: none;
        }
        @media (min-width: 768px) {
            #version-badge {
                display: flex;
            }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-3 sm:p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-4 md:space-y-6">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-6 text-center border border-gray-100">
            <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-gray-900 mb-2 flex flex-wrap items-center justify-center gap-2">
                <i class="fa-solid fa-car-tunnel text-blue-600" aria-hidden="true"></i>
                <span>Avtoraqam aniqlovchi skaner</span>
                <span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full uppercase font-semibold">SI</span>
            </h1>
            <p class="text-sm sm:text-base text-gray-500">Rasm orqali avtotransportning davlat raqamini aniqlang va PlatesMania informerini oling.</p>
        </div>

        <!-- Upload Section -->
        <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-6 border border-gray-100">
            <label class="block text-sm font-semibold text-gray-700 mb-3" for="image-upload">Rasmni yuklash (bir nechta rasm qo'llab-quvvatlanadi)</label>
            <div class="flex items-center justify-center w-full">
                <label for="image-upload" class="flex flex-col items-center justify-center w-full h-32 sm:h-36 border-2 border-blue-300 border-dashed rounded-xl cursor-pointer bg-blue-50/50 hover:bg-blue-50 active:bg-blue-100 transition-colors">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6 px-4 text-center">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl sm:text-4xl text-blue-500 mb-3" aria-hidden="true"></i>
                        <p class="mb-1 text-sm text-gray-700 font-medium">Rasmlarni tortib keling, yoki bosib yuklang.</p>
                        <p class="text-xs text-gray-400">PNG, JPG, WEBP. Har biri 8MB gacha.</p>
                    </div>
                    <input id="image-upload" type="file" class="hidden" accept="image/png, image/jpeg, image/webp" multiple capture="environment" />
                </label>
            </div>
            <p id="upload-error" class="text-sm text-red-600 mt-3 hidden" role="alert"></p>
        </div>

        <!-- Results Dashboard -->
        <div id="dashboard" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hidden">
            <div class="p-4 sm:p-6 border-b border-gray-100 flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-gray-900">Natija</h2>
                    <p class="text-xs sm:text-sm text-gray-500" id="stats-counter" aria-live="polite">0 dan 0 ta rasm aniqlandi</p>
                </div>
                <button onclick="clearAll()" class="touch-target px-4 py-2 bg-red-50 hover:bg-red-100 active:bg-red-200 text-red-600 text-sm font-semibold rounded-lg transition-colors">
                    Hammasini tozalash
                </button>
            </div>

            <!-- Desktop/tablet: jadval ko'rinishi -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-400 text-xs uppercase tracking-wider border-b border-gray-100">
                            <th class="p-4 font-semibold">Prevyu (bosing)</th>
                            <th class="p-4 font-semibold">Status</th>
                            <th class="p-4 font-semibold">Davlat raqami</th>
                            <th class="p-4 font-semibold">AT turi</th>
                            <th class="p-4 font-semibold">Viloyat</th>
                            <th class="p-4 font-semibold text-right">Amallar</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody" class="divide-y divide-gray-100 text-sm" aria-live="polite">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>

            <!-- Mobil: karta ko'rinishi -->
            <div id="results-cards" class="md:hidden divide-y divide-gray-100" aria-live="polite">
                <!-- Dynamic cards -->
            </div>
        </div>
    </div>

    <!-- Version badge — faqat PC uchun -->
    <div id="version-badge" class="fixed bottom-4 right-4 items-center gap-1.5 bg-gray-900/85 text-gray-300 text-xs px-3 py-1.5 rounded-full backdrop-blur border border-gray-700 z-40 select-none">
        <i class="fa-solid fa-code-branch text-[10px]" aria-hidden="true"></i>
        <span>v1.1</span>
    </div>

    <!-- Image Zoom Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300" role="dialog" aria-modal="true" aria-label="Rasm prevyusi">
        <div class="absolute top-3 left-3 right-3 sm:top-4 sm:left-4 sm:right-4 flex justify-between items-center z-10 px-1 sm:px-2">
            <div class="text-white/80 text-xs sm:text-sm font-medium bg-black/40 px-2.5 sm:px-3 py-1.5 rounded-full backdrop-blur hidden sm:block">
                <span id="zoom-level-text">100%</span> | G'ildirak/pinch orqali kattalashtiring
            </div>
            <div class="text-white/80 text-xs font-medium bg-black/40 px-2.5 py-1.5 rounded-full backdrop-blur sm:hidden">
                <span id="zoom-level-text-mobile">100%</span>
            </div>
            <div class="flex items-center gap-1 sm:gap-2 bg-gray-900/90 text-white p-1.5 rounded-full border border-gray-700 shadow-xl">
                <button onclick="changeZoom(0.25)" class="touch-target w-9 h-9 rounded-full hover:bg-gray-800 active:bg-gray-700 flex items-center justify-center text-sm transition-colors" title="Kattalashtirish (+)" aria-label="Kattalashtirish">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                </button>
                <button onclick="changeZoom(-0.25)" class="touch-target w-9 h-9 rounded-full hover:bg-gray-800 active:bg-gray-700 flex items-center justify-center text-sm transition-colors" title="Kichiklashtirish (-)" aria-label="Kichiklashtirish">
                    <i class="fa-solid fa-minus" aria-hidden="true"></i>
                </button>
                <button onclick="resetZoom()" class="touch-target w-9 h-9 rounded-full hover:bg-gray-800 active:bg-gray-700 flex items-center justify-center text-sm transition-colors" title="Dastlabki holat" aria-label="Dastlabki holatga qaytarish">
                    <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                </button>
                <div class="w-px h-5 bg-gray-700 mx-1"></div>
                <button onclick="closeImageModal()" class="touch-target w-9 h-9 rounded-full bg-red-600/80 hover:bg-red-600 active:bg-red-700 flex items-center justify-center text-white text-sm transition-colors" title="Yopish (ESC)" aria-label="Yopish">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <div class="w-full h-full flex items-center justify-center p-4 sm:p-6 overflow-hidden" onclick="handleModalBackdropClick(event)">
            <div id="modal-img-wrapper" class="relative max-w-full max-h-full transition-transform duration-75">
                <img id="modal-img" src="" alt="Prevyu" class="max-w-[92vw] max-h-[80vh] sm:max-w-[90vw] sm:max-h-[85vh] object-contain rounded-xl shadow-2xl pointer-events-auto" />
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-4 right-4 sm:left-auto sm:right-5 sm:w-auto bg-gray-900 text-white px-4 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50" role="status">
        <i class="fa-solid fa-circle-check text-green-400" aria-hidden="true"></i>
        <span id="toast-msg">Davlat raqami nusxalandi</span>
    </div>

<script>
    // ====== SOZLAMALAR ======
    const WORKER_URL = "https://avtoraqam-aniqlovchi-si-api.jafaras.uz";
    const APP_SECRET = "asammidamminahehewokawokahehe"; 

    const MAX_FILE_BYTES = 8 * 1024 * 1024; // 8 MB
    const MAX_UPLOAD_DIMENSION = 1600; // px
    const CONCURRENCY_LIMIT = 3;

    const uploadInput = document.getElementById('image-upload');
    const dashboard = document.getElementById('dashboard');
    const resultsTbody = document.getElementById('results-tbody');
    const resultsCards = document.getElementById('results-cards');
    const statsCounter = document.getElementById('stats-counter');
    const uploadError = document.getElementById('upload-error');

    const validRegions = ['01', '10', '20', '25', '30', '40', '50', '60', '70', '75', '80', '85', '90', '95'];

    let scanResults = [];

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = String(str ?? '');
        return div.innerHTML;
    }

    // ---------- Fayl yuklash ----------
    uploadInput.addEventListener('change', async function (e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        uploadError.classList.add('hidden');

        const validFiles = [];
        const rejected = [];
        for (const file of files) {
            const allowedTypes = ['image/png', 'image/jpeg', 'image/webp'];
            if (!allowedTypes.includes(file.type)) {
                rejected.push(`${file.name} (noto'g'ri format)`);
                continue;
            }
            if (file.size > MAX_FILE_BYTES) {
                rejected.push(`${file.name} (hajmi katta, 8MB dan oshmasin)`);
                continue;
            }
            validFiles.push(file);
        }

        if (rejected.length) {
            uploadError.textContent = `Ba'zi fayllar rad etildi: ${rejected.join(', ')}`;
            uploadError.classList.remove('hidden');
        }

        if (validFiles.length === 0) {
            uploadInput.value = '';
            return;
        }

        dashboard.classList.remove('hidden');

        const jobs = [];
        for (const file of validFiles) {
            const previewUrl = await fileToDataURL(file);
            const resized = await resizeImageForUpload(file, MAX_UPLOAD_DIMENSION);

            const itemIndex = scanResults.length;
            scanResults.push({
                file: file.name,
                image: previewUrl,
                status: 'queued',
                plate: '---',
                type: '-',
                region: '-',
                raw: '-',
            });
            jobs.push({ index: itemIndex, base64: resized.base64, mimeType: resized.mimeType });
        }

        renderResults();
        runWithConcurrencyLimit(jobs, CONCURRENCY_LIMIT, (job) => processImageWithAI(job.base64, job.mimeType, job.index));

        uploadInput.value = '';
    });

    function fileToDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = () => reject(new Error('Faylni o\'qib bo\'lmadi'));
            reader.readAsDataURL(file);
        });
    }

    function resizeImageForUpload(file, maxDimension) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDimension || height > maxDimension) {
                    const scale = maxDimension / Math.max(width, height);
                    width = Math.round(width * scale);
                    height = Math.round(height * scale);
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(url);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                resolve({
                    base64: dataUrl.split(',')[1],
                    mimeType: 'image/jpeg',
                });
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error('Rasmni qayta ishlab bo\'lmadi'));
            };
            img.src = url;
        });
    }

    async function runWithConcurrencyLimit(items, limit, worker) {
        let cursor = 0;
        const runners = new Array(Math.min(limit, items.length)).fill(null).map(async () => {
            while (cursor < items.length) {
                const item = items[cursor++];
                scanResults[item.index].status = 'processing';
                renderResults();
                await worker(item);
            }
        });
        await Promise.all(runners);
    }

    // ---------- AI orqali raqamni aniqlash ----------
    async function processImageWithAI(base64Data, mimeType, index) {
        try {
            const headers = { 'Content-Type': 'application/json' };
            if (APP_SECRET) headers['X-App-Secret'] = APP_SECRET;

            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers,
                body: JSON.stringify({ imageBase64: base64Data, mimeType }),
            });

            const result = await response.json().catch(() => null);

            if (!response.ok) {
                let msg = `HTTP ${response.status}`;
                if (typeof result?.error === 'string') {
                    msg = result.error;
                } else if (result?.error?.message) {
                    msg = result.error.message;
                }
                console.error('Server response:', result);
                throw new Error(msg);
            }

            // Yangi Gemini Interactions API javob formati:
            // { status: "completed", steps: [{ type: "model_output", content: [{ type: "text", text: "..." }] }] }
            if (result?.status === 'completed' && Array.isArray(result.steps)) {
                const modelStep = result.steps.find(s => s.type === 'model_output');
                const textBlock = modelStep?.content?.find(c => c.type === 'text');

                if (textBlock?.text) {
                    const aiData = JSON.parse(textBlock.text);

                    if (aiData.found && aiData.plateText) {
                        const analysis = parseUzbekPlate(aiData.plateText);
                        scanResults[index] = {
                            ...scanResults[index],
                            status: analysis.valid ? 'success' : 'warning',
                            plate: analysis.formatted,
                            type: analysis.type,
                            region: analysis.region,
                            raw: aiData.plateText,
                            parsed: analysis,
                        };
                    } else {
                        scanResults[index].status = 'notfound';
                        scanResults[index].plate = 'Topilmadi';
                    }
                } else {
                    scanResults[index].status = 'error';
                    scanResults[index].plate = 'Javob qaytmadi';
                }
            } else {
                console.error('Gemini interaction not completed:', result);
                scanResults[index].status = 'error';
                scanResults[index].plate = result?.errors?.[0]?.message || 'Javob qaytmadi';
            }
        } catch (error) {
            console.error('ALPR Engine Error:', error);
            scanResults[index].status = 'error';
            // Haqiqiy sabab ko'rinsin (avval har doim "Aloqada xatolik yuz berdi" deb yozardi)
            scanResults[index].plate = error.message || 'Aloqada xatolik yuz berdi';
        }

        renderResults();
    }

    function parseUzbekPlate(rawText) {
        let clean = String(rawText).toUpperCase().replace(/[^A-Z0-9]/g, '');

        if (clean.length >= 2) {
            let start = clean.substring(0, 2).replace(/O/g, '0').replace(/I/g, '1');
            clean = start + clean.substring(2);
        }

        let result = {
            valid: false,
            type: 'Nomalum',
            formatted: clean || 'XATOLIK',
            region: 'Nomalum',
            regionCode: '01',
            numberPart: clean,
        };

        if (!clean || clean.length < 8) return result;

        const physRegex = /^([0-9]{2})([A-HJ-Z])([0-9]{3})([A-HJ-Z]{2})$/;
        const legalRegex = /^([0-9]{2})([0-9]{3})([A-HJ-Z]{3})$/;

        if (physRegex.test(clean)) {
            const match = clean.match(physRegex);
            const reg = match[1];
            if (validRegions.includes(reg)) {
                result.valid = true;
                result.type = 'Jis. shaxs';
                result.region = getRegionName(reg);
                result.regionCode = match[1];
                result.numberPart = `${match[2]} ${match[3]} ${match[4]}`;
                result.formatted = `${match[1]} ${match[2]} ${match[3]} ${match[4]}`;
            }
        } else if (legalRegex.test(clean)) {
            const match = clean.match(legalRegex);
            const reg = match[1];
            if (validRegions.includes(reg)) {
                result.valid = true;
                result.type = 'Yur. shaxs';
                result.region = getRegionName(reg);
                result.regionCode = match[1];
                result.numberPart = `${match[2]} ${match[3]}`;
                result.formatted = `${match[1]} ${match[2]} ${match[3]}`;
            }
        }

        return result;
    }

    function getRegionName(code) {
        const map = {
            '01': 'Toshkent shahri', '10': 'Toshkent viloyati', '20': 'Sirdaryo',
            '25': 'Jizzax', '30': 'Samarqand', '40': 'Farg\'ona',
            '50': 'Namangan', '60': 'Andijon', '70': 'Qashqadaryo',
            '75': 'Surxondaryo', '80': 'Buxoro', '85': 'Navoiy',
            '90': 'Xorazm', '95': 'Qoraqalpog\'iston',
        };
        return `${code} - ${map[code] || 'Viloyat'}`;
    }

    function getStatusLabel(item) {
        if (item.status === 'processing' || item.status === 'queued') {
            const label = item.status === 'queued' ? 'Navbatda' : 'Tahlil...';
            return { html: `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700"><span class="loader"></span> ${label}</span>`, isLoading: true };
        }
        if (item.status === 'success') {
            return { html: `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-green-50 text-green-700">Aniqlandi</span>` };
        }
        if (item.status === 'warning') {
            return { html: `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700">Noodatiy</span>` };
        }
        return { html: `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-red-50 text-red-600">Xatolik</span>` };
    }

    function createPlatesManiaInformerHTML(item) {
        if (item.status === 'processing' || item.status === 'queued') {
            const label = item.status === 'queued' ? 'Navbatda...' : 'Aniqlanmoqda...';
            return `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700"><span class="loader"></span> ${label}</span>`;
        }

        if (item.status === 'error' || item.status === 'notfound' || !item.parsed || !item.parsed.valid) {
            return `<span class="px-3 py-1.5 rounded-lg text-xs font-mono font-bold bg-red-50 text-red-600 border border-red-200 break-words">${escapeHtml(item.plate)}</span>`;
        }

        const regionCode = escapeHtml(item.parsed.regionCode || '01');
        const numberPart = escapeHtml(item.parsed.numberPart || 'A 123 AA');

        return `
            <div class="uz-plate-informer">
                <div class="uz-plate-region">${regionCode}</div>
                <div class="uz-plate-number">${numberPart}</div>
                <div class="uz-plate-flag-box">
                    <svg class="w-5 h-3 rounded-[1px]" viewBox="0 0 50 25" aria-hidden="true">
                        <rect width="50" height="8" fill="#0099b5"/>
                        <rect y="8" width="50" height="1" fill="#ce1126"/>
                        <rect y="9" width="50" height="7" fill="#ffffff"/>
                        <rect y="16" width="50" height="1" fill="#ce1126"/>
                        <rect y="17" width="50" height="8" fill="#1eb53a"/>
                        <circle cx="7" cy="4" r="2.5" fill="#ffffff"/>
                        <circle cx="8.3" cy="4" r="2" fill="#0099b5"/>
                        <circle cx="13" cy="2" r="0.6" fill="#ffffff"/>
                        <circle cx="15" cy="2" r="0.6" fill="#ffffff"/>
                        <circle cx="17" cy="2" r="0.6" fill="#ffffff"/>
                    </svg>
                    <span class="uz-plate-uz">UZ</span>
                </div>
            </div>
        `;
    }

    // ---------- Natijalarni chizish: desktop jadval + mobil kartalar ----------
    function renderResults() {
        renderTable();
        renderCards();

        const processedCount = scanResults.filter(i => i.status !== 'processing' && i.status !== 'queued').length;
        statsCounter.innerText = `${scanResults.length} dan ${processedCount} ta rasm aniqlandi`;
    }

    function renderTable() {
        const rows = [];
        scanResults.forEach((item, index) => {
            const informerHTML = createPlatesManiaInformerHTML(item);
            const canCopy = item.status === 'success' || item.status === 'warning';

            rows.push(`
                <tr class="hover:bg-gray-50/50 transition-colors">
                    <td class="p-4">
                        <div class="relative group w-16 h-12">
                            <img src="${item.image}"
                                 data-action="zoom" data-index="${index}"
                                 class="w-16 h-12 object-cover rounded-lg border border-gray-200 cursor-pointer transition-transform duration-200 group-hover:scale-105 group-hover:shadow-md"
                                 alt="${escapeHtml(item.file)} prevyusi"
                                 title="Rasmni kattalashtirish uchun bosing" />
                            <div data-action="zoom" data-index="${index}" class="absolute inset-0 bg-black/30 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center cursor-pointer pointer-events-none">
                                <i class="fa-solid fa-magnifying-glass-plus text-white text-xs" aria-hidden="true"></i>
                            </div>
                        </div>
                    </td>
                    <td class="p-4">${getStatusLabel(item).html}</td>
                    <td class="p-4">${informerHTML}</td>
                    <td class="p-4 text-gray-600 font-medium">${escapeHtml(item.type)}</td>
                    <td class="p-4 text-gray-600 text-xs">${escapeHtml(item.region)}</td>
                    <td class="p-4 text-right">
                        <button data-action="copy" data-index="${index}" ${canCopy ? '' : 'disabled'}
                            class="action-btn touch-target p-2 text-gray-400 hover:text-blue-600 transition-colors rounded-lg hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed"
                            title="Avtoraqamni nusxalash" aria-label="Avtoraqamni nusxalash">
                            <i class="fa-regular fa-copy text-base" aria-hidden="true"></i>
                        </button>
                    </td>
                </tr>
            `);
        });
        resultsTbody.innerHTML = rows.join('');
    }

    function renderCards() {
        const cards = [];
        scanResults.forEach((item, index) => {
            const informerHTML = createPlatesManiaInformerHTML(item);
            const canCopy = item.status === 'success' || item.status === 'warning';

            cards.push(`
                <div class="p-4 flex gap-3">
                    <div class="relative shrink-0 w-20 h-16">
                        <img src="${item.image}"
                             data-action="zoom" data-index="${index}"
                             class="w-20 h-16 object-cover rounded-lg border border-gray-200"
                             alt="${escapeHtml(item.file)} prevyusi" />
                    </div>
                    <div class="flex-1 min-w-0 space-y-2">
                        <div class="flex items-center justify-between gap-2">
                            ${getStatusLabel(item).html}
                            <button data-action="copy" data-index="${index}" ${canCopy ? '' : 'disabled'}
                                class="action-btn touch-target p-2 -mr-2 text-gray-400 active:text-blue-600 transition-colors rounded-lg disabled:opacity-30 disabled:cursor-not-allowed"
                                aria-label="Avtoraqamni nusxalash">
                                <i class="fa-regular fa-copy text-base" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="overflow-x-auto">${informerHTML}</div>
                        <div class="text-xs text-gray-500 flex flex-wrap gap-x-3">
                            <span>${escapeHtml(item.type)}</span>
                            <span>${escapeHtml(item.region)}</span>
                        </div>
                    </div>
                </div>
            `);
        });
        resultsCards.innerHTML = cards.join('');
    }

    // Event delegation ikkala konteyner uchun ham
    function handleResultClick(e) {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        const index = Number(target.dataset.index);
        const item = scanResults[index];
        if (!item) return;

        if (target.dataset.action === 'zoom') {
            openImageModal(item.image);
        } else if (target.dataset.action === 'copy') {
            copyToClipboard(item.plate);
        }
    }
    resultsTbody.addEventListener('click', handleResultClick);
    resultsCards.addEventListener('click', handleResultClick);

    // ---------- Rasm modal: zoom/pan (sichqoncha + touch/pinch) ----------
    let currentZoom = 1;
    let isDragging = false;
    let startX = 0, startY = 0;
    let translateX = 0, translateY = 0;

    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    const modalWrapper = document.getElementById('modal-img-wrapper');
    const zoomText = document.getElementById('zoom-level-text');
    const zoomTextMobile = document.getElementById('zoom-level-text-mobile');

    function openImageModal(imgSrc) {
        modalImg.src = imgSrc;
        resetZoom();
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeImageModal() {
        modal.classList.add('opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            modalImg.src = '';
        }, 300);
    }

    function handleModalBackdropClick(e) {
        if (e.target === e.currentTarget) closeImageModal();
    }

    function updateTransform() {
        modalWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
        const pct = `${Math.round(currentZoom * 100)}%`;
        zoomText.innerText = pct;
        zoomTextMobile.innerText = pct;
    }

    function changeZoom(delta) {
        currentZoom = Math.min(Math.max(0.5, currentZoom + delta), 4);
        if (currentZoom === 1) {
            translateX = 0;
            translateY = 0;
        }
        updateTransform();
    }

    function resetZoom() {
        currentZoom = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();
    }

    modal.addEventListener('wheel', (e) => {
        if (modal.classList.contains('hidden')) return;
        e.preventDefault();
        changeZoom(e.deltaY < 0 ? 0.2 : -0.2);
    }, { passive: false });

    modalWrapper.addEventListener('mousedown', (e) => {
        if (currentZoom <= 1) return;
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    let lastTouchDistance = null;

    modalWrapper.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1 && currentZoom > 1) {
            isDragging = true;
            startX = e.touches[0].clientX - translateX;
            startY = e.touches[0].clientY - translateY;
        } else if (e.touches.length === 2) {
            lastTouchDistance = getTouchDistance(e.touches);
        }
    }, { passive: true });

    modalWrapper.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
            translateX = e.touches[0].clientX - startX;
            translateY = e.touches[0].clientY - startY;
            updateTransform();
        } else if (e.touches.length === 2 && lastTouchDistance) {
            const newDistance = getTouchDistance(e.touches);
            const delta = (newDistance - lastTouchDistance) / 200;
            changeZoom(delta);
            lastTouchDistance = newDistance;
        }
    }, { passive: true });

    modalWrapper.addEventListener('touchend', () => {
        isDragging = false;
        lastTouchDistance = null;
    });

    function getTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeImageModal();
    });

    // ---------- Toast va nusxalash ----------
    function showToast(message) {
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toast-msg');
        msg.innerText = message;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    async function copyToClipboard(text) {
        if (!text || text === '---') return;
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                const dummy = document.createElement('textarea');
                dummy.value = text;
                dummy.style.position = 'fixed';
                dummy.style.opacity = '0';
                document.body.appendChild(dummy);
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
            }
            showToast(`${text} davlat raqami nusxalandi!`);
        } catch (err) {
            console.error('Clipboard error:', err);
            showToast('Nusxalashda xatolik yuz berdi');
        }
    }

    function clearAll() {
        scanResults = [];
        dashboard.classList.add('hidden');
        resultsTbody.innerHTML = '';
        resultsCards.innerHTML = '';
    }
</script>
<script src="auto-menu.js"></script></body>
</html>
