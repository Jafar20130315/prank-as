<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D qo'l boshqaruvlik shakl</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #video-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 2;
            transform: scaleX(-1); /* Mirror the preview */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #input-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.9);
            z-index: 2;
            pointer-events: none;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .instruction {
            font-size: 0.9rem;
            margin-bottom: 4px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .key {
            font-weight: bold;
            color: #4facfe;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 30px;
            z-index: 10;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="video-container">
        <video id="input-video" playsinline></video>
    </div>

    <div id="ui-layer">
        <h1>Qo'llanma</h1>
        <div class="instruction"><span class="key">☝️ Barmoq tepaga</span>Keyingi shakl</div>
        <div class="instruction"><span class="key">🤏 Qo'lni qisish</span> Kattalashtirish/Kichraytirish</div>
        <div class="instruction"><span class="key">✊ Musht</span> Ichiga kirish</div>
        <div class="instruction"><span class="key">👋 Kaftni qimirlatish</span> Aylantirish</div>
        <div class="instruction" id="current-shape" style="margin-top: 10px; color: #00f260;">Shakl: Sphere</div>
    </div>

    <div id="status">
        <div class="loading-spinner"></div><br>
        Iltimos kuting, AI yuklanmoqda, bunga 20 soniyadan ko'p vaqt ketadi.
    </div>

    <script>
        // --- Configuration ---
        const CONFIG = {
            particleCount: 12000,
            particleSize: 0.15,
            transitionSpeed: 0.05,
            colorSpeed: 0.001,
            cameraZ: 30
        };

        // --- State Management ---
        const state = {
            currentShapeIndex: 0,
            isGestureLocked: false, // Prevents rapid switching
            scale: 1.0,
            implode: false,
            rotation: { x: 0, y: 0 },
            handDetected: false
        };

        const shapes = ['Aylana', 'Yurak', 'Kub', 'Saturn', 'Spiral'];

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = CONFIG.cameraZ;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- Particle System ---
        // We use BufferGeometry for performance with thousands of particles
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(CONFIG.particleCount * 3);
        const colors = new Float32Array(CONFIG.particleCount * 3);
        const targetPositions = new Float32Array(CONFIG.particleCount * 3);
        
        // Initial Positions (Random Cloud)
        for (let i = 0; i < CONFIG.particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
            
            colors[i * 3] = 1;
            colors[i * 3 + 1] = 1;
            colors[i * 3 + 2] = 1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Create a custom texture for the particle
        const getTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        };

        const material = new THREE.PointsMaterial({
            size: CONFIG.particleSize,
            vertexColors: true,
            map: getTexture(),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // --- Shape Generators ---
        // Each function fills the 'targetPositions' array with coordinates for a specific shape

        function generateSphere() {
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const radius = 10;
                const phi = Math.acos(-1 + (2 * i) / CONFIG.particleCount);
                const theta = Math.sqrt(CONFIG.particleCount * Math.PI) * phi;
                
                targetPositions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
                targetPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
                targetPositions[i * 3 + 2] = radius * Math.cos(phi);
            }
        }

        function generateHeart() {
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const phi = Math.random() * Math.PI * 2;
                const theta = Math.random() * Math.PI;
                // Basic heart distribution approx
                const t = phi; 
                // Heart curve equation
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                // Extrude in Z
                const z = (Math.random() - 0.5) * 10;

                const scale = 0.5;
                targetPositions[i * 3] = x * scale;
                targetPositions[i * 3 + 1] = y * scale + 2; // Offset Y
                targetPositions[i * 3 + 2] = z;
            }
        }

        function generateCube() {
            const side = 14;
            const half = side / 2;
            for (let i = 0; i < CONFIG.particleCount; i++) {
                targetPositions[i * 3] = (Math.random() - 0.5) * side;
                targetPositions[i * 3 + 1] = (Math.random() - 0.5) * side;
                targetPositions[i * 3 + 2] = (Math.random() - 0.5) * side;

                // Force to surface for sharper look (optional)
                const face = Math.floor(Math.random() * 6);
                if(face === 0) targetPositions[i * 3] = half;
                if(face === 1) targetPositions[i * 3] = -half;
                if(face === 2) targetPositions[i * 3 + 1] = half;
                if(face === 3) targetPositions[i * 3 + 1] = -half;
                if(face === 4) targetPositions[i * 3 + 2] = half;
                if(face === 5) targetPositions[i * 3 + 2] = -half;
            }
        }

        function generateSaturn() {
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const ratio = i / CONFIG.particleCount;
                if (ratio < 0.7) {
                    // Planet
                    const radius = 6;
                    const phi = Math.acos(-1 + (2 * i) / (CONFIG.particleCount * 0.7));
                    const theta = Math.sqrt((CONFIG.particleCount*0.7) * Math.PI) * phi;
                    targetPositions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
                    targetPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
                    targetPositions[i * 3 + 2] = radius * Math.cos(phi);
                } else {
                    // Ring
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 9 + Math.random() * 6;
                    targetPositions[i * 3] = Math.cos(angle) * dist;
                    targetPositions[i * 3 + 1] = (Math.random() - 0.5) * 0.5; // Flattened
                    targetPositions[i * 3 + 2] = Math.sin(angle) * dist;
                    
                    // Tilt the ring
                    const x = targetPositions[i * 3];
                    const y = targetPositions[i * 3 + 1];
                    const tilt = 0.4;
                    targetPositions[i * 3] = x * Math.cos(tilt) - y * Math.sin(tilt);
                    targetPositions[i * 3 + 1] = x * Math.sin(tilt) + y * Math.cos(tilt);
                }
            }
        }

        function generateSpiral() {
             for (let i = 0; i < CONFIG.particleCount; i++) {
                const t = i / CONFIG.particleCount;
                const angle = t * Math.PI * 20;
                const radius = t * 15;
                
                targetPositions[i * 3] = Math.cos(angle) * radius;
                targetPositions[i * 3 + 1] = (Math.random() - 0.5) * 5; // Thickness
                targetPositions[i * 3 + 2] = Math.sin(angle) * radius;
            }
        }

        const generators = [generateSphere, generateHeart, generateCube, generateSaturn, generateSpiral];

        function switchShape(index) {
            if (index >= generators.length) index = 0;
            state.currentShapeIndex = index;
            generators[index](); // Regenerate target positions
            
            // Update UI
            document.getElementById('current-shape').innerText = `Shape: ${shapes[index]}`;
            
            // Update colors based on shape
            updateColorsForShape(index);
        }

        function updateColorsForShape(index) {
            const colorsAttr = geometry.attributes.color;
            const c1 = new THREE.Color();
            const c2 = new THREE.Color();

            // Define palettes
            if (index === 0) { c1.setHex(0x00f260); c2.setHex(0x0575e6); } // Sphere (Green/Blue)
            else if (index === 1) { c1.setHex(0xff512f); c2.setHex(0xdd2476); } // Heart (Red/Pink)
            else if (index === 2) { c1.setHex(0x1CB5E0); c2.setHex(0x000046); } // Cube (Ice)
            else if (index === 3) { c1.setHex(0xFDC830); c2.setHex(0xF37335); } // Saturn (Orange/Gold)
            else { c1.setHex(0x8E2DE2); c2.setHex(0x4A00E0); } // Spiral (Purple)

            for (let i = 0; i < CONFIG.particleCount; i++) {
                const ratio = i / CONFIG.particleCount;
                // Simple gradient mixing
                const r = c1.r * (1-ratio) + c2.r * ratio;
                const g = c1.g * (1-ratio) + c2.g * ratio;
                const b = c1.b * (1-ratio) + c2.b * ratio;
                
                colors[i * 3] = r;
                colors[i * 3 + 1] = g;
                colors[i * 3 + 2] = b;
            }
            colorsAttr.needsUpdate = true;
        }

        // Initialize first shape
        switchShape(0);

        // --- Hand Tracking & Interaction Logic ---
        
        const videoElement = document.getElementById('input-video');
        const statusElement = document.getElementById('status');

        function onResults(results) {
            if (statusElement.style.display !== 'none') {
                statusElement.style.display = 'none';
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                state.handDetected = true;
                const landmarks = results.multiHandLandmarks[0];

                // 1. Detect Index Finger Up (for shape switching)
                const isIndexUp = landmarks[8].y < landmarks[6].y; // Tip above dip
                const isMiddleDown = landmarks[12].y > landmarks[10].y;
                const isRingDown = landmarks[16].y > landmarks[14].y;
                const isPinkyDown = landmarks[20].y > landmarks[18].y;
                
                // Debounce gesture
                if (isIndexUp && isMiddleDown && isRingDown && isPinkyDown) {
                    if (!state.isGestureLocked) {
                        switchShape((state.currentShapeIndex + 1) % shapes.length);
                        state.isGestureLocked = true;
                        setTimeout(() => state.isGestureLocked = false, 1000); // 1s delay
                    }
                }

                // 2. Expansion (Pinch distance between Thumb tip [4] and Index tip [8])
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const distance = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                
                // Map distance (approx 0.05 to 0.4) to scale (0.5 to 3.0)
                const targetScale = Math.max(0.5, Math.min(3.0, distance * 8));
                // Smoothly lerp scale
                state.scale += (targetScale - state.scale) * 0.1;

                // 3. Implosion (Fist)
                // If all fingers are curled down
                const isFist = !isIndexUp && isMiddleDown && isRingDown && isPinkyDown;
                state.implode = isFist;

                // 4. Rotation (Hand position)
                // Center of hand (Palm [0])
                const handX = landmarks[0].x; // 0 to 1
                const handY = landmarks[0].y; // 0 to 1
                
                // Map to rotation angles
                const targetRotX = (handY - 0.5) * 2; // -1 to 1
                const targetRotY = (handX - 0.5) * 2; 

                state.rotation.x = targetRotX;
                state.rotation.y = targetRotY;

            } else {
                state.handDetected = false;
                // Reset slightly if no hand
                state.scale += (1.0 - state.scale) * 0.05;
                state.implode = false;
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // Custom Camera Loop to handle potential errors better than CameraUtils
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
                videoElement.srcObject = stream;
                videoElement.play();
                
                const cameraLoop = async () => {
                    if (videoElement.readyState === 4) { // ENOUGH_DATA
                        await hands.send({image: videoElement});
                    }
                    requestAnimationFrame(cameraLoop);
                };
                cameraLoop();

            } catch (err) {
                console.error(err);
                statusElement.innerText = "Iltimos kamerani oching";
            }
        }

        startCamera();

        // --- Animation Loop ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            const posAttr = geometry.attributes.position;
            const currentPos = posAttr.array;

            // Rotate entire system based on hand or time
            if (state.handDetected) {
                particleSystem.rotation.x += (state.rotation.x - particleSystem.rotation.x) * 0.1;
                particleSystem.rotation.y += (state.rotation.y - particleSystem.rotation.y) * 0.1;
            } else {
                particleSystem.rotation.y += 0.002; // Idle rotation
            }

            // Update individual particles
            for (let i = 0; i < CONFIG.particleCount; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                let tx = targetPositions[ix];
                let ty = targetPositions[iy];
                let tz = targetPositions[iz];

                // Apply Scaling
                tx *= state.scale;
                ty *= state.scale;
                tz *= state.scale;

                // Apply Implosion (move towards center 0,0,0)
                if (state.implode) {
                    tx *= 0.1;
                    ty *= 0.1;
                    tz *= 0.1;
                }

                // Noise/Wobble
                tx += Math.sin(time + iy) * 0.05;
                ty += Math.cos(time + ix) * 0.05;

                // Lerp towards target
                currentPos[ix] += (tx - currentPos[ix]) * CONFIG.transitionSpeed;
                currentPos[iy] += (ty - currentPos[iy]) * CONFIG.transitionSpeed;
                currentPos[iz] += (tz - currentPos[iz]) * CONFIG.transitionSpeed;
            }

            posAttr.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
<script src="/auto-menu.js"></script></body>
</html>
