<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Disclaimer | Prank-as</title>
  <style>
    :root{
      --bg:#111;
      --card:#0f1720;
      --accent:#10b981;
      --text:#e6eef3;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: 'Poppins', system-ui, Arial, sans-serif;
      background: linear-gradient(270deg,#1f1f1f,#111,#222,#333);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{
      width:100%;
      max-width:820px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));
      border-radius:12px;
      padding:28px;
      box-shadow:0 8px 30px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.04);
    }
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    header a{color:var(--text);text-decoration:none;font-weight:600}
    h1{font-size:22px;color:var(--accent);margin-bottom:12px}
    p{line-height:1.6;color:rgba(230,238,243,0.95)}
    .note{
      margin-top:18px;
      padding:12px 14px;
      background:rgba(255,255,255,0.02);
      border-radius:8px;
      color:rgba(230,238,243,0.9);
      font-size:14px;
    }
    footer{margin-top:20px;text-align:center;color:rgba(230,238,243,0.65);font-size:13px}
    @media (max-width:520px){
      .wrap{padding:18px}
      h1{font-size:20px}
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <a href="/">← Back</a>
      <div>Prank-as</div>
    </header>

    <h1>Disclaimer</h1>

    <p>
      This website is provided for general informational and entertainment purposes only.
      The content on this site is not intended as professional advice. Use the site at your own discretion.
    </p>
    <footer>© 2025 Prank-as</footer>
  </div>
</body>
</html>
