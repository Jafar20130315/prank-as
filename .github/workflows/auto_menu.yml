name: Auto Inject Menu

on:
  push:
    branches:
      - main  # или master, если у тебя так называется ветка

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run injection script
        run: python inject_menu.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Auto-injected menu script"
          file_pattern: "*.html"
