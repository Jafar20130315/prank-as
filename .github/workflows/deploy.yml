/**
 * Рекурсивный обход директории для поиска всех HTML файлов
 */
function walkDir(dir, callback) {
    fs.readdirSync(dir).forEach(f => {
        let dirPath = path.join(dir, f);
        let isDirectory = fs.statSync(dirPath).isDirectory();
        
        // Пропускаем системные папки и репозиторий
        if (f === 'node_modules' || f === '.git' || f === '.github') return;
        
        if (isDirectory) {
            walkDir(dirPath, callback);
        } else {
            callback(dirPath);
        }
    });
}

/**
 * Основная логика впрыска скрипта
 */
console.log('--- Начало процесса проверки файлов ---');

walkDir('./', (filePath) => {
    if (path.extname(filePath) === '.html') {
        let content = fs.readFileSync(filePath, 'utf8');
        
        // Проверяем, не вставлен ли уже скрипт
        if (!content.includes('<!-- Tracking Script Start -->')) {
            if (content.includes('</body>')) {
                console.log(`[НОВЫЙ ФАЙЛ] Вставка скрипта в: ${filePath}`);
                const updatedContent = content.replace('</body>', `${trackingScript}\n</body>`);
                fs.writeFileSync(filePath, updatedContent, 'utf8');
            } else {
                console.warn(`[ПРЕДУПРЕЖДЕНИЕ] Тег </body> не найден в файле: ${filePath}. Пропускаю.`);
            }
        } else {
            // Если скрипт уже есть, мы можем его обновить (опционально)
            // В данном случае просто сообщаем, что файл уже защищен
            console.log(`[OK] Скрипт уже присутствует в: ${filePath}`);
        }
    }
});

console.log('--- Процесс завершен ---');
