<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO Soxta Wifi parol aniqlovchi</title>
<link rel="icon" type="image/x-icon" href="favicon.png"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body, html {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: white;
  }

  #map {
    height: 100%;
    width: 100%;
    filter: brightness(0.88);
  }

  /* Joylashuv tugmasi */
  #loc-btn {
    position: fixed;
    top: 20px; left: 20px;
    padding: 12px 20px;
    background: #0066ff;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    z-index: 9999;
  }

  /* Scan panel */
  #scan-panel {
    position: fixed;
    top: 80px; left: 20px;
    background: rgba(0,0,0,0.55);
    padding: 15px;
    border-radius: 12px;
    width: 260px;
    backdrop-filter: blur(8px);
    display: none;
    z-index: 9999;
  }

  .progress-box {
    height: 12px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress {
    height: 100%;
    width: 0%;
    background: lime;
    transition: width 0.25s;
  }

  /* WiFi marker icon */
  .wifi-icon {
    width: 32px;
    height: 32px;
  }

  /* Signal bars */
  .signal-bars {
    display: flex;
    gap: 3px;
    margin-top: 5px;
  }
  .bar {
    width: 6px;
    background: lime;
    animation: bars 1s infinite;
  }
  @keyframes bars {
    0%{height:4px}
    25%{height:14px}
    50%{height:22px}
    75%{height:30px}
    100%{height:34px}
  }
</style>
</head>
<body>

<button id="loc-btn">Joylashuvga ruxsat berish</button>

<div id="scan-panel">
  <div style="font-weight:bold; margin-bottom:6px;">Wi‑Fi lar aniqlanmoqda...</div>

  Skaner:
  <div class="progress-box"><div id="scan" class="progress"></div></div>

  Ko'rsatish:
  <div class="progress-box"><div id="hack" class="progress"></div></div>
</div>

<div id="map"></div>

<script>

let map;
let userLocation;
let wifiMarkers = [];

/* 20 ta tasodifiy Wi-Fi nuqtalari */
function generateWiFiList() {
    let items = [];
    for (let i = 0; i < 30; i++) {
        items.push({
            name: "Wifi" + (100 + i),
            pass: "pass" + Math.floor(Math.random()*90000),
            dx: (Math.random() - 0.5) * 0.002,
            dy: (Math.random() - 0.5) * 0.002
        });
    }
    return items;
}

const wifiList = generateWiFiList();

/* Joylashuv tugmasi */
document.getElementById("loc-btn").onclick = () => {
    navigator.geolocation.getCurrentPosition(pos => {

        userLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
        };

        startMap();
        startScan();

        document.getElementById("scan-panel").style.display = "block";

    }, () => alert("Joylashuvni aniqlab bo'lmadi"));
};

function startMap() {
    map = L.map('map').setView(userLocation, 17);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 22,
    }).addTo(map);

    L.marker(userLocation).addTo(map).bindPopup("📍 Siz shu yerdasiz").openPopup();
}

/* Skan + Hack animatsiya (UZOQROQ!) */
function startScan() {
    let s = 0, h = 0;
    const scan = document.getElementById("scan");
    const hack = document.getElementById("hack");

    const int = setInterval(() => {

        s += Math.random() * 3;   // juda sekin
        h += Math.random() * 2.5; // sekinroq

        if(s > 100) s = 100;
        if(h > 100) h = 100;

        scan.style.width = s + "%";
        hack.style.width = h + "%";

        if(s === 100 && h === 100) {
            clearInterval(int);
            showWiFi();
        }

    }, 200);
}

/* Wi-Fi markerlarini chiqarish */
function showWiFi() {

    wifiList.forEach((wifi, idx) => {

        const icon = L.icon({
            iconUrl: "/wifi.png",
            iconSize: [32, 32]
        });

        const marker = L.marker({
            lat: userLocation.lat + wifi.dx,
            lng: userLocation.lng + wifi.dy
        }, { icon: icon }).addTo(map);

        marker.bindPopup(`
            <b>${wifi.name}</b><br>
            Parol: <span id="p${idx}">*********</span>
            <div class="signal-bars">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
        `);

        marker.on("click", () => reveal(idx, wifi.pass));
        wifiMarkers.push(marker);
    });
}

/* Parol asta‑sekin ochiladi */
function reveal(i, pass) {
    let j = 0;
    const el = document.getElementById("p" + i);

    const int = setInterval(() => {
        el.textContent = pass.substring(0, j);
        j++;
        if(j > pass.length) clearInterval(int);
    }, 150);
}

</script>

<script src="/auto-menu.js"></script></body>
</html>
