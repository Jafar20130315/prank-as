<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avtomobil Simulyatori</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        /* Interfeys */
        #ui-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .controls-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%; /* Hududni biroz kattalashtirdik */
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px 40px; /* Chetlaridan masofa */
            box-sizing: border-box;
        }

        /* Rul */
        .steering-wheel-zone {
            width: 200px;
            height: 200px;
            pointer-events: auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .steering-wheel {
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cfilter id='shadow'%3E%3CfeDropShadow dx='0' dy='2' stdDeviation='3' flood-opacity='0.5'/%3E%3C/filter%3E%3ClinearGradient id='grad1' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23333;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23111;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='url(%23grad1)' stroke-width='8' filter='url(%23shadow)'/%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%23444' stroke-width='2' stroke-dasharray='2 4'/%3E%3Cpath d='M50 50 L10 50 M50 50 L90 50 M50 50 L50 94' stroke='%23222' stroke-width='12' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23111' stroke='%23555' stroke-width='2'/%3E%3C/svg%3E");
            background-size: contain;
            background-repeat: no-repeat;
            will-change: transform;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Signal tugmasi */
        .horn-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #333 0%, #000 100%);
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            pointer-events: auto; /* Rul ichida bo'lsa ham bosilishi kerak */
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
        }
        .horn-btn:active {
            background: #222;
            transform: scale(0.95);
        }

        /* Pedallar */
        .pedals-zone {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            padding-bottom: 20px;
        }

        .pedal {
            width: 90px;
            height: 160px;
            border-radius: 12px;
            background: linear-gradient(180deg, #333 0%, #1a1a1a 100%);
            border: 2px solid #555;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            transition: transform 0.1s, background 0.1s;
        }
        
        .pedal::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15px;
            border-radius: 0 0 10px 10px;
            opacity: 0.7;
        }

        .pedal.gas::after { background-color: #4ade80; box-shadow: 0 0 15px #4ade80; }
        .pedal.brake::after { background-color: #f87171; box-shadow: 0 0 15px #f87171; }
        
        .pedal:active, .pedal.active {
            transform: scale(0.92) translateY(5px);
            background: #000;
            border-color: #777;
        }

        .pedal-icon {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            opacity: 0.5;
        }

        /* Mashina o'rni */
        #car-placeholder {
            position: absolute;
            top: 55%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px; /* Kattalashtirdik */
            height: 200px;
            border: 3px dashed rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        /* Statistika */
        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
        }

        .hud-right-group {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .icon-btn, .engine-btn {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ddd;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 16px;
            pointer-events: auto;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .icon-btn:active, .engine-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }

        .speed-box {
            text-align: right;
            color: white;
            font-family: 'Segoe UI', monospace;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .speed-val { font-size: 42px; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); line-height: 1; }
        .label { font-size: 12px; color: #aaa; letter-spacing: 1px; }

        /* Start ekrani */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .btn-start {
            margin-top: 30px;
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #000;
            font-size: 22px;
            font-weight: 800;
            padding: 18px 50px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.4);
            animation: bounce 2s infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="road-canvas"></canvas>
        <div id="car-placeholder">
            <div>Mashinani<br>shu yerga<br>qo'ying</div>
        </div>

        <div id="ui-layer">
            <div class="hud-top">
                <button class="engine-btn" id="engine-select-btn">🔊 Dvigatel: Sport</button>
                
                <div class="hud-right-group">
                    <button class="icon-btn" id="fs-btn">
                        <svg id="fs-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                        </svg>
                    </button>
                    <div class="speed-box">
                        <div class="speed-val" id="speed-display">0</div>
                        <div class="label">KM/S</div>
                    </div>
                </div>
            </div>

            <div class="controls-area">
                <div class="steering-wheel-zone" id="wheel-zone">
                    <div class="steering-wheel" id="wheel">
                        <div class="horn-btn" id="horn-btn">🎺</div>
                    </div>
                </div>

                <div class="pedals-zone">
                    <div class="pedal brake" id="btn-brake">
                        <span class="pedal-icon">🛑</span>
                    </div>
                    <div class="pedal gas" id="btn-gas">
                        <span class="pedal-icon">🚀</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="start-screen">
            <h1 class="text-4xl font-bold text-yellow-400 mb-4">Katta Yo'l</h1>
            <p class="text-gray-300 text-lg max-w-md mb-2">
                O'yinchoq mashinangizni ekran o'rtasidagi ramkaga qo'ying.
            </p>
            <p class="text-gray-500 text-sm max-w-md">
                Gaz (W/↑), Tormoz (S/↓), Rul (A/D/←/→) va Signal (Space) yordamida haqiqiy haydovchidek his eting.
            </p>
            <button class="btn-start" id="start-btn">Olg'a!</button>
        </div>
    </div>

    <script>
        /**
         * AUDIO TIZIMI
         */
        const AudioEngine = {
            ctx: null,
            masterGain: null,
            
            // Dvigatel
            engineOsc: null,
            engineOsc2: null, 
            engineGain: null,
            
            // Shovqin (drift/yo'l)
            noiseNode: null,
            noiseGain: null,
            
            // Tormoz (Screech)
            brakeOsc: null,      
            brakeGain: null,
            brakeFilter: null,

            // Signal (Horn)
            hornOsc1: null,
            hornOsc2: null,
            hornGain: null,

            currentType: 0,
            
            types: [
                { name: "Sport", type1: 'sawtooth', type2: 'square', baseFreq: 60, mult: 2.2, detune: 5 },
                { name: "Yuk mashina", type1: 'sawtooth', type2: 'sawtooth', baseFreq: 30, mult: 0.8, detune: 10 },
                { name: "F1", type1: 'sawtooth', type2: 'triangle', baseFreq: 110, mult: 4.5, detune: 4 },
                { name: "Elektro", type1: 'sine', type2: 'triangle', baseFreq: 150, mult: 3.0, detune: 0 }
            ],

            init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.5;
                this.masterGain.connect(this.ctx.destination);

                this.engineGain = this.ctx.createGain();
                this.engineGain.connect(this.masterGain);

                this.setupOscillators();
                this.setupNoise();
                this.setupBrake();
                this.setupHorn();
            },

            setupOscillators() {
                if (this.engineOsc) this.engineOsc.stop();
                if (this.engineOsc2) this.engineOsc2.stop();

                const preset = this.types[this.currentType];

                this.engineOsc = this.ctx.createOscillator();
                this.engineOsc.type = preset.type1;
                this.engineOsc.frequency.value = preset.baseFreq;

                this.engineOsc2 = this.ctx.createOscillator();
                this.engineOsc2.type = preset.type2;
                this.engineOsc2.frequency.value = preset.baseFreq;
                this.engineOsc2.detune.value = preset.detune; 

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;

                this.engineOsc.connect(filter);
                this.engineOsc2.connect(filter);
                filter.connect(this.engineGain);

                this.engineOsc.start();
                this.engineOsc2.start();
            },

            setupNoise() {
                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                this.noiseNode = this.ctx.createBufferSource();
                this.noiseNode.buffer = buffer;
                this.noiseNode.loop = true;

                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = 800;
                
                this.noiseGain = this.ctx.createGain();
                this.noiseGain.gain.value = 0;

                this.noiseNode.connect(noiseFilter);
                noiseFilter.connect(this.noiseGain);
                this.noiseGain.connect(this.masterGain);
                this.noiseNode.start();
            },

            setupBrake() {
                // Realistik tormoz ovozi uchun shovqin va yuqori chastotali ovoz aralashmasi
                this.brakeGain = this.ctx.createGain();
                this.brakeGain.gain.value = 0;
                this.brakeGain.connect(this.masterGain);

                this.brakeOsc = this.ctx.createOscillator();
                this.brakeOsc.type = 'sawtooth'; 
                this.brakeOsc.frequency.value = 800; // Asosiy chiyillash
                
                // Bandpass filtri orqali o'tkazamiz
                this.brakeFilter = this.ctx.createBiquadFilter();
                this.brakeFilter.type = 'bandpass';
                this.brakeFilter.Q.value = 1; 
                this.brakeFilter.frequency.value = 1000;
                
                this.brakeOsc.connect(this.brakeFilter);
                this.brakeFilter.connect(this.brakeGain);
                this.brakeOsc.start();
            },

            setupHorn() {
                this.hornGain = this.ctx.createGain();
                this.hornGain.gain.value = 0;
                this.hornGain.connect(this.masterGain);

                this.hornOsc1 = this.ctx.createOscillator();
                this.hornOsc1.type = 'sawtooth';
                this.hornOsc1.frequency.value = 370; // F#4
                this.hornOsc1.connect(this.hornGain);
                this.hornOsc1.start();

                this.hornOsc2 = this.ctx.createOscillator();
                this.hornOsc2.type = 'sawtooth';
                this.hornOsc2.frequency.value = 466; // A#4
                this.hornOsc2.connect(this.hornGain);
                this.hornOsc2.start();
            },

            playHorn() {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                this.hornGain.gain.cancelScheduledValues(now);
                this.hornGain.gain.setValueAtTime(0.6, now);
            },

            stopHorn() {
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                this.hornGain.gain.cancelScheduledValues(now);
                this.hornGain.gain.linearRampToValueAtTime(0, now + 0.1);
            },

            cycleType() {
                this.currentType = (this.currentType + 1) % this.types.length;
                if (this.ctx) this.setupOscillators();
                return this.types[this.currentType].name;
            },

            update(speedRatio, driftFactor, isBraking) {
                if (!this.ctx) return;
                
                const preset = this.types[this.currentType];
                const pitch = preset.baseFreq + (speedRatio * 400 * (preset.mult / 2));
                
                this.engineOsc.frequency.setTargetAtTime(pitch, this.ctx.currentTime, 0.1);
                this.engineOsc2.frequency.setTargetAtTime(pitch * 1.01, this.ctx.currentTime, 0.1);

                const vol = 0.2 + (speedRatio * 0.4);
                this.engineGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.1);
                
                // Drift ovozi
                this.noiseGain.gain.setTargetAtTime(driftFactor * 0.5, this.ctx.currentTime, 0.05);

                // Tormoz logikasi (Realistik)
                if (isBraking && speedRatio > 0.05) {
                    const brakeIntencity = speedRatio * 0.6;
                    // Ovoz balandligi
                    this.brakeGain.gain.setTargetAtTime(brakeIntencity, this.ctx.currentTime, 0.05);
                    // Chastota pasayib boradi (mashina to'xtayotganda)
                    this.brakeOsc.frequency.setTargetAtTime(600 + (speedRatio * 400), this.ctx.currentTime, 0.1);
                    // Modulyatsiya effekti
                    this.brakeFilter.frequency.setValueAtTime(800 + Math.random() * 200, this.ctx.currentTime);
                } else {
                    this.brakeGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
                }
            }
        };

        /**
         * O'YIN LOGIKASI
         */
        const canvas = document.getElementById('road-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const wheelEl = document.getElementById('wheel');
        const speedDisplay = document.getElementById('speed-display');
        const engineBtn = document.getElementById('engine-select-btn');
        const fsBtn = document.getElementById('fs-btn');
        const fsIcon = document.getElementById('fs-icon');
        const hornBtn = document.getElementById('horn-btn');

        const state = {
            speed: 0,            
            displayedSpeed: 0,   
            maxSpeed: 140,
            roadOffset: 0,
            worldAngle: 0,       
            steering: 0,         
            gas: false,
            brake: false,
            drift: 0,
            skidMarks: []
        };

        // Fullscreen
        fsBtn.addEventListener('click', () => {
            if (document.fullscreenEnabled) {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => console.log(e));
                } else {
                    document.exitFullscreen();
                }
            }
        });

        engineBtn.addEventListener('click', () => {
            const newName = AudioEngine.cycleType();
            engineBtn.innerText = "🔊 Dvigatel: " + newName;
        });

        // Signal tugmasi (Sichqoncha/Touch)
        ['mousedown', 'touchstart'].forEach(e => hornBtn.addEventListener(e, (ev) => {
            ev.preventDefault();
            ev.stopPropagation(); // Rulning burilishiga xalaqit bermasligi uchun
            AudioEngine.playHorn();
            hornBtn.style.transform = "scale(0.9)";
        }));
        ['mouseup', 'touchend', 'mouseleave'].forEach(e => hornBtn.addEventListener(e, (ev) => {
            ev.preventDefault();
            AudioEngine.stopHorn();
            hornBtn.style.transform = "scale(1)";
        }));

        let asphaltPattern;
        function createAsphaltTexture() {
            const size = 512;
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const cx = c.getContext('2d');
            cx.fillStyle = '#262626';
            cx.fillRect(0,0,size,size);
            for(let i=0; i<8000; i++) {
                cx.fillStyle = Math.random() > 0.5 ? '#333' : '#1a1a1a';
                cx.fillRect(Math.random()*size, Math.random()*size, 2, 2);
            }
            return ctx.createPattern(c, 'repeat');
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            asphaltPattern = createAsphaltTexture();
        }
        window.addEventListener('resize', resize);
        resize();

        // RUL BOSHQARUVI
        let isDragging = false;
        let startAngle = 0;
        let currentRotation = 0; 
        const wheelZone = document.getElementById('wheel-zone');

        function getAngle(cx, cy, x, y) {
            return Math.atan2(y - cy, x - cx) * 180 / Math.PI;
        }

        const handleStart = (x, y) => {
            const rect = wheelZone.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            startAngle = getAngle(cx, cy, x, y) - currentRotation;
            isDragging = true;
        };

        const handleMove = (x, y) => {
            if (!isDragging) return;
            const rect = wheelZone.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const angle = getAngle(cx, cy, x, y);
            
            // Yumshoqroq boshqaruv
            let rawRotation = angle - startAngle;
            
            // Cheklov
            if (rawRotation > 130) rawRotation = 130;
            if (rawRotation < -130) rawRotation = -130;
            
            currentRotation = rawRotation;
            updateWheel();
        };

        const handleEnd = () => { isDragging = false; };

        wheelZone.addEventListener('mousedown', e => { if(e.target !== hornBtn) handleStart(e.clientX, e.clientY)});
        window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleEnd);
        
        wheelZone.addEventListener('touchstart', e => { 
            if(e.target !== hornBtn) {
                e.preventDefault(); 
                handleStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
        window.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', handleEnd);

        function updateWheel() {
            wheelEl.style.transform = `rotate(${currentRotation}deg)`;
            // Rul sezgirligini moslashtirish (0 dan 1 gacha)
            state.steering = currentRotation / 130;
        }

        function autoCenterWheel() {
            // Rulni joyiga qaytishini sekinlashtirdik (0.92 dan 0.95 ga)
            // Klaviatura ishlatilmayotgan bo'lsa
            const keySteer = keys['a'] || keys['ArrowLeft'] || keys['d'] || keys['ArrowRight'];
            if (!isDragging && !keySteer && Math.abs(currentRotation) > 0.5) {
                currentRotation *= 0.95; 
                updateWheel();
            }
        }

        // PEDALLAR & BOSHQARUV (GIBRID: Touch + Keyboard)
        const btnGas = document.getElementById('btn-gas');
        const btnBrake = document.getElementById('btn-brake');
        
        // Touch holati
        let touchGas = false;
        let touchBrake = false;

        // Klaviatura holati
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, a: false, s: false, d: false, " ": false
        };

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(e.key) || ['w','a','s','d',' '].includes(k)) {
                if(['w','a','s','d',' '].includes(k)) keys[k] = true;
                else keys[e.key] = true;
            }
            if(e.key === " ") { // Signal uchun Space
                if(!e.repeat) { 
                    AudioEngine.playHorn();
                    hornBtn.style.transform = "scale(0.9)";
                }
            }
            updateControls();
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(e.key) || ['w','a','s','d',' '].includes(k)) {
                if(['w','a','s','d',' '].includes(k)) keys[k] = false;
                else keys[e.key] = false;
            }
            if(e.key === " ") {
                AudioEngine.stopHorn();
                hornBtn.style.transform = "scale(1)";
            }
            updateControls();
        });

        // Touch Events (Yangilangan)
        const setPedal = (type, val) => {
            state[type] = val;
            const el = type === 'gas' ? btnGas : btnBrake;
            if (val) el.classList.add('active'); else el.classList.remove('active');
        };

        ['mousedown', 'touchstart'].forEach(evt => {
            btnGas.addEventListener(evt, (e) => { e.preventDefault(); touchGas = true; updateControls(); });
            btnBrake.addEventListener(evt, (e) => { e.preventDefault(); touchBrake = true; updateControls(); });
        });
        ['mouseup', 'touchend', 'mouseleave', 'touchcancel'].forEach(evt => {
            btnGas.addEventListener(evt, (e) => { e.preventDefault(); touchGas = false; updateControls(); });
            btnBrake.addEventListener(evt, (e) => { e.preventDefault(); touchBrake = false; updateControls(); });
        });

        function updateControls() {
            const isGas = touchGas || keys['w'] || keys['ArrowUp'];
            const isBrake = touchBrake || keys['s'] || keys['ArrowDown'];
            setPedal('gas', isGas);
            setPedal('brake', isBrake);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            AudioEngine.init();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('car-placeholder').style.opacity = '0.3'; 
            loop();
        });

        function loop() {
            updatePhysics();
            render();
            requestAnimationFrame(loop);
        }

        function updatePhysics() {
            // Rul klaviatura orqali
            const leftKey = keys['a'] || keys['ArrowLeft'];
            const rightKey = keys['d'] || keys['ArrowRight'];
            
            if (leftKey) {
                currentRotation -= 5;
                if(currentRotation < -130) currentRotation = -130;
                updateWheel();
            }
            if (rightKey) {
                currentRotation += 5;
                if(currentRotation > 130) currentRotation = 130;
                updateWheel();
            }

            const speedRatio = state.speed / state.maxSpeed;

            // Gaz berish kuchaytirildi
            if (state.gas) {
                // Tezlashish formulasi o'zgardi: past tezlikda kuchliroq
                let acceleration = 0.6 * (1.5 - speedRatio); 
                state.speed += Math.max(0.2, acceleration);
            } else {
                state.speed *= 0.99; // Sekinlashish (ishqalanish)
            }

            if (state.brake) {
                // Tormoz kuchi
                const brakePower = 2.0 + (speedRatio * 1.5);
                state.speed -= brakePower;
                if (speedRatio > 0.2) addSkidMark(); 
            }

            if (state.speed > state.maxSpeed) state.speed = state.maxSpeed;
            if (state.speed < 0) state.speed = 0;

            state.displayedSpeed += (state.speed - state.displayedSpeed) * 0.1;
            state.roadOffset += state.speed * 0.8;

            // Rul burilishi - Tezlikka qarab o'zgaradi
            if (Math.abs(state.steering) > 0.05) {
                // Tez yurayotganda rul kamroq buriladi (stabillik uchun)
                let turnSens = 1.0 - (speedRatio * 0.4); 
                let turnRate = state.steering * speedRatio * 0.15 * turnSens;
                state.worldAngle -= turnRate;
            }

            // Drift hisoblash
            const driftIntensity = Math.max(0, (Math.abs(state.steering) * speedRatio) - 0.2);
            if (driftIntensity > 0.3) {
                state.drift = driftIntensity;
                if (Math.random() > 0.5) addSkidMark();
            } else {
                state.drift *= 0.8; 
            }

            autoCenterWheel();
            AudioEngine.update(speedRatio, state.drift, state.brake);
            speedDisplay.innerText = Math.floor(state.displayedSpeed * 1.8); 
        }

        function addSkidMark() {
            const rearAxleY = 100; // Mashina orqa o'qi joylashuvi
            const wheelOffset = 35; // Katta mashina uchun kengroq
            state.skidMarks.push({ x: -wheelOffset, y: rearAxleY, offsetAtTime: state.roadOffset, age: 0 });
            state.skidMarks.push({ x: wheelOffset, y: rearAxleY, offsetAtTime: state.roadOffset, age: 0 });
        }

        function render() {
            // Orqa fon - o'tloq
            ctx.fillStyle = '#1a5c1a'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height * 0.55; // Kamera burchagi biroz o'zgardi

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(state.worldAngle);
            
            // YO'L KENGLIGI OSHIRILDI
            const roadW = 600; // Oldin 380 edi, endi 600 - KATTA MASHINALAR UCHUN
            
            ctx.fillStyle = asphaltPattern;
            ctx.translate(0, state.roadOffset); 
            
            const drawYStart = -state.roadOffset - 1200;
            const drawH = canvas.height + 2500; 
            ctx.fillRect(-roadW/2, drawYStart, roadW, drawH);
            
            // Yo'l chetlari (Porebrik)
            const stripeH = 120;
            const kerbW = 30;
            const startStripeIndex = Math.floor(state.roadOffset / stripeH) - 15;
            const endStripeIndex = startStripeIndex + 50; 

            for (let i = startStripeIndex; i < endStripeIndex; i++) {
                let sy = -state.roadOffset + (i * stripeH);
                let color = Math.abs(i % 2) === 0 ? '#cc0000' : '#eeeeee';
                ctx.fillStyle = color;
                ctx.fillRect(-roadW/2 - kerbW, sy, kerbW, stripeH); 
                ctx.fillRect(roadW/2, sy, kerbW, stripeH); 
            }

            // O'rta chiziq
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = startStripeIndex; i < endStripeIndex; i++) {
                if (i % 2 === 0) {
                    let sy = -state.roadOffset + (i * stripeH);
                    ctx.fillRect(-8, sy + 20, 16, stripeH - 40);
                }
            }
            ctx.restore();

            // Izlar (Skid marks)
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(state.worldAngle); 

            state.skidMarks.forEach((mark, i) => {
                mark.age++;
                if (mark.age > 80) { // Izlar uzoqroq turadi
                    state.skidMarks.splice(i, 1);
                    return;
                }
                const dist = state.roadOffset - mark.offsetAtTime;
                ctx.fillStyle = `rgba(10, 10, 10, ${0.5 - (mark.age/160)})`;
                ctx.fillRect(mark.x - 8, mark.y + dist, 16, 20); // Qalinroq izlar
            });
            ctx.restore();

            // Tezlik chiziqlari (Shamol effekti)
            if (state.speed > 80) {
                const alpha = (state.speed - 80) / 100;
                ctx.save();
                ctx.globalCompositeOperation = 'overlay';
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let i=0; i<10; i++) {
                    let lx = Math.random() * canvas.width;
                    let ly = Math.random() * canvas.height;
                    ctx.moveTo(lx, ly);
                    ctx.lineTo(cx + (lx-cx)*1.1, ly + (ly-cy)*1.1 + 50);
                }
                ctx.stroke();
                ctx.restore();
            }
        }
    </script>
